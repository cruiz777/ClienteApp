<h2>Restablecer contraseña</h2>

<form [formGroup]="formReset" (ngSubmit)="guardar()">
  <div class="form-group">
    <label>Nueva contraseña</label>
    <input type="password" class="input-field" formControlName="password" placeholder="Mínimo 6 caracteres" />
  </div>

  <div class="form-group">
    <label>Confirmar contraseña</label>
    <input type="password" class="input-field" formControlName="confirmPassword" placeholder="Repite la contraseña" />
  </div>

  <div *ngIf="formReset.errors?.['mismatch']" style="color: red; font-size: 13px;">
    Las contraseñas no coinciden.
  </div>

  <div class="login-button-container">
    <button class="login-button" type="submit" [disabled]="formReset.invalid">Guardar contraseña</button>
  </div>
</form>
