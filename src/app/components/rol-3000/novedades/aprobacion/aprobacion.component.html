<div class="aprobacion-page">
  <div class="form-card" [formGroup]="form">
    <h2>Aprobación</h2>

    <div class="search-container">
      <mat-form-field appearance="outline" class="search-field">
        <mat-label>Buscar</mat-label>
        <input matInput formControlName="buscar" />
      </mat-form-field>
    </div>

    <div class="table-container">
      <table mat-table [dataSource]="solicitudesFiltradas" class="custom-table">

        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef>ID</th>
          <td mat-cell *matCellDef="let row">{{ row.id }}</td>
        </ng-container>

        <ng-container matColumnDef="solicita">
          <th mat-header-cell *matHeaderCellDef>Solicita</th>
          <td mat-cell *matCellDef="let row">{{ row.solicita }}</td>
        </ng-container>

        <ng-container matColumnDef="fecha">
          <th mat-header-cell *matHeaderCellDef>Fecha</th>
          <td mat-cell *matCellDef="let row">{{ row.fecha }}</td>
        </ng-container>

        <ng-container matColumnDef="tiempo">
          <th mat-header-cell *matHeaderCellDef>Tiempo</th>
          <td mat-cell *matCellDef="let row">{{ row.tiempo }}</td>
        </ng-container>

        <ng-container matColumnDef="motivo">
          <th mat-header-cell *matHeaderCellDef>Motivo</th>
          <td mat-cell *matCellDef="let row">{{ row.motivo }}</td>
        </ng-container>

        <ng-container matColumnDef="aprobar">
          <th mat-header-cell *matHeaderCellDef>Aprobar</th>
          <td mat-cell *matCellDef="let row" class="action-cell">
            <button mat-icon-button color="primary" type="button" (click)="aprobar(row)" matTooltip="Aprobar">
              <mat-icon>check_circle</mat-icon>
            </button>
          </td>
        </ng-container>

        <ng-container matColumnDef="negar">
          <th mat-header-cell *matHeaderCellDef>Negar</th>
          <td mat-cell *matCellDef="let row" class="action-cell">
            <button mat-icon-button color="warn" type="button" (click)="negar(row)" matTooltip="Negar">
              <mat-icon>cancel</mat-icon>
            </button>
          </td>
        </ng-container>

        <ng-container matColumnDef="eliminar">
          <th mat-header-cell *matHeaderCellDef>Eliminar</th>
          <td mat-cell *matCellDef="let row" class="action-cell">
            <button mat-icon-button type="button" (click)="eliminar(row)" matTooltip="Eliminar">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <ng-container matColumnDef="reimprimir">
          <th mat-header-cell *matHeaderCellDef>Reimprimir</th>
          <td mat-cell *matCellDef="let row" class="action-cell">
            <button mat-icon-button type="button" (click)="reimprimir(row)" matTooltip="Reimprimir">
              <mat-icon>print</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>
    </div>
  </div>
</div>
