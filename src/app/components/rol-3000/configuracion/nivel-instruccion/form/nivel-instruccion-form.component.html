<div class="form-container" [class.edit-mode]="isEditMode">
  <h2>{{ isEditMode ? 'Editar Nivel de Instrucción' : 'Nuevo Nivel de Instrucción' }}</h2>

  <form [formGroup]="form" (ngSubmit)="guardar()">

    <!-- DESCRIPCIÓN -->
    <div class="form-group">
      <label for="descripcion">Descripción <span class="required">*</span></label>
      <input
        id="descripcion"
        type="text"
        formControlName="descripcion"
        placeholder="Ej: Educación Superior"
        maxlength="248"
      />
      <div class="error" *ngIf="form.get('descripcion')?.touched && form.get('descripcion')?.errors">
        <span *ngIf="form.get('descripcion')?.hasError('required')">Campo obligatorio.</span>
        <span *ngIf="form.get('descripcion')?.hasError('maxlength')">Máximo 248 caracteres.</span>
      </div>
    </div>

    <!-- ESTADO -->
    <div class="form-group checkboxes-group">
      <div class="checkbox-item">
        <label class="checkbox-label">
          <input type="checkbox" formControlName="estado" />
          <span class="checkbox-custom"></span>
          Activo
        </label>
      </div>
    </div>

    <!-- ACCIONES -->
    <div class="form-actions">
      <button
        type="submit"
        [disabled]="form.invalid"
        [ngClass]="isEditMode ? 'btn-rojo' : 'btn-azul'"
      >
        {{ isEditMode ? 'Actualizar' : 'Guardar' }}
      </button>
      <button type="button" class="cancel-button" (click)="cancelar()">Cancelar</button>
    </div>

  </form>
</div>
