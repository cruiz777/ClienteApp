<div class="form-container" [class.edit-mode]="isEditMode">
  <h2>{{ isEditMode ? 'Editar Tipo de Empleado' : 'Nuevo Tipo de Empleado' }}</h2>

  <form [formGroup]="form" (ngSubmit)="guardar()">

    <!-- DESCRIPCIÓN -->
    <div class="form-group">
      <label for="desTipemp">Descripción <span class="required">*</span></label>
      <input
        id="desTipemp"
        type="text"
        formControlName="desTipemp"
        placeholder="Ej: Empleado Permanente"
        maxlength="248"
      />
      <div class="error" *ngIf="form.get('desTipemp')?.touched && form.get('desTipemp')?.errors">
        <span *ngIf="form.get('desTipemp')?.hasError('required')">Campo obligatorio.</span>
        <span *ngIf="form.get('desTipemp')?.hasError('maxlength')">Máximo 248 caracteres.</span>
      </div>
    </div>

    <!-- CUENTAS CONTABLES -->
    <div class="cuentas-grid">

      <div class="form-group">
        <label for="ctaCbleSue1">Cta. Cble. Sueldo 1</label>
        <input
          id="ctaCbleSue1"
          type="text"
          formControlName="ctaCbleSue1"
          placeholder="Ej: 6101001"
          maxlength="50"
        />
        <div class="error" *ngIf="form.get('ctaCbleSue1')?.touched && form.get('ctaCbleSue1')?.errors">
          <span *ngIf="form.get('ctaCbleSue1')?.hasError('maxlength')">Máximo 50 caracteres.</span>
        </div>
      </div>

      <div class="form-group">
        <label for="ctaCbleSue2">Cta. Cble. Sueldo 2</label>
        <input
          id="ctaCbleSue2"
          type="text"
          formControlName="ctaCbleSue2"
          placeholder="Ej: 6101002"
          maxlength="50"
        />
        <div class="error" *ngIf="form.get('ctaCbleSue2')?.touched && form.get('ctaCbleSue2')?.errors">
          <span *ngIf="form.get('ctaCbleSue2')?.hasError('maxlength')">Máximo 50 caracteres.</span>
        </div>
      </div>

      <div class="form-group">
        <label for="ctaCbleSue3">Cta. Cble. Sueldo 3</label>
        <input
          id="ctaCbleSue3"
          type="text"
          formControlName="ctaCbleSue3"
          placeholder="Ej: 6101003"
          maxlength="50"
        />
        <div class="error" *ngIf="form.get('ctaCbleSue3')?.touched && form.get('ctaCbleSue3')?.errors">
          <span *ngIf="form.get('ctaCbleSue3')?.hasError('maxlength')">Máximo 50 caracteres.</span>
        </div>
      </div>

      <div class="form-group">
        <label for="ctaCbleSue4">Cta. Cble. Sueldo 4</label>
        <input
          id="ctaCbleSue4"
          type="text"
          formControlName="ctaCbleSue4"
          placeholder="Ej: 6101004"
          maxlength="50"
        />
        <div class="error" *ngIf="form.get('ctaCbleSue4')?.touched && form.get('ctaCbleSue4')?.errors">
          <span *ngIf="form.get('ctaCbleSue4')?.hasError('maxlength')">Máximo 50 caracteres.</span>
        </div>
      </div>

      <div class="form-group">
        <label for="ctaCbleSue5">Cta. Cble. Sueldo 5</label>
        <input
          id="ctaCbleSue5"
          type="text"
          formControlName="ctaCbleSue5"
          placeholder="Ej: 6101005"
          maxlength="50"
        />
        <div class="error" *ngIf="form.get('ctaCbleSue5')?.touched && form.get('ctaCbleSue5')?.errors">
          <span *ngIf="form.get('ctaCbleSue5')?.hasError('maxlength')">Máximo 50 caracteres.</span>
        </div>
      </div>

    </div>

    <!-- CHECKBOX -->
    <div class="form-group checkboxes-group">
      <div class="checkbox-item">
        <label class="checkbox-label">
          <input type="checkbox" formControlName="swRelDep" />
          <span class="checkbox-custom"></span>
          Relación de Dependencia
        </label>
      </div>
    </div>

    <!-- ACCIONES -->
    <div class="form-actions">
      <button
        type="submit"
        [disabled]="form.invalid"
        [ngClass]="isEditMode ? 'btn-rojo' : 'btn-azul'"
      >
        {{ isEditMode ? 'Actualizar' : 'Guardar' }}
      </button>
      <button type="button" class="cancel-button" (click)="cancelar()">Cancelar</button>
    </div>

  </form>
</div>
