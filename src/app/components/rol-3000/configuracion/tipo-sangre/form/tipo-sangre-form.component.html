<div class="form-container" [class.edit-mode]="isEditMode">
  <h2>{{ isEditMode ? 'Editar Tipo de Sangre' : 'Nuevo Tipo de Sangre' }}</h2>

  <form [formGroup]="form" (ngSubmit)="guardar()">

    <div class="form-group">
      <label for="descripcion">Descripción <span class="required">*</span></label>
      <input
        id="descripcion"
        type="text"
        formControlName="descripcion"
        placeholder="Ej: O+"
        maxlength="100"
      />
      <div class="error" *ngIf="form.get('descripcion')?.touched && form.get('descripcion')?.errors">
        <span *ngIf="form.get('descripcion')?.hasError('required')">Campo obligatorio.</span>
        <span *ngIf="form.get('descripcion')?.hasError('maxlength')">Máximo 100 caracteres.</span>
      </div>
    </div>

    <div class="form-actions">
      <button
        type="submit"
        [disabled]="form.invalid"
        [ngClass]="isEditMode ? 'btn-rojo' : 'btn-azul'"
      >
        {{ isEditMode ? 'Actualizar' : 'Guardar' }}
      </button>
      <button type="button" class="cancel-button" (click)="cancelar()">Cancelar</button>
    </div>

  </form>
</div>
