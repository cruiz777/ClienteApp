<div class="zona-container">
  <div class="zona-header">
    <h2>Impuesto a la Renta</h2>
    <button mat-raised-button class="btn-azul" (click)="abrirCrear()">Nuevo</button>
  </div>

  <div class="zona-busqueda">
    <label for="search">Buscar:</label>
    <div class="input-wrapper">
      <input
        id="search"
        type="text"
        [(ngModel)]="searchTerm"
        (input)="buscar()"
        placeholder="Buscar por id o fracción base"
      />
      <img src="assets/icons/icon-buscar.png" alt="Buscar" />
    </div>
  </div>

  <div class="table-wrap">
    <table class="zona-tabla">
      <thead>
        <tr>
          <th style="width: 80px;">Id</th>
          <th style="width: 140px;">Fracc. Base 1</th>
          <th style="width: 140px;">Fracc. Base 2</th>
          <th style="width: 140px;">Imp. Base</th>
          <th style="width: 140px;">% Excedente</th>
          <th class="col-opcion">Acciones</th>
        </tr>
      </thead>
      <tbody>

        <!-- SKELETON mientras carga -->
        <ng-container *ngIf="loading">
          <tr *ngFor="let _ of skeletonRows" class="skeleton-row">
            <td><span class="skeleton-cell" style="width:40px"></span></td>
            <td><span class="skeleton-cell" style="width:100px"></span></td>
            <td><span class="skeleton-cell" style="width:100px"></span></td>
            <td><span class="skeleton-cell" style="width:100px"></span></td>
            <td><span class="skeleton-cell" style="width:100px"></span></td>
            <td><span class="skeleton-cell" style="width:28px; height:28px; border-radius:6px"></span></td>
          </tr>
        </ng-container>

        <!-- DATOS cargados -->
        <ng-container *ngIf="!loading">
          <tr *ngFor="let it of filtered; trackBy: trackById">
            <td>{{ it.idImpRenta }}</td>
            <td>{{ it.frabas1Ir ?? '—' }}</td>
            <td>{{ it.frabas2Ir ?? '—' }}</td>
            <td>{{ it.impbasIr ?? '—' }}</td>
            <td>{{ it.porexdIr ?? '—' }}</td>
            <td class="acciones">
              <button type="button" class="icon-btn" (click)="abrirEditar(it.idImpRenta)" title="Editar">
                <img src="assets/icons/icon-modificar-3.png" alt="Editar" />
              </button>
            </td>
          </tr>

          <tr *ngIf="filtered.length === 0">
            <td colspan="6" class="empty">No hay resultados.</td>
          </tr>
        </ng-container>

      </tbody>
    </table>
  </div>
</div>
