<div class="form-container" [class.edit-mode]="isEditMode">
  <h2>{{ isEditMode ? 'Editar Cargo' : 'Nuevo Cargo' }}</h2>

  <form [formGroup]="form" (ngSubmit)="guardar()">

    <!-- DESCRIPCIÓN -->
    <div class="form-group">
      <label for="descargo">Descripción <span class="required">*</span></label>
      <input
        id="descargo"
        type="text"
        formControlName="descargo"
        placeholder="Ej: Gerente de Operaciones"
        maxlength="248"
      />
      <div class="error" *ngIf="form.get('descargo')?.touched && form.get('descargo')?.errors">
        <span *ngIf="form.get('descargo')?.hasError('required')">Campo obligatorio.</span>
        <span *ngIf="form.get('descargo')?.hasError('maxlength')">Máximo 248 caracteres.</span>
      </div>
    </div>

    <!-- CÓDIGO SECTORIAL -->
    <div class="form-group">
      <label for="codsec">Código Sectorial</label>
      <input
        id="codsec"
        type="text"
        formControlName="codsec"
        placeholder="Ej: SEC01"
        maxlength="10"
      />
      <div class="error" *ngIf="form.get('codsec')?.touched && form.get('codsec')?.errors">
        <span *ngIf="form.get('codsec')?.hasError('maxlength')">Máximo 10 caracteres.</span>
      </div>
    </div>

    <!-- ID EMPRESA -->
    <div class="form-group">
      <label for="idEmpresa">Id Empresa <span class="required">*</span></label>
      <input
        id="idEmpresa"
        type="number"
        formControlName="idEmpresa"
        placeholder="Ej: 1"
        min="1"
      />
      <div class="error" *ngIf="form.get('idEmpresa')?.touched && form.get('idEmpresa')?.errors">
        <span *ngIf="form.get('idEmpresa')?.hasError('required')">Campo obligatorio.</span>
      </div>
    </div>

    <!-- ID SECTORIAL -->
    <div class="form-group">
      <label for="idSectorial">Id Sectorial</label>
      <input
        id="idSectorial"
        type="number"
        formControlName="idSectorial"
        placeholder="Ej: 2"
        min="1"
      />
    </div>

    <!-- CHECKBOXES -->
    <div class="form-group checkboxes-group">

      <div class="checkbox-item">
        <label class="checkbox-label">
          <input type="checkbox" formControlName="responsable" />
          <span class="checkbox-custom"></span>
          Responsable
        </label>
      </div>

      <div class="checkbox-item">
        <label class="checkbox-label">
          <input type="checkbox" formControlName="horEnf" />
          <span class="checkbox-custom"></span>
          Horario Enfermería
        </label>
      </div>

      <div class="checkbox-item">
        <label class="checkbox-label">
          <input type="checkbox" formControlName="frmensual" />
          <span class="checkbox-custom"></span>
          Fórmula Mensual
        </label>
      </div>

      <div class="checkbox-item">
        <label class="checkbox-label">
          <input type="checkbox" formControlName="estado" />
          <span class="checkbox-custom"></span>
          Activo
        </label>
      </div>

    </div>

    <!-- ACCIONES -->
    <div class="form-actions">
      <button
        type="submit"
        [disabled]="form.invalid"
        [ngClass]="isEditMode ? 'btn-rojo' : 'btn-azul'"
      >
        {{ isEditMode ? 'Actualizar' : 'Guardar' }}
      </button>
      <button type="button" class="cancel-button" (click)="cancelar()">Cancelar</button>
    </div>

  </form>
</div>
