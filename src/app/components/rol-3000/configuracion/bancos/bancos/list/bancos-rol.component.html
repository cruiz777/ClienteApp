<div class="zona-container">
  <div class="zona-header">
    <h2>Bancos</h2>
    <button mat-raised-button class="btn-azul" (click)="abrirCrear()">Nuevo</button>
  </div>

  <div class="zona-busqueda">
    <label for="search">Buscar:</label>
    <div class="input-wrapper">
      <input id="search" type="text" [(ngModel)]="searchTerm" (input)="buscar()" placeholder="Buscar por nombre o código" />
      <img src="assets/icons/icon-buscar.png" alt="Buscar" />
    </div>
  </div>

  <div class="table-wrap">
    <table class="zona-tabla">
      <thead>
        <tr>
          <th style="width: 70px;">Cód. Ban.</th>
          <th>Descripción</th>
          <th style="width: 120px;">Cód. Cuenta</th>
          <th style="width: 130px;">Cta. Contabilidad</th>
          <th>Descripción 2</th>
          <th style="width: 110px;">Cód. Especial</th>
          <th class="col-opcion">Acciones</th>
        </tr>
      </thead>
      <tbody>

        <!-- SKELETON mientras carga -->
        <ng-container *ngIf="loading">
          <tr *ngFor="let _ of skeletonRows" class="skeleton-row">
            <td><span class="skeleton-cell" style="width:40px"></span></td>
            <td><span class="skeleton-cell" style="width:150px"></span></td>
            <td><span class="skeleton-cell" style="width:80px"></span></td>
            <td><span class="skeleton-cell" style="width:90px"></span></td>
            <td><span class="skeleton-cell" style="width:120px"></span></td>
            <td><span class="skeleton-cell" style="width:80px"></span></td>
            <td><span class="skeleton-cell" style="width:28px; height:28px; border-radius:6px"></span></td>
          </tr>
        </ng-container>

        <!-- DATOS cargados -->
        <ng-container *ngIf="!loading">
          <tr *ngFor="let it of filtered; trackBy: trackById">
            <td>{{ it.codban }}</td>
            <td>{{ it.desban }}</td>
            <td>{{ it.codcue ?? '—' }}</td>
            <td>{{ it.ctacontabilidad ?? '—' }}</td>
            <td>{{ it.desban2 ?? '—' }}</td>
            <td>{{ it.codigoEspeacial ?? '—' }}</td>
            <td class="acciones">
              <button type="button" class="icon-btn" (click)="abrirEditar(it.codban)" title="Editar">
                <img src="assets/icons/icon-modificar-3.png" alt="Editar" />
              </button>
            </td>
          </tr>
          <tr *ngIf="filtered.length === 0">
            <td colspan="7" class="empty">No hay resultados.</td>
          </tr>
        </ng-container>

      </tbody>
    </table>
  </div>
</div>
