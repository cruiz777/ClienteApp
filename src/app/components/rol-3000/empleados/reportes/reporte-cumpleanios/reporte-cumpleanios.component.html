<div class="reporte-page">
  <div class="form-card" [formGroup]="form">
    <h2>Reporte de Cumpleaños</h2>

    <div class="form-grid">
      <mat-form-field appearance="outline">
        <mat-label>Fecha Inicial</mat-label>
        <input matInput type="date" formControlName="fechaInicial" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Fecha Final</mat-label>
        <input matInput type="date" formControlName="fechaFinal" />
      </mat-form-field>
    </div>

    <div class="actions">
      <button mat-flat-button color="primary" type="button" (click)="aceptar()">
        Aceptar
      </button>

      <button mat-stroked-button type="button" (click)="cancelar()">
        Cancelar
      </button>
    </div>
  </div>
</div>
