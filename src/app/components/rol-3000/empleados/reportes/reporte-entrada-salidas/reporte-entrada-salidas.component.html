<div class="reporte-page">

  <div
    class="form-card"
    [formGroup]="form">

    <h2>
      Reporte de Entrada y Salidas
    </h2>


    <div class="form-grid">

      <!-- FECHA INICIAL -->

      <mat-form-field appearance="outline">

        <mat-label>
          Fecha Inicial
        </mat-label>

        <input
          matInput
          [matDatepicker]="pickerInicial"
          formControlName="fechaInicial"
          readonly>

        <mat-datepicker-toggle
          matIconSuffix
          [for]="pickerInicial">
        </mat-datepicker-toggle>

        <mat-datepicker
          #pickerInicial>
        </mat-datepicker>

      </mat-form-field>


      <!-- FECHA FINAL -->

      <mat-form-field appearance="outline">

        <mat-label>
          Fecha Final
        </mat-label>

        <input
          matInput
          [matDatepicker]="pickerFinal"
          formControlName="fechaFinal"
          readonly>

        <mat-datepicker-toggle
          matIconSuffix
          [for]="pickerFinal">
        </mat-datepicker-toggle>

        <mat-datepicker
          #pickerFinal>
        </mat-datepicker>

      </mat-form-field>

    </div>


    <!-- TIPO DE FECHA -->

    <div class="tipo-fecha">

      <span class="tipo-fecha-label">
        Buscar por:
      </span>


      <mat-radio-group
        formControlName="tipoFecha">

        <mat-radio-button
          [value]="1">

          Fecha de Entrada

        </mat-radio-button>


        <mat-radio-button
          [value]="2">

          Fecha de Salida

        </mat-radio-button>

      </mat-radio-group>

    </div>


    <!-- BOTONES -->

    <div class="actions">

      <button
        mat-flat-button
        color="primary"
        type="button"
        [disabled]="cargando"
        (click)="aceptar()">

        {{
          cargando
            ? 'Generando...'
            : 'Aceptar'
        }}

      </button>


      <button
        mat-stroked-button
        type="button"
        [disabled]="cargando"
        (click)="cancelar()">

        Cancelar

      </button>

    </div>

  </div>

</div>
