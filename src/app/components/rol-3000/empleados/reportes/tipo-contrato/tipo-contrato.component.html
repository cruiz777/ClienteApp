<div class="tipo-contrato-page">
  <div class="form-card" [formGroup]="form">
    <h2>Tipo de Contrato</h2>

    <div class="search-container">
      <mat-form-field appearance="outline" class="search-field">
        <mat-label>Buscar por Nombre</mat-label>
        <input matInput formControlName="buscarNombre" />
      </mat-form-field>
    </div>

    <div class="table-container">
      <table mat-table [dataSource]="empleadosFiltrados" class="custom-table">

        <ng-container matColumnDef="secuencia">
          <th mat-header-cell *matHeaderCellDef></th>
          <td mat-cell *matCellDef="let row">{{ row.secuencia }}</td>
        </ng-container>

        <ng-container matColumnDef="codigo">
          <th mat-header-cell *matHeaderCellDef>Código</th>
          <td mat-cell *matCellDef="let row">{{ row.codigo }}</td>
        </ng-container>

        <ng-container matColumnDef="cedula">
          <th mat-header-cell *matHeaderCellDef>Cédula</th>
          <td mat-cell *matCellDef="let row">{{ row.cedula }}</td>
        </ng-container>

        <ng-container matColumnDef="nombre">
          <th mat-header-cell *matHeaderCellDef>Nombre</th>
          <td mat-cell *matCellDef="let row">{{ row.nombre }}</td>
        </ng-container>

        <ng-container matColumnDef="cargo">
          <th mat-header-cell *matHeaderCellDef>Cargo</th>
          <td mat-cell *matCellDef="let row">{{ row.cargo }}</td>
        </ng-container>

        <ng-container matColumnDef="tipoContrato">
          <th mat-header-cell *matHeaderCellDef>Tipo de Contrato 1</th>
          <td mat-cell *matCellDef="let row">{{ row.tipoContrato }}</td>
        </ng-container>

        <ng-container matColumnDef="fechaInicial">
          <th mat-header-cell *matHeaderCellDef>F.I Inicial</th>
          <td mat-cell *matCellDef="let row">{{ row.fechaInicial }}</td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>
    </div>
  </div>
</div>
