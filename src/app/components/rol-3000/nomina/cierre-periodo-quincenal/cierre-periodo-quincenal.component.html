<div class="cierre-page">
  <div class="form-card" [formGroup]="form">
    <h2>Cierre de Periodo Quincenal</h2>

    <div class="form-grid">
      <mat-form-field appearance="outline" class="fecha-field">
        <mat-label>Fecha de Quincena</mat-label>

        <input
          matInput
          [matDatepicker]="pickerPeriodo"
          formControlName="fecha"
          [matDatepickerFilter]="soloDiaQuince"
          readonly />

        <mat-datepicker-toggle matSuffix [for]="pickerPeriodo">
        </mat-datepicker-toggle>

        <mat-datepicker #pickerPeriodo></mat-datepicker>

        <mat-error *ngIf="form.get('fecha')?.hasError('required')">
          La fecha es obligatoria
        </mat-error>

        <mat-error *ngIf="form.get('fecha')?.hasError('fechaInvalida')">
          Solo puede seleccionar el día 15 del mes.
        </mat-error>
      </mat-form-field>
    </div>

    <div class="actions">
      <button
        mat-flat-button
        color="primary"
        type="button"
        [disabled]="procesando"
        (click)="cierre()">
        {{ procesando ? 'Cerrando...' : 'Cierre' }}
      </button>

      <button
        mat-stroked-button
        type="button"
        [disabled]="procesando"
        (click)="cancelar()">
        Cancelar
      </button>
    </div>
  </div>
</div>
