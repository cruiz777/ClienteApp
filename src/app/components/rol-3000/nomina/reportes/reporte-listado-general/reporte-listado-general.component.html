<div class="rol-page">

  <div
    class="rol-card"
    [formGroup]="form">


    <!-- ================================================
         HEADER
    ================================================= -->

    <div class="card-header">

      <h2>
        Reporte Listado General
      </h2>

    </div>


    <!-- ================================================
         FILTROS
    ================================================= -->

    <div class="form-grid">


      <!-- PERIODO INICIAL -->

      <mat-form-field
        appearance="outline">

        <mat-label>
          Periodo Inicial
        </mat-label>

        <input
          matInput
          type="date"
          formControlName="periodoInicial"
          [disabled]="generando" />

        <mat-error
          *ngIf="
            form.get('periodoInicial')?.hasError('required')
            &&
            form.get('periodoInicial')?.touched
          ">

          El período inicial es obligatorio

        </mat-error>

      </mat-form-field>


      <!-- PERIODO FINAL -->

      <mat-form-field
        appearance="outline">

        <mat-label>
          Periodo Final
        </mat-label>

        <input
          matInput
          type="date"
          formControlName="periodoFinal"
          [disabled]="generando" />

        <mat-error
          *ngIf="
            form.get('periodoFinal')?.hasError('required')
            &&
            form.get('periodoFinal')?.touched
          ">

          El período final es obligatorio

        </mat-error>

      </mat-form-field>


      <!-- EMPLEADO -->

      <mat-form-field
        appearance="outline">

        <mat-label>
          Empleado
        </mat-label>

        <input
          matInput
          type="number"
          formControlName="empleado"
          [disabled]="generando" />

        <mat-hint>
          Código del empleado
        </mat-hint>

      </mat-form-field>


      <!-- INICIAL -->

      <mat-form-field
        appearance="outline">

        <mat-label>
          {{ labelInicial }}
        </mat-label>

        <mat-select
          formControlName="areaInicial"
          [disabled]="generando">

          <mat-option
            [value]="null">

            Todas

          </mat-option>


          <mat-option
            *ngFor="let opcion of opcionesFiltro"
            [value]="opcion.id">

            {{ opcion.nombre }}

          </mat-option>

        </mat-select>

      </mat-form-field>


      <!-- FINAL -->

      <mat-form-field
        appearance="outline">

        <mat-label>
          {{ labelFinal }}
        </mat-label>

        <mat-select
          formControlName="areaFinal"
          [disabled]="generando">

          <mat-option
            [value]="null">

            Todas

          </mat-option>


          <mat-option
            *ngFor="let opcion of opcionesFiltro"
            [value]="opcion.id">

            {{ opcion.nombre }}

          </mat-option>

        </mat-select>

      </mat-form-field>

    </div>


    <!-- ================================================
         TIPO LISTADO
    ================================================= -->

    <div class="radio-group">

      <mat-radio-group
        formControlName="tipoListado">


        <mat-radio-button
          value="areas"
          [disabled]="generando">

          Áreas

        </mat-radio-button>


        <mat-radio-button
          value="departamentos"
          [disabled]="generando">

          Departamentos

        </mat-radio-button>

      </mat-radio-group>

    </div>


    <!-- ================================================
         GENERANDO
    ================================================= -->

    <div
      class="generando-container"
      *ngIf="generando">

      <mat-spinner
        diameter="30">
      </mat-spinner>

      <span>
        Generando reportes...
      </span>

    </div>


    <!-- ================================================
         ACCIONES
    ================================================= -->

    <div class="actions">


      <button
        mat-flat-button
        color="primary"
        type="button"
        [disabled]="generando"
        (click)="aceptar()">

        <mat-icon
          *ngIf="!generando">
          picture_as_pdf
        </mat-icon>

        {{ generando
          ? 'Generando...'
          : 'Aceptar'
        }}

      </button>


      <button
        mat-stroked-button
        type="button"
        [disabled]="generando"
        (click)="cancelar()">

        <mat-icon>
          close
        </mat-icon>

        Cancelar

      </button>

    </div>

  </div>

</div>
