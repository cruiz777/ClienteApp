<div class="reporte-page">

  <div
    class="form-card"
    [formGroup]="form">

    <!-- CABECERA -->
    <div class="header-section">

      <div class="header-icon">
        <mat-icon>
          account_balance
        </mat-icon>
      </div>

      <div>
        <h2>
          Generación Aviso Nuevo Sueldo IESS
        </h2>

        <p>
          Seleccione el período correspondiente al cambio de sueldo.
        </p>
      </div>

    </div>


    <!-- CONTENIDO -->
    <div class="content-block">

      <mat-form-field
  appearance="outline"
  class="periodo-field">

  <mat-label>
    Período a generar
  </mat-label>

  <input
    matInput
    [matDatepicker]="pickerPeriodo"
    formControlName="periodo"
    readonly />

  <mat-datepicker-toggle
    matSuffix
    [for]="pickerPeriodo">
  </mat-datepicker-toggle>

  <mat-datepicker
    #pickerPeriodo>
  </mat-datepicker>

  <mat-error
    *ngIf="
      form
        .get('periodo')
        ?.hasError('required')
    ">
    El período es obligatorio.
  </mat-error>

</mat-form-field>

    </div>


    <!-- ACCIONES -->
    <div class="actions">

      <!-- ARCHIVO IESS -->
      <button
        mat-flat-button
        color="primary"
        type="button"

        [disabled]="
          generandoArchivo ||
          generandoReporte
        "

        (click)="generarArchivo()">

        <mat-icon>
          description
        </mat-icon>

        <span *ngIf="!generandoArchivo">
          Generar Archivo IESS
        </span>

        <span *ngIf="generandoArchivo">
          Generando...
        </span>

      </button>


      <!-- REPORTE -->
      <button
        mat-stroked-button
        type="button"

        class="btn-reporte"

        [disabled]="
          generandoArchivo ||
          generandoReporte
        "

        (click)="generarReporte()">

        <mat-icon>
          picture_as_pdf
        </mat-icon>

        <span *ngIf="!generandoReporte">
          Reporte
        </span>

        <span *ngIf="generandoReporte">
          Generando...
        </span>

      </button>


      <!-- CANCELAR -->
      <button
        mat-stroked-button
        type="button"

        class="btn-cancelar"

        [disabled]="
          generandoArchivo ||
          generandoReporte
        "

        (click)="cancelar()">

        <mat-icon>
          close
        </mat-icon>

        Cancelar

      </button>

    </div>

  </div>

</div>
