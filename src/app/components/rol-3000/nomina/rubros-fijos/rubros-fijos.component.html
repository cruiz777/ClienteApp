<div class="rubros-page">
  <div class="form-card">
    <h2>Rubros Fijos</h2>

    <div class="top-section">
      <!-- árbol locales -->
      <div class="tree-card small-card">
        <div class="tree-header"> </div>
        <div class="tree-body">
          <ng-container *ngFor="let node of localesTree">
            <div class="tree-node root">
              <div class="node-line">
                <button class="toggle-btn" type="button" (click)="toggleNode(node)">
                  {{ node.expanded ? '−' : '+' }}
                </button>
                <mat-checkbox
                  [checked]="node.checked"
                  (change)="toggleCheck(node)">
                </mat-checkbox>
                <span class="folder">📁</span>
                <span class="node-label">{{ node.label }}</span>
              </div>

              <div class="children" *ngIf="node.expanded">
                <div class="tree-node child" *ngFor="let child of node.children">
                  <div class="node-line">
                    <span class="indent"></span>
                    <mat-checkbox
                      [checked]="child.checked"
                      (change)="toggleCheck(child)">
                    </mat-checkbox>
                    <span class="folder">📁</span>
                    <span class="node-label">{{ child.label }}</span>
                  </div>
                </div>
              </div>
            </div>
          </ng-container>
        </div>
      </div>

      <!-- árbol rubros -->
      <div class="tree-card small-card">
        <div class="tree-header"> </div>
        <div class="tree-body">
          <ng-container *ngFor="let node of rubrosTree">
            <div class="tree-node root">
              <div class="node-line">
                <button class="toggle-btn" type="button" (click)="toggleNode(node)">
                  {{ node.expanded ? '−' : '+' }}
                </button>
                <span class="folder">📁</span>
                <span class="node-label">{{ node.label }}</span>
              </div>

              <div class="children" *ngIf="node.expanded">
                <div class="tree-node child" *ngFor="let child of node.children">
                  <div class="node-line">
                    <span class="indent"></span>
                    <span class="plus">+</span>
                    <span class="node-label">{{ child.label }}</span>
                  </div>
                </div>
              </div>
            </div>
          </ng-container>
        </div>
      </div>
    </div>

    <div class="table-wrapper">
      <table mat-table [dataSource]="dataSource" class="custom-table">

        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef></th>
          <td mat-cell *matCellDef="let row">{{ row.id }}</td>
        </ng-container>

        <ng-container matColumnDef="codigo">
          <th mat-header-cell *matHeaderCellDef>Código</th>
          <td mat-cell *matCellDef="let row">{{ row.codigo }}</td>
        </ng-container>

        <ng-container matColumnDef="nombre">
          <th mat-header-cell *matHeaderCellDef>Nombre</th>
          <td mat-cell *matCellDef="let row">{{ row.nombre }}</td>
        </ng-container>

        <ng-container matColumnDef="valor">
          <th mat-header-cell *matHeaderCellDef>Valor</th>
          <td mat-cell *matCellDef="let row">{{ row.valor ?? '' }}</td>
        </ng-container>

        <ng-container matColumnDef="noCuenta">
          <th mat-header-cell *matHeaderCellDef>No. Cuenta</th>
          <td mat-cell *matCellDef="let row">{{ row.noCuenta }}</td>
        </ng-container>

        <ng-container matColumnDef="cuentaPagada">
          <th mat-header-cell *matHeaderCellDef>Cuenta Pagada</th>
          <td mat-cell *matCellDef="let row">{{ row.cuentaPagada }}</td>
        </ng-container>

        <ng-container matColumnDef="observaciones">
          <th mat-header-cell *matHeaderCellDef>Observaciones</th>
          <td mat-cell *matCellDef="let row">{{ row.observaciones }}</td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>
    </div>

    <div class="middle-actions">
      <button mat-stroked-button type="button" (click)="cargarEmpleados()">
        Cargar Empleados
      </button>

      <button mat-stroked-button type="button" (click)="cargarGlobal()">
        Cargar Global
      </button>
    </div>

    <div class="bottom-actions">
      <button mat-stroked-button type="button" (click)="nuevo()">Nuevo</button>
      <button mat-stroked-button type="button" (click)="grabar()">Grabar</button>
      <button mat-stroked-button type="button" (click)="exportar()">Exportar</button>
      <button mat-stroked-button type="button" (click)="cancelar()">Cancelar</button>
    </div>
  </div>
</div>
