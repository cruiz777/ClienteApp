<div class="decimo-tercero-container" [formGroup]="form">
  <!-- Título con período -->
  <div class="title">
    <h2>Décimo Tercero</h2>
    <span class="periodo-label" *ngIf="mostrarPeriodo">
      Período: {{ periodoLabel }}
    </span>
  </div>

  <div class="filters-grid">
    <div class="field-group">
      <label>Empresa:</label>
      <mat-form-field appearance="outline">
        <mat-select formControlName="idEmpresa">
          <mat-option *ngFor="let emp of empresas" [value]="emp.idEmpresa">
            {{ emp.nombre }}
          </mat-option>
        </mat-select>
      </mat-form-field>
    </div>

    <div class="field-group">
      <label>Tipo de Empleado:</label>
      <mat-form-field appearance="outline">
        <mat-select formControlName="idTipEmp">
          <mat-option *ngFor="let tipo of tiposEmpleado" [value]="tipo.idTipemp">
            {{ tipo.desTipemp }}
          </mat-option>
        </mat-select>
      </mat-form-field>
    </div>

    <div class="field-group">
      <label>Periodo:</label>
      <mat-form-field appearance="outline">
        <input matInput [matDatepicker]="picker" formControlName="fechaHasta" />
        <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
        <mat-datepicker #picker></mat-datepicker>
      </mat-form-field>
    </div>
  </div>

  <!-- AG GRID -->
  <div class="grid-wrapper">
    <ag-grid-angular
      class="ag-theme-alpine"
      style="width: 100%; height: 400px;"
      [rowData]="rowData"
      [columnDefs]="columnDefs"
      [defaultColDef]="defaultColDef"
      (gridReady)="onGridReady($event)"
      (cellValueChanged)="onCellValueChanged($event)">
    </ag-grid-angular>
  </div>

  <div class="bottom-section">
    <div class="actions">
      <button mat-stroked-button type="button" (click)="calcular()" [disabled]="loading">
        <span *ngIf="!loading">Calcular</span>
        <span *ngIf="loading">Calculando...</span>
      </button>
      <button mat-stroked-button type="button" (click)="grabar()" [disabled]="grabando || !rowData.length">
        <span *ngIf="!grabando">Grabar</span>
        <span *ngIf="grabando">Grabando...</span>
      </button>
      <button mat-stroked-button [matMenuTriggerFor]="menuExportar">
        Exportar ▾
      </button>

      <mat-menu #menuExportar="matMenu">
        <button mat-menu-item (click)="exportar('pdf')">
          PDF
        </button>
        <button mat-menu-item (click)="exportar('excel')">
          Excel
        </button>
      </mat-menu>
      <button mat-stroked-button type="button" (click)="cancelar()">Cancelar</button>
    </div>

    <div class="summary-box">
      <div class="summary-row">
        <span>Total Décimo Tercero</span>
        <strong>{{ formatMoneda(totalValorDecimo) }}</strong>
      </div>
      <div class="summary-row">
        <span>Descuento</span>
        <strong>{{ formatMoneda(totalDescuento) }}</strong>
      </div>
      <div class="summary-row">
        <span>Retención Judicial</span>
        <strong>{{ formatMoneda(totalRetJudicial) }}</strong>
      </div>
      <div class="summary-row total-row">
        <span>Líquido a Recibir</span>
        <strong>{{ formatMoneda(totalLiquido) }}</strong>
      </div>
    </div>
  </div>
</div>
