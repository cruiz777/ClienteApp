<mat-sidenav-container class="sidenav-container" [ngClass]="{
  'collapsed': !isExpanded && !isHandset,
  'mobile': isHandset
}">

  <!-- SIDEBAR -->
  <mat-sidenav #drawer
              class="sidenav"
              [mode]="isHandset ? 'over' : 'side'"
              [opened]="!isHandset || isExpanded"
              [class.collapsed]="!isExpanded && !isHandset"
              [fixedInViewport]="true"
              (backdropClick)="isExpanded = false">

    <!-- Logos -->
   <div class="logo-seguridad" *ngIf="isExpanded">
    <a [routerLink]="['/menus/codbar']">
      <img src="assets/logo/CODBAR-GS1.png" alt="Logo">
    </a>
  </div>
    
    <!-- Menú Principal -->
    <mat-nav-list>

      <!-- Toggle Sidebar -->
      <mat-list-item (click)="toggleSidebar()" class="menu-toggle">
        <mat-icon>menu</mat-icon>
        <span *ngIf="isExpanded" class="menu-text">Menú</span>
      </mat-list-item>

      <!-- Menu Items -->
      <mat-list-item routerLink="/pages/nclientes" class="menu-item-nav">
        <div class="menu-item">
          <img src="assets/icons/ecop-nuevo-cliente.png" class="menu-icon">
          <span *ngIf="isExpanded" class="menu-text">Nuevo Cliente</span>
        </div>
      </mat-list-item>

      <mat-list-item *ngIf="usuarioActual?.id_usuario === 1" routerLink="/pages/explorador-clientes" class="menu-item-nav">
        <div class="menu-item">
          <img src="assets/icons/Ecop-explorador-clientes.png" class="menu-icon">
          <span *ngIf="isExpanded" class="menu-text">Explorador de Cliente</span>
        </div>
      </mat-list-item>

      <mat-list-item routerLink="/pages/consulta-verified" class="menu-item-nav">
        <div class="menu-item">
          <img src="assets/icons/ecop-.png" class="menu-icon">
          <span *ngIf="isExpanded" class="menu-text">Consulta Verified</span>
        </div>
      </mat-list-item>

      <!-- Salir -->
      <mat-list-item routerLink="/menus/codbar" class="salir-item">
        <div class="menu-item">
          <img src="assets/icons/icon-salir.png" class="menu-icon">
          <span *ngIf="isExpanded" class="menu-text salir-text">Salir</span>
        </div>
      </mat-list-item>

    </mat-nav-list>

  </mat-sidenav>

  <!-- CONTENIDO PRINCIPAL -->
  <mat-sidenav-content [ngClass]="isExpanded ? 'content-default' : 'content-collapsed'">
    <router-outlet></router-outlet>
    <footer class="app-footer" [ngClass]="{ 'footer-collapsed': !isExpanded && !isHandset }">
  <div class="footer-left">{{ currentDateTime }}</div>
  <div class="footer-center">
    <img src="assets/logo/logo-gap.png" alt="GAP System" class="footer-logo">
    <span class="footer-phone">Telf: 099 970 0288 / 022 464 951</span>
  </div>
  <div class="footer-right">{{ usuarioActual?.nombre_usuario }}</div>
</footer>

  </mat-sidenav-content>

</mat-sidenav-container>
