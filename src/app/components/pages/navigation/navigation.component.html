<mat-sidenav-container class="sidenav-container" [ngClass]="{
  'collapsed': !isExpanded && !isHandset,
  'mobile': isHandset
}">

  <!-- SIDEBAR -->
  <mat-sidenav #drawer
              class="sidenav"
              [mode]="isHandset ? 'over' : 'side'"
              [opened]="!isHandset || isExpanded"
              [class.collapsed]="!isExpanded && !isHandset"
              [fixedInViewport]="true"
              (backdropClick)="isExpanded = false">

    <!-- Logos -->
    <div class="logo-seguridad" *ngIf="isExpanded">
      <img src="assets/logo/CODBAR-GS1.png" alt="Logo">
    </div>

    <!-- Menú Principal -->
    <mat-nav-list>

      <!-- Toggle Sidebar -->
      <mat-list-item (click)="toggleSidebar()" class="menu-toggle">
        <mat-icon>menu</mat-icon>
        <span *ngIf="isExpanded" class="menu-text">Menú</span>
      </mat-list-item>

      <!-- Acordeón -->
      <mat-accordion [multi]="false">

       
        <mat-expansion-panel>
          <mat-expansion-panel-header>
            <mat-panel-title routerLink="/pages/nclientes">
              <img src="assets/icons/ecop-nuevo-cliente.png" class="menu-icon">
              <span *ngIf="isExpanded" class="menu-text">Nuevo Cliente</span>
            </mat-panel-title>
          </mat-expansion-panel-header>
        </mat-expansion-panel>
        <mat-expansion-panel>
          <mat-expansion-panel-header>
            <mat-panel-title routerLink="/pages/nclientes">
              <img src="assets/icons/Ecop-explorador-clientes.png" class="menu-icon">
              <span *ngIf="isExpanded" class="menu-text">Explorador de Ciente</span>
            </mat-panel-title>
          </mat-expansion-panel-header>
        </mat-expansion-panel>
        <mat-expansion-panel>
          <mat-expansion-panel-header>
            <mat-panel-title routerLink="/pages/nclientes">
              <img src="assets/icons/Ecop-envio-veried.png" class="menu-icon">
              <span *ngIf="isExpanded" class="menu-text">Envío Verified GS1</span>
            </mat-panel-title>
          </mat-expansion-panel-header>
        </mat-expansion-panel>
        <mat-expansion-panel>
          <mat-expansion-panel-header>
            <mat-panel-title routerLink="/pages/nclientes">
              <img src="assets/icons/ecop-.png" class="menu-icon">
              <span *ngIf="isExpanded" class="menu-text">Verified</span>
            </mat-panel-title>
          </mat-expansion-panel-header>
        </mat-expansion-panel>
        

       
      </mat-accordion>

      <!-- Salir -->
      <mat-list-item routerLink="/menus" class="salir-item">
        <div class="menu-item">
          <img src="assets/icons/icon-salir.png" class="menu-icon">
          <span *ngIf="isExpanded" class="menu-text salir-text">Salir</span>
        </div>
      </mat-list-item>

    </mat-nav-list>

  </mat-sidenav>

  <!-- CONTENIDO PRINCIPAL -->
  <mat-sidenav-content [ngClass]="isExpanded ? 'content-default' : 'content-collapsed'">
    <router-outlet></router-outlet>
    <footer class="app-footer" [ngClass]="{ 'footer-collapsed': !isExpanded && !isHandset }">
      <div class="footer-left">{{ currentDateTime }}</div>
      <div class="footer-center">
        <img src="assets/logo/logo-gap.png" alt="GAP System" class="footer-logo">
        <span class="footer-phone">Telf: 022 453 846 / 022 464 951</span>
      </div>
    </footer>
  </mat-sidenav-content>

</mat-sidenav-container>
