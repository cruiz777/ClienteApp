<h2 mat-dialog-title>Editar Prefijo</h2>

<mat-dialog-content [formGroup]="formPrefijo">
  <table style="width: 100%; border-collapse: collapse;">
    <tr>
      <td style="width: 15%;"><label class="form-label">Código:</label></td>
      <td style="width: 35%;">
        <input type="text" formControlName="clientesCodigo" readonly style="border: none; outline: none; box-shadow: none; width: 100%;" />
      </td>
      <td style="width: 15%;"><label class="form-label">Cliente:</label></td>
      <td style="width: 35%;">
        <input type="text" formControlName="nomcli" readonly style="border: none; outline: none; box-shadow: none; width: 100%;" />
      </td>
    </tr>

    <tr>
      <td><label class="form-label">RUC:</label></td>
      <td><input type="text" formControlName="ruccli" readonly style="border: none; outline: none; box-shadow: none; width: 100%;" /></td>
      <td><label class="form-label">Prefijo:</label></td>
      <td><input type="text" formControlName="codpre" readonly style="border: none; outline: none; box-shadow: none; width: 100%;" /></td>
    </tr>

    <tr>
      <td><label class="form-label">Prefijo GS1:</label></td>
      <td><input type="text" formControlName="prefijosgs1" readonly style="border: none; outline: none; box-shadow: none; width: 100%;" /></td>
      <td><label class="form-label">Origen Prefijo:</label></td>
      <td><input type="text" formControlName="origenPrefijo" readonly style="border: none; outline: none; box-shadow: none; width: 100%;" /></td>
    </tr>

    <tr>
      <td><label class="form-label">Fecha:</label></td>
      <td>
        <input type="text" [value]="formPrefijo.get('fecha')?.value | date:'dd/MM/yyyy'" readonly style="border: none; outline: none; box-shadow: none; width: 100%;" />
      </td>
      <td><label class="form-label">Fecha Cierre:</label></td>
      <td>
       <input
  *ngIf="esFechaValida(formPrefijo.get('fechaCierre')?.value)"
  type="text"
  [value]="formPrefijo.get('fechaCierre')?.value | date:'dd/MM/yyyy'"
  readonly
  style="border: none; outline: none; box-shadow: none; width: 100%;" />
      </td>
    </tr>

    <tr>
      <td><label class="form-label">GLN:</label></td>
      <td><input type="text" formControlName="gln" readonly style="border: none; outline: none; box-shadow: none; width: 100%;" /></td>
      <td></td>
      <td></td>
    </tr>

    <tr>
  <td><label class="form-label">Observación:</label></td>
  <td colspan="3">
    <input
  type="text"
  formControlName="observacion"
  (input)="onObservacionInput($event)"
  style="width: 100%; border: none; outline: none; box-shadow: none;" />

  </td>
</tr>


    <tr>
      <td><label class="form-label">Desactivar:</label></td>
      <td colspan="3">
        <input type="checkbox" formControlName="estado"   (change)="onToggleDesactivar($event)" />
      </td>
    </tr>
  </table>
 <input type="text" formControlName="id_prefijos" style="display: none;" />

</mat-dialog-content>

<mat-dialog-actions align="center">
  <button mat-button color="primary" (click)="guardar()">
    <img src="assets/icons/icon-grabar.png" alt="Guardar" width="18" height="18" style="margin-right: 6px;" />
    Guardar
  </button>
  <button mat-button color="primary">
    <img src="assets/icons/icon-imprimir.png" alt="Imprimir" width="18" height="18" style="margin-right: 6px;" />
    Imprimir
  </button>

  <button mat-button (click)="cerrar()">
  <img src="assets/icons/icon-salir.png" alt="Salir" width="18" height="18" style="margin-right: 6px;" />
  Salir
</button>

</mat-dialog-actions>
