<!-- MENÚ DE SEGURIDADES CON PERMISOS DINÁMICOS -->
<mat-sidenav-container class="sidenav-container" [ngClass]="{
  'collapsed': !isExpanded && !isHandset,
  'mobile': isHandset
}">

  <!-- SIDEBAR -->
  <mat-sidenav #drawer
              class="sidenav"
              [mode]="isHandset ? 'over' : 'side'"
              [opened]="!isHandset || isExpanded"
              [class.collapsed]="!isExpanded && !isHandset"
              [fixedInViewport]="true"
              (backdropClick)="isExpanded = false">

    <!-- Logo -->
    <div class="logo-seguridad" *ngIf="isExpanded">
      <a [routerLink]="['/inicio']">
        <img src="assets/logo/seguridad.png" alt="Logo Seguridad">
      </a>
    </div>

    <!-- Menú Principal -->
    <mat-nav-list>

      <!-- Toggle Sidebar -->
      <mat-list-item (click)="toggleSidebar()" class="menu-toggle">
        <mat-icon>menu</mat-icon>
        <span *ngIf="isExpanded" class="menu-text">Menú</span>
      </mat-list-item>

      <!-- Acordeón Principal -->
      <mat-accordion [multi]="false">

        <!-- 👥 USUARIOS/PERFILES - SIEMPRE VISIBLE, ACCESO CONTROLADO -->
        <mat-expansion-panel>
          <mat-expansion-panel-header>
            <mat-panel-title>
              <img src="assets/icons/icon-Usuario-perfil.png" class="menu-icon">
              <span *ngIf="isExpanded" class="menu-text">Usuarios/Perfiles</span>
            </mat-panel-title>
          </mat-expansion-panel-header>

          <!-- Usuarios -->
          <a mat-list-item 
             [routerLink]="((menuPermisos$ | async)?.usuarios?.acceso) ? '/seguridades/usuarios' : null"
             [class.disabled]="!((menuPermisos$ | async)?.usuarios?.acceso)"
             (click)="manejarClick('/seguridades/usuarios', $event)">
            <span *ngIf="isExpanded" class="menu-text">Usuarios</span>
            <mat-icon *ngIf="!((menuPermisos$ | async)?.usuarios?.acceso)" class="lock-icon">lock</mat-icon>
          </a>

          <!-- Perfiles -->
          <a mat-list-item 
             [routerLink]="((menuPermisos$ | async)?.perfiles?.acceso) ? '/seguridades/perfiles' : null"
             [class.disabled]="!((menuPermisos$ | async)?.perfiles?.acceso)"
             (click)="manejarClick('/seguridades/perfiles', $event)">
            <span *ngIf="isExpanded" class="menu-text">Perfil</span>
            <mat-icon *ngIf="!((menuPermisos$ | async)?.perfiles?.acceso)" class="lock-icon">lock</mat-icon>
          </a>

          <!-- Departamentos -->
          <a mat-list-item 
             [routerLink]="((menuPermisos$ | async)?.departamentos?.acceso) ? '/seguridades/departamentos' : null"
             [class.disabled]="!((menuPermisos$ | async)?.departamentos?.acceso)"
             (click)="manejarClick('/seguridades/departamentos', $event)">
            <span *ngIf="isExpanded" class="menu-text">Departamentos</span>
            <mat-icon *ngIf="!((menuPermisos$ | async)?.departamentos?.acceso)" class="lock-icon">lock</mat-icon>
          </a>

        </mat-expansion-panel>

        <!-- 🏢 ENTIDADES - SIEMPRE VISIBLE -->
        <mat-expansion-panel>
          <mat-expansion-panel-header>
            <mat-panel-title>
              <img src="assets/icons/icon-entidad-1.png" class="menu-icon">
              <span *ngIf="isExpanded" class="menu-text">Entidades</span>
            </mat-panel-title>
          </mat-expansion-panel-header>

          <a mat-list-item 
             [routerLink]="((menuPermisos$ | async)?.entidades?.acceso) ? '/seguridades/entidades' : null"
             [class.disabled]="!((menuPermisos$ | async)?.entidades?.acceso)"
             (click)="manejarClick('/seguridades/entidades', $event)">
            <span *ngIf="isExpanded" class="menu-text">Entidades</span>
            <mat-icon *ngIf="!((menuPermisos$ | async)?.entidades?.acceso)" class="lock-icon">lock</mat-icon>
          </a>

        </mat-expansion-panel>

        <!-- ⚙️ CONFIGURACIÓN GENERAL - SIEMPRE VISIBLE -->
        <mat-expansion-panel>
          <mat-expansion-panel-header>
            <mat-panel-title>
              <img src="assets/icons/icon-mantenimiento.png" class="menu-icon">
              <span *ngIf="isExpanded" class="menu-text">Configuración</span>
            </mat-panel-title>
          </mat-expansion-panel-header>

          <!-- Empresas -->
          <a mat-list-item 
             [routerLink]="((menuPermisos$ | async)?.configuracion?.empresas) ? '/seguridades/empresas' : null"
             [class.disabled]="!((menuPermisos$ | async)?.configuracion?.empresas)"
             (click)="manejarClick('/seguridades/empresas', $event)">
            <span *ngIf="isExpanded" class="menu-text">Empresas</span>
            <mat-icon *ngIf="!((menuPermisos$ | async)?.configuracion?.empresas)" class="lock-icon">lock</mat-icon>
          </a>

          <!-- Zonas -->
          <a mat-list-item 
             [routerLink]="((menuPermisos$ | async)?.configuracion?.zonas) ? '/seguridades/zonas' : null"
             [class.disabled]="!((menuPermisos$ | async)?.configuracion?.zonas)"
             (click)="manejarClick('/seguridades/zonas', $event)">
            <span *ngIf="isExpanded" class="menu-text">Zona</span>
            <mat-icon *ngIf="!((menuPermisos$ | async)?.configuracion?.zonas)" class="lock-icon">lock</mat-icon>
          </a>

          <!-- Segmento de Negocio -->
          <a mat-list-item 
             [routerLink]="((menuPermisos$ | async)?.configuracion?.segmentoNegocio) ? '/seguridades/segmento-negocio' : null"
             [class.disabled]="!((menuPermisos$ | async)?.configuracion?.segmentoNegocio)"
             (click)="manejarClick('/seguridades/segmento-negocio', $event)">
            <span *ngIf="isExpanded" class="menu-text">Segmento de Negocio</span>
            <mat-icon *ngIf="!((menuPermisos$ | async)?.configuracion?.segmentoNegocio)" class="lock-icon">lock</mat-icon>
          </a>

          <!-- Proyectos -->
          <a mat-list-item 
             [routerLink]="((menuPermisos$ | async)?.configuracion?.proyectos) ? '/seguridades/proyectos' : null"
             [class.disabled]="!((menuPermisos$ | async)?.configuracion?.proyectos)"
             (click)="manejarClick('/seguridades/proyectos', $event)">
            <span *ngIf="isExpanded" class="menu-text">Proyectos</span>
            <mat-icon *ngIf="!((menuPermisos$ | async)?.configuracion?.proyectos)" class="lock-icon">lock</mat-icon>
          </a>

        </mat-expansion-panel>

      </mat-accordion>

      <!-- Salir (siempre visible y funcional) -->
      <mat-list-item class="salir-item" (click)="salir()">
        <div class="menu-item">
          <img src="assets/icons/icon-salir.png" class="menu-icon">
          <span *ngIf="isExpanded" class="menu-text salir-text">Salir</span>
        </div>
      </mat-list-item>

    </mat-nav-list>

  </mat-sidenav>

  <!-- CONTENIDO PRINCIPAL -->
  <mat-sidenav-content [ngClass]="isExpanded ? 'content-default' : 'content-collapsed'">
    <router-outlet></router-outlet>
    <footer class="app-footer" [ngClass]="{ 'footer-collapsed': !isExpanded && !isHandset }">
      <div class="footer-left">{{ currentDateTime }}</div>
      <div class="footer-center">
        <img src="assets/logo/logo-gap.png" alt="GAP System" class="footer-logo">
        <span class="footer-phone">Telf: 099 970 0288 / 022 464 951</span>
      </div>
    </footer>
  </mat-sidenav-content>

</mat-sidenav-container>
