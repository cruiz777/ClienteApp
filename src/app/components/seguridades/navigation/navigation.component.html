<mat-sidenav-container class="sidenav-container" [ngClass]="{
  'collapsed': !isExpanded && !isHandset,
  'mobile': isHandset
}">

  <!-- SIDEBAR -->
  <mat-sidenav #drawer
              class="sidenav"
              [mode]="isHandset ? 'over' : 'side'"
              [opened]="!isHandset || isExpanded"
              [class.collapsed]="!isExpanded && !isHandset"
              [fixedInViewport]="true"
              (backdropClick)="isExpanded = false">

    <div class="logo-seguridad" *ngIf="isExpanded">
      <img src="assets/logo/seguridad.png" alt="Logo">
    </div>

    <!-- Menú Principal -->
    <mat-nav-list>

      <!-- Toggle Sidebar -->
      <mat-list-item (click)="toggleSidebar()" class="menu-toggle">
        <mat-icon>menu</mat-icon>
        <span *ngIf="isExpanded" class="menu-text">Menú</span>
      </mat-list-item>

      <!-- Acordeón -->
      <mat-accordion [multi]="false">

        <!-- SEGURIDAD -->
        <mat-expansion-panel>
          <mat-expansion-panel-header>
            <mat-panel-title>
              <img src="assets/icons/icon-Usuario-perfil.png" class="menu-icon">
              <span *ngIf="isExpanded" class="menu-text">Usuarios/Perfiles</span>
            </mat-panel-title>
          </mat-expansion-panel-header>

          <a mat-list-item routerLink="/seguridades/usuarios">
            <!-- <img src="assets/icons/icon-usuario.png" class="menu-icon"> -->
            <span *ngIf="isExpanded" class="menu-text">Usuarios</span>
          </a>

          <a mat-list-item routerLink="/seguridades/perfiles">
            <!-- <img src="assets/icons/icon-perfil.png" class="menu-icon"> -->
            <span *ngIf="isExpanded" class="menu-text">Perfil</span>
          </a>

          <a mat-list-item routerLink="/seguridades/departamentos">
            <!-- <img src="assets/icons/icon-perfil.png" class="menu-icon"> -->
            <span *ngIf="isExpanded" class="menu-text">Departamentos</span>
          </a>
        </mat-expansion-panel>

        <!-- ENTIDADES -->
        <mat-expansion-panel>
          <mat-expansion-panel-header>
            <mat-panel-title>
              <img src="assets/icons/icon-entidad-1.png" class="menu-icon">
              <span *ngIf="isExpanded" class="menu-text">Entidades</span>
            </mat-panel-title>
          </mat-expansion-panel-header>

          <a mat-list-item routerLink="/seguridades/entidades">
            <!-- <img src="assets/icons/icon-personas.png" class="menu-icon"> -->
            <span *ngIf="isExpanded" class="menu-text">Entidades</span>
          </a>
        </mat-expansion-panel>

        <!-- MANTENIMIENTO GENERAL -->
        <mat-expansion-panel>
          <mat-expansion-panel-header>
            <mat-panel-title>
              <img src="assets/icons/icon-mantenimiento.png" class="menu-icon">
              <span *ngIf="isExpanded" class="menu-text">Configuración</span>
            </mat-panel-title>
          </mat-expansion-panel-header>

          <a mat-list-item routerLink="/seguridades/empresas">
            <!-- <img src="assets/icons/icon-empresa.png" class="menu-icon"> -->
            <span *ngIf="isExpanded" class="menu-text">Empresas</span>
          </a>

          <a mat-list-item routerLink="/seguridades/zonas">
            <!-- <img src="assets/icons/icon-localizacion.png" class="menu-icon"> -->
            <span *ngIf="isExpanded" class="menu-text">Zona</span>
          </a>

          <a mat-list-item routerLink="/seguridades/segmento-negocio">
            <!-- <img src="assets/icons/icon-localizacion.png" class="menu-icon"> -->
            <span *ngIf="isExpanded" class="menu-text">Segmento de Negocio</span>
          </a>

          <a mat-list-item routerLink="/seguridades/proyectos">
            <!-- <img src="assets/icons/icon-localizacion.png" class="menu-icon"> -->
            <span *ngIf="isExpanded" class="menu-text">Proyectos</span>
          </a>
        </mat-expansion-panel>

      </mat-accordion>

      <!-- Salir -->
      <mat-list-item routerLink="/inicio" class="salir-item">
        <div class="menu-item">
          <img src="assets/icons/icon-salir.png" class="menu-icon">
          <span *ngIf="isExpanded" class="menu-text salir-text">Salir</span>
        </div>
      </mat-list-item>

    </mat-nav-list>

  </mat-sidenav>

  <!-- CONTENIDO PRINCIPAL -->
  <mat-sidenav-content [ngClass]="isExpanded ? 'content-default' : 'content-collapsed'">
    <router-outlet></router-outlet>
    <footer class="app-footer" [ngClass]="{ 'footer-collapsed': !isExpanded && !isHandset }">
      <div class="footer-left">{{ currentDateTime }}</div>
      <div class="footer-center">
        <img src="assets/logo/logo-gap.png" alt="GAP System" class="footer-logo">
        <span class="footer-phone">Telf: 099 970 0288 / 022 464 951</span>
      </div>
    </footer>
  </mat-sidenav-content>

</mat-sidenav-container>
