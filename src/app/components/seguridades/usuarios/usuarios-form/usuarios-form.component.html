<div class="form-contenedor">
  <h2>Creación de Usuario</h2>

  <form [formGroup]="usuarioForm" class="form-grid" (ngSubmit)="grabar()">

    <!-- Sección 1: Datos de Usuario -->
    <div class="form-row">
      <div class="form-field">
        <label>Usuario*:</label>
        <div class="input-con-icono">
          <img src="assets/icons/icon-usuario.png" />
          <input formControlName="usuario" type="email" placeholder="ejemplo" />
        </div>
      </div>

      <div class="form-field">
        <label>Correo:</label>
        <input formControlName="correo" type="email" placeholder="ejemplo@correo.com" />
        <div *ngIf="usuarioForm.get('correo')?.invalid && usuarioForm.get('correo')?.touched"
          style="color: red; font-size: 12px;">
          Ingrese un correo válido.
        </div>

      </div>
    </div>

    <div class="form-row">
      <div class="form-field">
        <label>Clave*:</label>
        <div class="input-con-icono">
          <img [src]="mostrarClave ? 'assets/icons/icon-clave.png' : 'assets/icons/icon-clave-2.png'"
            (click)="toggleClave()" style="cursor: pointer;" />
          <input formControlName="clave" [type]="mostrarClave ? 'text' : 'password'" placeholder="Ingrese su clave" />
        </div>
      </div>


      <div class="form-field">
        <label>Estado*:</label>
        <select formControlName="estado">
          <option value="">Seleccione</option>
          <option value="activo">Activo</option>
          <option value="inactivo">Inactivo</option>
        </select>
      </div>
    </div>

    <!-- Sección 2: Acceso y Configuración -->
    <div class="form-row">
      <div class="form-field">
        <label>Perfil*:</label>
        <select formControlName="perfil">
          <option value="">Seleccione</option>
          <option *ngFor="let p of perfiles" [value]="p.id_perfil">{{ p.nombre }}</option>
        </select>
      </div>

      <div class="form-field">
        <label>Departamento*:</label>
        <select formControlName="departamento">
          <option value="">Seleccione</option>
          <option *ngFor="let d of departamentos" [value]="d.id_departamento">{{ d.nombre }}</option>
        </select>
      </div>
    </div>

    <div class="form-row">
      <!-- <div class="form-field">
        <label>Fecha de Caducidad*:</label>
        <input formControlName="fechaCaducidad" type="date" class="input-date" />
      </div> -->
      <div class="form-field">
        <label>Fecha de Caducidad*:</label>
        <mat-form-field appearance="outline" class="compact-date mini-width">
          <input matInput [matDatepicker]="picker1" formControlName="fechaCaducidad" placeholder="dd/MM/yyyy" />
          <mat-datepicker-toggle matSuffix [for]="picker1"></mat-datepicker-toggle>
          <mat-datepicker #picker1></mat-datepicker>
        </mat-form-field>
      </div>

    </div>

    <!-- Sección 3: Botones -->
    <div class="form-acciones">
      <button type="submit" class="btn-grabar">Grabar</button>
      <button type="button" class="btn-cancelar" (click)="cerrar()">Cancelar</button>
    </div>
  </form>
</div>
