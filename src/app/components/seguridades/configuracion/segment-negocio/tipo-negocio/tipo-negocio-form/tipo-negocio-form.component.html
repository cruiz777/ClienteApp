<div class="form-container">
  <h2>{{ isEditMode ? 'Editar Tipo de Negocio' : 'Nuevo Tipo de Negocio' }}</h2>

  <form [formGroup]="form" (ngSubmit)="guardar()">
    <div class="form-group">
      <label for="descripcion">Descripción <span class="required">*</span></label>
      <input id="descripcion" type="text" formControlName="descripcion" placeholder="Ej: Comercial" />
      <div class="error" *ngIf="form.get('descripcion')?.invalid && form.get('descripcion')?.touched">
        Campo obligatorio.
      </div>
    </div>

    <div class="form-group">
      <label for="estado">Estado:</label>
      <select id="estado" formControlName="estado">
        <option [value]="true">ACTIVO</option>
        <option [value]="false">INACTIVO</option>
      </select>
    </div>

    <div class="form-group">
      <label for="idEmpresa">Empresa <span class="required">*</span></label>
      <select id="idEmpresa" formControlName="idEmpresa">
        <option value="" disabled selected>Seleccione una empresa</option>
        <option *ngFor="let emp of empresas" [value]="emp.empresaCodigo">
          {{ emp.empresaNombre }}
        </option>
      </select>
      <div class="error" *ngIf="form.get('idEmpresa')?.invalid && form.get('idEmpresa')?.touched">
        Seleccione una empresa válida.
      </div>
    </div>

    <div class="button-group">
      <button type="submit" [disabled]="form.invalid" class="primary-button">Guardar</button>
      <button type="button" class="cancel-button" (click)="cancelar()">Cancelar</button>
    </div>
  </form>
</div>
