<div class="zona-container">
  <div class="zona-header">
    <h2>Registro de Centro de Costos</h2>
    <button mat-raised-button class="btn-nueva-zona" (click)="abrirCrear()">Nuevo</button>
  </div>

  <div class="zona-busqueda">
    <label for="search">Buscar:</label>
    <div class="input-wrapper">
      <input
        id="search"
        type="text"
        [(ngModel)]="searchTerm"
        (input)="buscar()"
        placeholder="Buscar por descripción"
      />
      <img src="assets/icons/icon-buscar.png" alt="Buscar" />
    </div>
  </div>

  <table class="zona-tabla">
    <thead>
      <tr>
        <th>#</th>
        <th>Id</th>
        <th>Descripción</th>
        <th>Cuenta</th>
        <th>Estado</th>
        <th>Opción</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of centroCostosFiltrados; let i = index">
        <td>{{ i + 1 }}</td>
        <td>{{ item.id }}</td>
        <td>{{ item.descripcion }}</td>
        <td>{{ item.cuenta }}</td>        
        <td>{{ item.estado ? 'ACTIVO' : 'INACTIVO' }}</td>
        <td>
          <button class="icon-btn" (click)="abrirEditar(item.id)">
            <img src="assets/icons/icon-modificar-3.png" alt="Editar" />
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
