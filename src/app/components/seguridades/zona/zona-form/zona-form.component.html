<div class="zona-form-container">
  <h2>{{ isEditMode ? 'Editar Zona' : 'Nueva Zona' }}</h2>

  <form [formGroup]="zonaForm" (ngSubmit)="guardar()">
    <div class="form-group">
      <label for="referencia">Código Zona:</label>
      <input id="referencia" type="text" formControlName="referencia" />
    </div>

    <div class="form-group">
      <label for="nombre">Nombre:</label>
      <input id="nombre" type="text" formControlName="nombre" />
    </div>

    <div class="form-group">
      <label for="numero">Número:</label>
      <input id="numero" type="text" formControlName="numero" />
    </div>

    <div class="form-group">
      <label for="empresaCodigo">Empresa:</label>
      <select id="empresaCodigo" formControlName="empresaCodigo">
        <option [ngValue]="null" disabled selected>Seleccione una empresa</option>
        <option *ngFor="let empresa of empresas" [value]="empresa.empresaCodigo">
          {{ empresa.empresaNombre }}
        </option>
      </select>
    </div>


    <div class="form-actions">
      <button type="submit" [disabled]="zonaForm.invalid">Guardar</button>
      <button type="button" class="cancel-btn" (click)="cancelar()">Cancelar</button>
    </div>
  </form>
</div>
