<div class="contenedor-formulario">
  <h2>Asignación Nuevo GTIN - Ingreso Único de Venta</h2>

  <form class="formulario" [formGroup]="formUV">
    <div class="form-grid">

      <div>
        <label for="codigoCliente">Código del cliente:</label>
        <input id="codigoCliente" type="text" formControlName="codigoCliente" readonly />
      </div>

      <div>
        <label for="cliente">Cliente:</label>
        <input id="cliente" type="text" formControlName="cliente" readonly />
      </div>

      <div>
        <label for="ruc">RUC:</label>
        <input id="ruc" type="text" formControlName="ruc" readonly />
      </div>

      <mat-form-field appearance="fill">
        <mat-label>Prefijo</mat-label>
        <mat-select formControlName="gcp" (selectionChange)="onPrefijoBlur()">
          <mat-option *ngFor="let prefijo of prefijos" [value]="prefijo.id_prefijos">
            {{ prefijo.codpre }}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <div>
        <label for="gln">GLN®:</label>
        <input id="gln" type="text" formControlName="gln" readonly />
      </div>
      <!-- Fila completa con radios, serie, GTIN y tipo GTIN -->
      <div class="fila-gtin full-width">
        <!-- Nacionales -->
        <div class="grupo-etiqueta">
          <label class="titulo-grupo">Nacionales</label>
          <div class="checkbox-contenedor radio">
            <label><input type="radio" formControlName="gtinNacionalSeleccionado" value="gtin13" />
              <span>GTIN-13</span></label>
            <label><input type="radio" formControlName="gtinNacionalSeleccionado" value="gtin8" />
              <span>GTIN-8</span></label>
            <label><input type="radio" formControlName="gtinNacionalSeleccionado" value="gtin12" />
              <span>GTIN-12</span></label>
          </div>
        </div>

        <!-- Internacionales -->
        <div class="grupo-etiqueta">
          <label class="titulo-grupo">Internacionales</label>
          <div class="checkbox-contenedor radio">
            <label><input type="radio" formControlName="gtinInternacionalSeleccionado" value="gtin13i" />
              <span>GTIN-13</span></label>
            <label><input type="radio" formControlName="gtinInternacionalSeleccionado" value="gtin8i" />
              <span>GTIN-8</span></label>
            <label><input type="radio" formControlName="gtinInternacionalSeleccionado" value="gtin12i" />
              <span>GTIN-12</span></label>
          </div>
        </div>

        <!-- Editar serie -->
        <div>
          <label><input type="checkbox" (change)="habilitarSerie()" formControlName="usarSerie" /> Serie</label>
          <input type="text" formControlName="serie" [readonly]="!formUV.get('usarSerie')?.value" />
        </div>

        <!-- GTIN UV -->
        <div>

          <mat-form-field appearance="outline">
            <mat-label>GTIN UV®:</mat-label>
            <input matInput formControlName="gtinUv" type="text" maxlength="13" (keypress)="permitirSoloNumeros($event)"
              [ngClass]="{ 'input-verde': campoGtin }" />
            <mat-error *ngIf="formUV.get('gtinUv')?.hasError('pattern')">Solo se permiten números</mat-error>
            <mat-error *ngIf="formUV.get('gtinUv')?.hasError('maxlength')">Longitud máxima excedida</mat-error>
          </mat-form-field>

        </div>

        <!-- Tipo GTIN -->
        <div>
          <label>TIPO GTIN®:</label>
          <input type="text" formControlName="tipoGtin" readonly />
        </div>
      </div>



      <!-- Campos editables -->
      <div><label>Descripción:</label><input type="text" formControlName="descripcion" /></div>
      <div><label>Marca:</label><input type="text" formControlName="marca" /></div>
      <div><label>Contenido:</label><input type="text" formControlName="contenido" /></div>

      <!-- ComboBox unidad medida -->
      <mat-form-field>
        <input matInput formControlName="unidadMedida" [matAutocomplete]="autoUnidad" placeholder="Seleccione Unidad" />
        <button matSuffix mat-icon-button *ngIf="formUV.get('unidadMedida')?.value" (click)="limpiarUnidadMedida()">
          <mat-icon>close</mat-icon>
        </button>
        <mat-autocomplete #autoUnidad="matAutocomplete" [displayWith]="displayWithUnidadMedida"
          (optionSelected)="seleccionarUnidadMedida($event.option.value)">
          <mat-option *ngFor="let u of unidadesMedidaFiltradas" [value]="u">
            {{ u.descripcion }} - {{ u.unidad }}
          </mat-option>
        </mat-autocomplete>
      </mat-form-field>



      <!-- Categoría -->
      <mat-form-field>
        <input matInput formControlName="categoria" [matAutocomplete]="autoCategoria"
          placeholder="Seleccione Categoría" />
        <button matSuffix mat-icon-button *ngIf="formUV.get('categoria')?.value" (click)="limpiarCategoria()">
          <mat-icon>close</mat-icon>
        </button>
        <mat-autocomplete #autoCategoria="matAutocomplete" [displayWith]="displayWithCategoria"
          (optionSelected)="seleccionarCategoria($event.option.value)">
          <mat-option *ngFor="let cat of categoriasFiltradas" [value]="cat">
            {{ cat.desBrick }}
          </mat-option>
        </mat-autocomplete>
      </mat-form-field>

      <!-- Brick solo visualización -->
      <div><label>GCP® BRICK:</label><input type="text" formControlName="brick" readonly /></div>

      <!-- ComboBox país y sector -->
      <mat-form-field>
        <input matInput formControlName="pais" [matAutocomplete]="autoPais" placeholder="Seleccione País" />
        <button matSuffix mat-icon-button *ngIf="formUV.get('pais')?.value" (click)="formUV.get('pais')?.reset()">
          <mat-icon>close</mat-icon>
        </button>
        <mat-autocomplete #autoPais="matAutocomplete" [displayWith]="displayWithPais">
          <mat-option *ngFor="let p of paisFiltrados" [value]="p">
            {{ p.nombre }}
          </mat-option>
        </mat-autocomplete>
      </mat-form-field>


      <mat-form-field>
        <input matInput formControlName="sector" [matAutocomplete]="autoSector" placeholder="Seleccione Sector" />
        <button matSuffix mat-icon-button *ngIf="formUV.get('sector')?.value" (click)="limpiarSector()">
          <mat-icon>close</mat-icon>
        </button>
        <mat-autocomplete #autoSector="matAutocomplete" [displayWith]="displayWithSector"
          (optionSelected)="seleccionarSector($event.option.value)">
          <mat-option *ngFor="let s of sectoresFiltrados" [value]="s">
            {{ s.descripcion }}
          </mat-option>
        </mat-autocomplete>
      </mat-form-field>


      <!-- Editables -->
      <div><label>URL foto:</label><input type="text" formControlName="urlFoto" /></div>
      <div><label>Observación:</label><textarea formControlName="observacion"></textarea></div>

      <!-- Empresas -->
      <div class="checkbox-contenedor full-width" formGroupName="empresas">
        <label><input type="checkbox" formControlName="favorita" /> La Favorita</label>
        <label><input type="checkbox" formControlName="mega" /> Mega Santa María</label>
        <label><input type="checkbox" formControlName="amazon" /> Amazon</label>
        <label><input type="checkbox" formControlName="rosario" /> El Rosario</label>
        <label><input type="checkbox" formControlName="tia" /> TIA</label>
        <label><input type="checkbox" formControlName="google" /> Google</label>
        <label><input type="text" placeholder="Otros:" formControlName="otrosSolicitantes" /></label>
      </div>
    </div>

    <div class="botones">
      <button class="btn" type="button" (click)="limpiarCampos()">Nuevo</button>
      <button class="btn" type="button" (click)="generar()" [disabled]="botonGenerarDeshabilitado">
        Generar
      </button>

      <button class="btn btn-azul" type="button" (click)="grabarTodo()" [disabled]="botonGrabarDeshabilitado">
        Grabar
      </button>

      <button class="btn btn-azul" type="button" (click)="activarUL()" [disabled]="botonIngresarULDeshabilitado">
        Ingresar UL
      </button>

    </div>
  </form>


  <!-- Sección UL -->
  <h2 class="separador">UNIDAD LOGÍSTICA GTIN-14</h2>

  <form class="formulario" [formGroup]="formUL">
    <div class="form-grid">

      <div class="grupo-etiqueta full-width">
        <label class="titulo-grupo">Nacionales</label>
        <div class="checkbox-contenedor radio">
          <div class="grupo-etiqueta full-width">
            <label class="titulo-grupo">Nacionales</label>
            <div class="checkbox-contenedor radio">
              <label>
                <input type="radio" formControlName="gtinNacionalULSeleccionado" value="gtin14u"
                  [disabled]="!gtin14UEnable" />
                <span>GTIN-14</span>
              </label>
              <label>
                <input type="radio" formControlName="gtinNacionalULSeleccionado" value="gtin13u"
                  [disabled]="!gtin13UEnable" />
                <span>GTIN-13</span>
              </label>
              <label>
                <input type="radio" formControlName="gtinNacionalULSeleccionado" value="gtin12u"
                  [disabled]="!gtin12UEnable" />
                <span>GTIN-12</span>
              </label>
            </div>
          </div>

          <div class="grupo-etiqueta full-width">
            <label class="titulo-grupo">Internacionales</label>
            <div class="checkbox-contenedor radio">
              <label>
                <input type="radio" formControlName="gtinInternacionalULSeleccionado" value="gtin14ui"
                  [disabled]="!gtin14UIEnable" />
                <span>GTIN-14</span>
              </label>
              <label>
                <input type="radio" formControlName="gtinInternacionalULSeleccionado" value="gtin13ui"
                  [disabled]="!gtin13UIEnable" />
                <span>GTIN-13</span>
              </label>
              <label>
                <input type="radio" formControlName="gtinInternacionalULSeleccionado" value="gtin12ui"
                  [disabled]="!gtin12UIEnable" />
                <span>GTIN-12</span>
              </label>
            </div>
          </div>

        </div>
      </div>

      <div><label>Serie:</label><input type="text" formControlName="serie" /></div>
      <div><label>Tipo de empaque:</label><input type="text" formControlName="tipoEmpaque" /></div>
      <div><label>Unidad:</label><input type="text" formControlName="unidad" /></div>
      <div><label>Indicador:</label><input type="text" formControlName="indicador" /></div>
      <div><label>Factor:</label><input type="text" formControlName="factor" (blur)="actualizarDescripcionUL()" /></div>
      <div><label>GTIN® UL:</label><input type="text" formControlName="gtinUl"
          [ngClass]="{ 'input-verde': campoGtinU }" /></div>
      <div><label>Tipo GTIN®:</label><input type="text" formControlName="tipoGtin" /></div>
      <div><label>Descripción:</label><textarea formControlName="descripcionu"></textarea></div>
    </div>

    <div class="botones">
      <button class="btn" type="button" (click)="limpiarUl()" [disabled]="botonNuevoDeshabilitado">Nuevo</button>

      <button class="btn" type="button" (click)="generarUL()" [disabled]="botonGenerarULDeshabilitado">
        Generar
      </button>

      <button class="btn btn-azul" type="button" (click)="grabarTodoUL()" [disabled]="botonGrabarULDeshabilitado">
        Grabar
      </button>

      <button class="btn btn-rojo" type="button" (click)="salir()">Salir</button>
    </div>
  </form>
</div>
