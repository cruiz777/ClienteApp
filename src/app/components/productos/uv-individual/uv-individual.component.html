<div class="contenedor-formulario">
  <h2>Asignación Nuevo GTIN - Ingreso Único de Venta</h2>

  <!-- Sección UV -->
  <form class="formulario">
    <div class="form-grid">
      <input type="text" placeholder="Código del cliente:" />
      <input type="text" placeholder="Cliente:" />
      <input type="text" placeholder="RUC:" />
      <input type="text" placeholder="GCP®:" />
      <input type="text" placeholder="GLN®:" />

      <div class="grupo-checkbox">
        <label>Nacionales</label>
        <label><input type="checkbox" /> GTIN-13</label>
        <label><input type="checkbox" /> GTIN-8</label>
      </div>

      <div class="grupo-checkbox">
        <label>Internacionales</label>
        <label><input type="checkbox" /> GTIN-13</label>
        <label><input type="checkbox" /> GTIN-8</label>
        <label><input type="checkbox" /> GTIN-12</label>
      </div>

      <input type="text" placeholder="Serie:" />
      <input type="text" placeholder="GCP®:" />
      <input type="text" placeholder="GTIN UV®:" />
      <input type="text" placeholder="TIPO GTIN®:" />
      <input type="text" placeholder="Descripción:" />
      <input type="text" placeholder="Marca:" />
      <input type="text" placeholder="Contenido:" />
      <input type="text" placeholder="Unidad de medida:" />
      <input type="text" placeholder="Categoría:" />
      <input type="text" placeholder="GCP® BRICK:" />
      <input type="text" placeholder="País de venta:" />
      <input type="text" placeholder="Sector:" />
      <input type="text" placeholder="URL foto:" />

      <textarea placeholder="Observación:"></textarea>

      <div class="checkbox-grid full-width">
        <label><input type="checkbox" /> La Favorita</label>
        <label><input type="checkbox" /> Mega Santa María</label>
        <label><input type="checkbox" /> Amazon</label>
        <label><input type="checkbox" /> El Rosario</label>
        <label><input type="checkbox" /> TIA</label>
        <label><input type="checkbox" /> Google</label>
        <input type="text" placeholder="Otros:" />
      </div>
    </div>

    <div class="botones">
      <button class="btn">Nuevo</button>
      <button class="btn">Generar</button>
      <button class="btn btn-azul">Grabar</button>
      <button class="btn btn-rojo">Ingresar UL</button>
    </div>
  </form>

  <!-- Sección UL -->
  <h2 class="separador">UNIDAD LOGISTICA GTIN-14</h2>

  <form class="formulario">
    <div class="form-grid">
      <div class="grupo-checkbox">
        <label>Nacionales</label>
        <label><input type="checkbox" /> GTIN-14</label>
        <label><input type="checkbox" /> GTIN-13</label>
        <label><input type="checkbox" /> GTIN-12</label>
      </div>

      <div class="grupo-checkbox">
        <label>Internacionales</label>
        <label><input type="checkbox" /> GTIN-14</label>
        <label><input type="checkbox" /> GTIN-13</label>
        <label><input type="checkbox" /> GTIN-12</label>
      </div>

      <input type="text" placeholder="Serie:" />
      <input type="text" placeholder="Tipo de empaque:" />
      <input type="text" placeholder="Unidad:" />
      <input type="text" placeholder="Indicador:" />
      <input type="text" placeholder="Factor:" />
      <input type="text" placeholder="GTIN® UL:" />
      <input type="text" placeholder="Tipo GTIN®:" />
      <textarea placeholder="Observación:"></textarea>
    </div>

    <div class="botones">
      <button class="btn">Nuevo</button>
      <button class="btn">Generar</button>
      <button class="btn btn-azul">Grabar</button>
      <button class="btn btn-rojo">Salir</button>
    </div>
