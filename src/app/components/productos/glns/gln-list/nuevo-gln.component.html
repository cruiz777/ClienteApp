<div class="gln-formulario">
  <form [formGroup]="formGln">
    <!-- Tabs superiores -->
    <div class="tabs">
      <button class="tab-active">Información General</button>
      <button class="tab-inactive">GLN´s</button>
    </div>

    <!-- Indicador de pasos -->
    <div class="progress-steps">
      <div class="step" [ngClass]="{ 'active': pasoActual === 1, 'completed': pasoActual > 1 }">
        <div class="step-number">1</div>
        <div class="step-label">Datos Generales</div>
      </div>
      <div class="step" [ngClass]="{ 'active': pasoActual === 2, 'completed': pasoActual > 2 }">
        <div class="step-number">2</div>
        <div class="step-label">Contactos</div>
      </div>
      <div class="step" [ngClass]="{ 'active': pasoActual === 3 }">
        <div class="step-number">3</div>
        <div class="step-label">Certificados</div>
      </div>
    </div>

    <!-- Paso 1: Datos Generales -->
    <div *ngIf="pasoActual === 1" class="form-section">
      <h3>Datos Generales</h3>
      <div class="form-grid">
        <div class="form-group">
          <label>Código del Cliente:</label>
          <input matInput formControlName="clientesCodigo">
        </div>
        <div class="form-group">
          <label>RUC/CI/Pasaporte:</label>
          <input matInput formControlName="documentoIdentidad">
        </div>

        <div class="form-group">
          <label>Cliente:</label>
          <input matInput formControlName="glnNombre">
        </div>
        <div class="form-group">
          <label>GLN:</label>
          <input matInput formControlName="gln1">
        </div>

        <div class="form-group">
          <label>Origen de Prefijo:</label>
          <input matInput formControlName="glnOrigenprefijo">
        </div>
        <div class="form-group">
          <label>Prefijo GS1:</label>
          <input matInput formControlName="glnPrefijogs1">
        </div>

        <div class="form-group">
          <label>Prefijo:</label>
          <mat-select formControlName="idPrefijos">
            <mat-option *ngFor="let p of prefijos" [value]="p.id_prefijos">{{ p.codpre }}</mat-option>
          </mat-select>
        </div>
        <div class="form-group">
          <label>Tipo Localización:</label>
          <mat-select formControlName="idTipoLocalizacion">
            <mat-option *ngFor="let tipo of tiposLocalizacion" [value]="tipo.id_tipo_cliente">{{ tipo.descripcion }}</mat-option>
          </mat-select>
        </div>
      </div>

      <h3>Ubicación</h3>
      <div class="form-grid">
        <div class="form-group">
          <label>Localización:</label>
          <input matInput formControlName="localizacion">
        </div>
        <div class="form-group">
          <label>País:</label>
          <mat-select formControlName="idPais">
            <mat-option *ngFor="let pais of paises" [value]="pais.nombre">{{ pais.nombre }}</mat-option>
          </mat-select>
        </div>

        <div class="form-group">
          <label>Provincia:</label>
          <mat-select formControlName="provinciaCodigo">
            <mat-option *ngFor="let provincia of provincias" [value]="provincia.nombre">{{ provincia.nombre }}</mat-option>
          </mat-select>
        </div>
        <div class="form-group">
          <label>Cantón:</label>
          <mat-select formControlName="cantonCodigo">
            <mat-option *ngFor="let canton of cantones" [value]="canton.nombre">{{ canton.nombre }}</mat-option>
          </mat-select>
        </div>

        <div class="form-group">
          <label>Ciudad:</label>
          <mat-select formControlName="idCiudad">
            <mat-option *ngFor="let ciudad of ciudades" [value]="ciudad.id">{{ ciudad.ciudad }}</mat-option>
          </mat-select>
        </div>
        <div class="form-group">
          <label>Código Postal:</label>
          <input matInput formControlName="glnCodigopostal">
        </div>

        <div class="form-group">
          <label>Dirección:</label>
          <input matInput formControlName="direccion">
        </div>
      </div>

      <div class="form-grid-3col">
        <div class="form-group">
          <label>Latitud (GPS):</label>
          <input matInput formControlName="glnLatitud">
        </div>
        <div class="form-group">
          <label>Longitud (GPS):</label>
          <input matInput formControlName="glnLongitud">
        </div>
        <div class="form-group" style="display: flex; align-items: center;">
          <mat-checkbox formControlName="serie">Serie</mat-checkbox>
        </div>
      </div>
    </div>

    <!-- Paso 2: Contactos -->
    <div *ngIf="pasoActual === 2" class="form-section">
      <h3>Contactos</h3>
      <div class="form-grid">
        <div class="form-group" *ngFor="let field of [
          'telefono', 'glnCelular', 'fax', 'email', 'web',
          'contacto', 'contactoTel', 'glnContacto2', 'glnEmail2',
          'glnTel2', 'glnContacto3', 'glnEmail3', 'glnTel3'
        ]">
          <label>{{ field | titlecase }}:</label>
          <input matInput [formControlName]="field">
        </div>
      </div>
    </div>

    <!-- Paso 3: Certificados -->
    <div *ngIf="pasoActual === 3" class="form-section">
      <h3>Datos Generales</h3>
      <div class="form-grid">
        <div class="form-group">
          <label>FDA (Registros):</label>
          <input matInput formControlName="fda">
        </div>
        <div class="form-group">
          <label>Europa U:</label>
          <input matInput formControlName="europa">
        </div>
        <div class="form-group">
          <label>Global Gap:</label>
          <input matInput formControlName="glnGlobal">
        </div>
      </div>

      <h3>Otros</h3>
      <div class="form-grid">
        <div class="form-group">
          <label>Otros 1:</label>
          <input matInput formControlName="glnOtro1">
        </div>
        <div class="form-group">
          <label>Otros 2:</label>
          <input matInput formControlName="glnOtro2">
        </div>
        <div class="form-group">
          <label>País que solicita GLN:</label>
          <input matInput formControlName="glnGlnp">
        </div>
        <div class="form-group">
          <label>Empresa que solicita GLN:</label>
          <input matInput formControlName="glnGlne">
        </div>
      </div>
    </div>

    <!-- Navegación entre pasos -->
    <div class="form-navigation">
      <button mat-button (click)="pasoAnterior()" [disabled]="pasoActual === 1">Regresar</button>
      <button mat-button *ngIf="pasoActual < 3" (click)="siguientePaso()">Siguiente</button>
      <button mat-raised-button color="primary" *ngIf="pasoActual === 3" (click)="guardar()">Grabar</button>
    </div>

    <!-- Barra de acciones -->
    <div class="actions-bar">
      <button mat-button (click)="nuevo()">Nuevo</button>
      <button mat-button (click)="modificar()">Modificar</button>
      <button mat-button (click)="cancelar()">Cancelar</button>
    </div>
  </form>
</div>
