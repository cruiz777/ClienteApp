<mat-sidenav-container class="sidenav-container" [ngClass]="{
  'collapsed': !isExpanded && !isHandset,
  'mobile': isHandset
}">

  <!-- SIDEBAR -->
  <mat-sidenav #drawer
              class="sidenav"
              [mode]="isHandset ? 'over' : 'side'"
              [opened]="!isHandset || isExpanded"
              [class.collapsed]="!isExpanded && !isHandset"
              [fixedInViewport]="true"
              (backdropClick)="isExpanded = false">


    <div class="logo-seguridad" *ngIf="isExpanded">
      <img src="assets/logo/seguridad.png" alt="Logo">
    </div>

    <!-- Menú Principal -->
    <mat-nav-list>

      <!-- Toggle Sidebar -->
      <mat-list-item (click)="toggleSidebar()" class="menu-toggle">
        <mat-icon>menu</mat-icon>
        <span *ngIf="isExpanded" class="menu-text">Menú</span>
      </mat-list-item>

      <!-- Acordeón -->
      <mat-accordion *ngIf="clienteSeleccionado" [multi]="false">

        <!-- Productos -->
        <mat-expansion-panel>
          <mat-expansion-panel-header>
            <mat-panel-title>
              <img src="assets/icons/icon-Usuario-perfil.png" class="menu-icon" routerLink="/seguridades/productos">
              <span *ngIf="isExpanded" class="menu-text">Nuevo Producto </span>
            </mat-panel-title>
          </mat-expansion-panel-header>
        </mat-expansion-panel>

        <!-- GLN -->
        <mat-expansion-panel>
          <mat-expansion-panel-header>
            <mat-panel-title>
              <img src="assets/icons/icon-Usuario-perfil.png" class="menu-icon" routerLink="/seguridades/productos">
              <span *ngIf="isExpanded" class="menu-text">Nuevo Gln </span>
            </mat-panel-title>
          </mat-expansion-panel-header>
        </mat-expansion-panel>

        <!-- CUPONES -->
        <mat-expansion-panel>
          <mat-expansion-panel-header>
            <mat-panel-title>
              <img src="assets/icons/icon-Usuario-perfil.png" class="menu-icon" routerLink="/seguridades/productos">
              <span *ngIf="isExpanded" class="menu-text">Cupones </span>
            </mat-panel-title>
          </mat-expansion-panel-header>
        </mat-expansion-panel>

        <!-- CUENTAS X COBRAR -->
        <mat-expansion-panel>
          <mat-expansion-panel-header>
            <mat-panel-title>
              <img src="assets/icons/icon-Usuario-perfil.png" class="menu-icon" routerLink="/seguridades/productos">
              <span *ngIf="isExpanded" class="menu-text">Cuentas x Cobrar </span>
            </mat-panel-title>
          </mat-expansion-panel-header>
        </mat-expansion-panel>

    <!-- ESTADOS DE CUENTA -->
        <mat-expansion-panel>
          <mat-expansion-panel-header>
            <mat-panel-title>
              <img src="assets/icons/icon-Usuario-perfil.png" class="menu-icon" routerLink="/seguridades/productos">
              <span *ngIf="isExpanded" class="menu-text">Estado de cuenta </span>
            </mat-panel-title>
          </mat-expansion-panel-header>
        </mat-expansion-panel>
        
      </mat-accordion>

      <!-- Salir -->
      <mat-list-item routerLink="/inicio" class="salir-item">
        <div class="menu-item">
          <img src="assets/icons/icon-salir.png" class="menu-icon">
          <span *ngIf="isExpanded" class="menu-text salir-text">Salir</span>
        </div>
      </mat-list-item>

    </mat-nav-list>

  </mat-sidenav>

  <!-- CONTENIDO PRINCIPAL -->
  <mat-sidenav-content [ngClass]="isExpanded ? 'content-default' : 'content-collapsed'">
    <router-outlet></router-outlet>
    <footer class="app-footer" [ngClass]="{ 'footer-collapsed': !isExpanded && !isHandset }">
      <div class="footer-left">{{ currentDateTime }}</div>
      <div class="footer-center">
        <img src="assets/logo/logo-gap.png" alt="GAP System" class="footer-logo">
        <span class="footer-phone">Telf: 099 970 0288 / 022 464 951</span>
      </div>
    </footer>
  </mat-sidenav-content>

</mat-sidenav-container>
