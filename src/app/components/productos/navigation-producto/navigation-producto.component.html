<mat-sidenav-container class="sidenav-container" [ngClass]="{
  'collapsed': !isExpanded && !isHandset,
  'mobile': isHandset
}">

  <!-- SIDEBAR -->
  <mat-sidenav #drawer
              class="sidenav"
              [mode]="isHandset ? 'over' : 'side'"
              [opened]="!isHandset || isExpanded"
              [class.collapsed]="!isExpanded && !isHandset"
              [fixedInViewport]="true"
              (backdropClick)="isExpanded = false">

    <!-- Logo -->
    <div class="logo-seguridad" *ngIf="isExpanded">
      <a [routerLink]="['/codbar/ficha-de-cliente/listado-clientes']">
        <img src="assets/logo/CODBAR-GS1.png" alt="Logo">
      </a>
    </div>

    <!-- Menú Principal -->
    <mat-nav-list>

      <!-- Toggle Sidebar -->
      <mat-list-item (click)="toggleSidebar()" class="menu-toggle">
        <mat-icon>menu</mat-icon>
        <span *ngIf="isExpanded" class="menu-text">Menú</span>
      </mat-list-item>

      <!-- Cliente seleccionado -->
      <mat-list-item disabled>
        <div class="menu-item">
          <mat-icon>person</mat-icon>
          <span *ngIf="isExpanded" class="menu-text">
            {{ clienteSeleccionado?.nomcli }} ({{ clienteSeleccionado?.clientes_codigo }})
          </span>
        </div>
      </mat-list-item>

      <!-- MENÚS CON PERMISOS -->

      <!-- Nuevo Producto -->
      <a mat-list-item 
         [routerLink]="((productosPermisos.nuevoProducto | async)) ? ['nuevo-producto'] : null"
         [class.disabled]="!((productosPermisos.nuevoProducto | async))"
         (click)="manejarClick('/productos/nuevo-producto', $event)"
         routerLinkActive="active">
        <div class="menu-item">
          <img src="assets/icons/icon-Usuario-perfil.png" class="menu-icon">
          <span *ngIf="isExpanded" class="menu-text">Nuevo Producto</span>
          <mat-icon *ngIf="!((productosPermisos.nuevoProducto | async))" class="lock-icon">lock</mat-icon>
        </div>
      </a>

      <!-- Nuevo GLN -->
      <a mat-list-item 
         [routerLink]="((productosPermisos.nuevoGln | async)) ? ['nuevo-gln'] : null"
         [class.disabled]="!((productosPermisos.nuevoGln | async))"
         (click)="manejarClick('/productos/nuevo-gln', $event)"
         routerLinkActive="active">
        <div class="menu-item">
          <img src="assets/icons/icon-nuevo-GLN.png" class="menu-icon">
          <span *ngIf="isExpanded" class="menu-text">Nuevo GLN</span>
          <mat-icon *ngIf="!((productosPermisos.nuevoGln | async))" class="lock-icon">lock</mat-icon>
        </div>
      </a>

      <!-- Cupones -->
      <a mat-list-item 
         [routerLink]="((productosPermisos.cupones | async)) ? ['cupones'] : null"
         [class.disabled]="!((productosPermisos.cupones | async))"
         (click)="manejarClick('/productos/cupones', $event)"
         routerLinkActive="active">
        <div class="menu-item">
          <img src="assets/icons/icon-cupones.png" class="menu-icon">
          <span *ngIf="isExpanded" class="menu-text">Cupones</span>
          <mat-icon *ngIf="!((productosPermisos.cupones | async))" class="lock-icon">lock</mat-icon>
        </div>
      </a>

      <!-- Nuevo SSCC -->
      <a mat-list-item 
         [routerLink]="((productosPermisos.nuevoSscc | async)) ? ['nuevo-sscc'] : null"
         [class.disabled]="!((productosPermisos.nuevoSscc | async))"
         (click)="manejarClick('/productos/nuevo-sscc', $event)"
         routerLinkActive="active">
        <div class="menu-item">
          <img src="assets/icons/icon-Usuario-perfil.png" class="menu-icon">
          <span *ngIf="isExpanded" class="menu-text">Nuevo SSCC</span>
          <mat-icon *ngIf="!((productosPermisos.nuevoSscc | async))" class="lock-icon">lock</mat-icon>
        </div>
      </a>

      <!-- OPCIONES ADMIN (solo si es usuario 1) -->
      <a mat-list-item 
         *ngIf="usuarioActual?.id_usuario === 1" 
         [routerLink]="['/productos/cobrar']" 
         routerLinkActive="active">
        <div class="menu-item">
          <img src="assets/icons/icon-cuentas-x-cobrar.png" class="menu-icon">
          <span *ngIf="isExpanded" class="menu-text">Cuentas X Cobrar</span>
        </div>
      </a>

      <a mat-list-item 
         *ngIf="usuarioActual?.id_usuario === 1" 
         [routerLink]="['/NuevoProducto']" 
         routerLinkActive="active">
        <div class="menu-item">
          <img src="assets/icons/icon-estado-cuenta.png" class="menu-icon">
          <span *ngIf="isExpanded" class="menu-text">Estados de Cuenta</span>
        </div>
      </a>

      <!-- Botón salir -->
      <a mat-list-item 
         [routerLink]="['/codbar/ficha-de-cliente/listado-clientes']" 
         class="salir-item">
        <div class="menu-item">
          <img src="assets/icons/icon-salir.png" class="menu-icon">
          <span *ngIf="isExpanded" class="menu-text salir-text">Salir</span>
        </div>
      </a>

    </mat-nav-list>

  </mat-sidenav>

  <!-- CONTENIDO PRINCIPAL -->
  <mat-sidenav-content [ngClass]="isExpanded ? 'content-default' : 'content-collapsed'">
    <router-outlet></router-outlet>
    <footer class="app-footer" [ngClass]="{ 'footer-collapsed': !isExpanded && !isHandset }">
      <div class="footer-left">{{ currentDateTime }}</div>
      <div class="footer-center">
        <img src="assets/logo/logo-gap.png" alt="GAP System" class="footer-logo">
        <span class="footer-phone">Telf: 099 970 0288 / 022 464 951</span>
      </div>
      <div style="
    flex: 1;
    display: flex;
    justify-content: flex-end;
    text-align: right;
    font-weight: 700;
    font-size: clamp(14px, 1.1vw, 24px);
  ">
        {{ usuarioActual?.nombre_usuario }}
      </div>
    </footer>
  </mat-sidenav-content>

</mat-sidenav-container>
