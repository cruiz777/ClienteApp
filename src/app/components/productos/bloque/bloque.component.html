<p style="color: green;">✅ Editor tipo Excel con AG Grid</p>

<div style="margin-bottom: 10px;">
  <label for="cantidad">Cantidad de filas:</label>
  <input id="cantidad" type="number" [(ngModel)]="cantidadFilas" min="1" />
  <button (click)="generarFilas()">Generar</button>
  <button (click)="limpiarTabla()">🗑️ Limpiar tabla</button>
</div>

<div style="margin-bottom: 10px;">
  <label>
    <input type="checkbox" [(ngModel)]="copiarDesdeColumna2" />
    Copiar desde la segunda columna (ignorar la primera)
  </label>
</div>

<div style="margin-bottom: 10px;">
  <textarea [(ngModel)]="textoPegado" rows="5" cols="60" placeholder="Pega aquí lo copiado desde Excel"></textarea>
  <button (click)="pegarColumnaGtinUv()">📋 Pegar en tabla</button>
</div>

<div style="margin-bottom: 10px;">
  <label>Prefijo (5 dígitos):</label>
  <input type="text" [(ngModel)]="prefijo" maxlength="5" style="width: 80px;" />
  <button (click)="generarGtin13()">🚀 Generar GTIN-13</button>
</div>

<div class="ag-theme-alpine" style="width: 100%; height: 400px; border: 2px dashed red;">
  <ag-grid-angular
    style="width: 100%; height: 100%;"
    class="ag-theme-alpine"
    [rowData]="rowData"
    [columnDefs]="columnDefs"
    [defaultColDef]="defaultColDef"
    [enableRangeSelection]="true"
    [rowSelection]="'multiple'"
    (gridReady)="onGridReady($event)">
  </ag-grid-angular>
</div>
