<body>
  <div class="login-container">

    <form [formGroup]="formLogin" (ngSubmit)="onLogin()">

    <div class="login-card">
      <div class="header-container">
        <img src="assets/logo/GS1-logo.png" class="logo-image" alt="Logo" />
        <h1 class="welcome-text">Bienvenido</h1>
      </div>
      <div class="username-container">
        <label for="username" class="field-label">Usuario:</label>
        <img src="assets/icons/person-icon.png" class="user-icon" alt="Usuario icono" />
        <div class="input-container">
          <input
            type="email"
            id="username"
            class="input-field"
            placeholder="tucorreo@gmail.com"
            aria-label="Correo electrónico"
            formControlName="email"
          />
          <div class="input-underline"></div>
        </div>
      </div>
      <div class="password-container">
        <label for="password" class="field-label">Clave:</label>
        <img src="assets/icons/hidden-icon.png" class="password-icon" alt="Clave icono" />
        <div class="input-container">
          <input
            type="password"
            id="password"
            class="input-field"
            placeholder="***************"
            aria-label="Contraseña"
            formControlName="password"
          />
          <div class="input-underline"></div>
        </div>
      </div>
      <div class="forgot-password-container">
        <div class="spacer"></div>
        <a href="#" class="forgot-password-link">
          ¿Has olvidado su contraseña?
        </a>
      </div>
      <div class="login-button-container">
        <button class="login-button" type="submit">
          <span class="button-text">Iniciar Sesión</span>
        </button>
      </div>
      <div class="footer-container">
        <span class="footer-text">Hecho por</span>
        <img src="assets/logo/logo-gap.png" class="footer-logo" alt="Logo de la empresa" />
      </div>
    </div>

  </form>
  </div>
</body>
