<div class="tabs tabs-pills" role="tablist">
  <button role="tab" [attr.aria-selected]="activeTab === 'Factura'" [class.active]="activeTab === 'Factura'"
    (click)="cambiarTab('Factura')">
    Factura Global
  </button>

  <button role="tab" [attr.aria-selected]="activeTab === 'Listado'" [class.active]="activeTab === 'Listado'"
    (click)="cambiarTab('Listado')">
    Facturas Generadas
  </button>
</div>


<div class="contenido-tabs">
  <!-- ===== Pestaña: Nueva Factura ===== -->
  <ng-container *ngIf="activeTab === 'Factura'">
    <!-- FILA 1 -->
    <div class="row-1 tri-grid">
      <div class="header-row" [formGroup]="formCaja">
        <div class="fg">
          <label>P. Emisión:</label>
          <input class="ti" formControlName="puntoEmision" readonly>
        </div>
        <div class="fg">
          <label>Caja:</label>
          <input class="ti" formControlName="caja" readonly>
        </div>
        <div class="fg">
          <label>Secuencial:</label>
          <input class="ti wide" formControlName="secuencial" readonly>
        </div>
        <div class="fg fecha"> <!-- antes: class="fg" -->
          <label>Fecha:</label>
          <input class="ti wide" formControlName="fechaFacturacion" readonly>
        </div>
        <div *ngIf="!cajaAsignada"
       class="alert-warn"
       style="grid-column: 1 / -1; margin:8px 0; padding:8px 12px; border-radius:8px;
              background:#fff3cd; color:#664d03; border:1px solid #ffecb5;"
       aria-live="polite">
    Usuario no tiene asignado <strong>Caja</strong>. No podrás generar facturas hasta asignarla.
  </div>
      </div>
      <form class="toolbar-row" [formGroup]="formFactura" (ngSubmit)="buscar()">
  <!-- Año -->
  <mat-form-field appearance="outline" class="anio-field dense"  >
    <input matInput inputmode="numeric" autocomplete="off"
           formControlName="anio" (input)="limitAnio($event)" />
    <button *ngIf="anioCtrl.value" mat-icon-button matSuffix type="button"
            (click)="restoreAnio()" aria-label="Restaurar año" matTooltip="Restaurar año actual" style="width: 50px;">
      <mat-icon>restore</mat-icon>
    </button>
  </mat-form-field>

  <!-- Zona -->
  <mat-form-field >
    <mat-select formControlName="zona">
      <mat-option [value]="''">Todas las zonas</mat-option>
      <mat-option *ngFor="let z of zonas; trackBy: trackByZonaId" [value]="z.id">
        {{ z.referencia }} - {{ z.nombre }}
      </mat-option>
    </mat-select>
    <button *ngIf="zonaCtrl.value !== ''" mat-icon-button matSuffix type="button"
            (click)="zonaCtrl.setValue('')" aria-label="Limpiar zona">
      <mat-icon>close</mat-icon>
    </button>
  </mat-form-field>

  <!-- Buscar (igual tamaño que Facturar) -->
 

  <div class="total-heading">
    <span class="total-label">TOTAL :</span>
    <span class="fi-total-amount">{{ money(totalSeleccionado) }}</span>
  </div>

  <div class="acciones">
     <button mat-stroked-button color="primary" type="submit"  [disabled]="deshabilitarBuscar || cargando || formFactura.invalid">
    Buscar
  </button>
  <button
  mat-stroked-button
  color="accent"
  type="button"
  (click)="exportarExcelConsulta()"
  [disabled]="!canExportExcelConsulta">
  Exportar Excel
</button>

    <button type="button" mat-stroked-button (click)="cancelar()">Cancelar</button>
    <button type="button"
        mat-stroked-button
        color="warn"
        class="btn-accion"
        (click)="facturar()"
        [disabled]="!habilitarFacturar || facturando || !cajaAsignada">
  Facturar
</button>

  </div>
</form>


    </div>

    <!-- TOTAL : valor -->


    <!-- FILA 2: Filtrar -->
    <div class="row-2 filter-row">
      <div class="filter-label">Filtrar</div>

      <mat-form-field appearance="outline" class="qf-field dense qf-compact">
        <input #qfInput matInput placeholder="Buscar en el grid…" (input)="onQuickFilter($event)"
          aria-label="Búsqueda rápida en el grid" />
        <button matSuffix mat-icon-button class="clear-suffix" *ngIf="hasQf" type="button"
          (click)="clearBusqueda(); qfInput.focus()" title="Limpiar búsqueda" aria-label="Limpiar">
          <mat-icon>close</mat-icon>
        </button>

      </mat-form-field>
    </div>


    <!-- FILA 3: Solo seleccionados -->
    <div class="row-3 actions-row">
      <label class="chk-inline">
        <input type="checkbox" [checked]="showSoloSeleccionados" (change)="toggleSoloSeleccionados()" />
        Seleccionados
      </label>

      <button type="button" class="btn chip" (click)="limpiarSeleccion()">
        Limpiar selección
      </button>
    </div>

    <!-- GRID -->
    <div class="ag-theme-alpine grid-wrap">
      <ag-grid-angular style="width:100%; height:100%; display:block" [columnDefs]="columnDefs"
        [defaultColDef]="defaultColDef" [rowData]="rowData" rowSelection="multiple" (gridReady)="onGridReady($event)"
        (selectionChanged)="onSelectionChanged()" [enableBrowserTooltips]="true" [tooltipShowDelay]="0">
      </ag-grid-angular>
    </div>
  </ng-container>

  <!-- ===== Pestaña: Listado ===== -->
  <!-- ===== Pestaña: Listado ===== -->
<ng-container *ngIf="activeTab === 'Listado'">
  <!-- Encima del grid del Listado -->
<div class="row-3 actions-row">
  <button type="button" class="btn chip" (click)="cargarListado()">Refrescar</button>
  <button type="button"
          class="btn chip"
          [disabled]="listadoSelectedCount === 0 || imprimiendo"
          (click)="imprimirSeleccionadas()">
    Imprimir seleccionadas ({{ listadoSelectedCount }})
  </button>
  <button type="button"
        class="btn chip"
        [disabled]="listadoSelectedCount === 0 || zipping"
        (click)="zipSeleccionadas()">
  Descargar ZIP ({{ listadoSelectedCount }})
</button>

</div>

<!-- GRID del Listado -->
<div class="ag-theme-alpine grid-wrap">
  <ag-grid-angular
    style="width:100%; height:100%; display:block"
    [columnDefs]="columnDefsListado"
    [defaultColDef]="defaultColDefListado"
    [rowData]="listadoData"
    rowSelection="multiple"
    (gridReady)="onListadoGridReady($event)"
    (selectionChanged)="onListadoSelectionChanged()">
  </ag-grid-angular>
</div>

</ng-container>

</div>
