<div class="page-container">
  <div class="contenido-tablas">
    <!-- ===== TÍTULO + COMBO TIPO DOCUMENTO ===== -->
    <div class="header-row">
      <h2 class="title">Documentos electrónicos</h2>

      <mat-form-field appearance="outline" class="tipo-doc-field">
        <mat-label>Tipo de documento</mat-label>
        <mat-select
          [value]="tipoDocumentoActivo"
          (selectionChange)="onTipoDocumentoChange($event.value)"
        >
          <mat-option value="FACTURA">Factura</mat-option>
          <mat-option value="NC">Nota de crédito</mat-option>
          <mat-option value="ND">Nota de débito</mat-option>
          <mat-option value="RET">Retenciones</mat-option>
        </mat-select>
      </mat-form-field>
    </div>

    <!-- ===== FILTROS ===== -->
    <form [formGroup]="filtrosForm" class="filters-row">
      <div class="filters-group">
        <mat-form-field appearance="outline" class="filter-field">
          <mat-label>Fecha desde</mat-label>
          <input
            matInput
            [matDatepicker]="pickerDesde"
            formControlName="fechaDesde"
          />
          <mat-datepicker-toggle
            matSuffix
            [for]="pickerDesde"
          ></mat-datepicker-toggle>
          <mat-datepicker #pickerDesde></mat-datepicker>
        </mat-form-field>

        <mat-form-field appearance="outline" class="filter-field">
          <mat-label>Fecha hasta</mat-label>
          <input
            matInput
            [matDatepicker]="pickerHasta"
            formControlName="fechaHasta"
          />
          <mat-datepicker-toggle
            matSuffix
            [for]="pickerHasta"
          ></mat-datepicker-toggle>
          <mat-datepicker #pickerHasta></mat-datepicker>
        </mat-form-field>

        <button
          mat-raised-button
          color="primary"
          type="button"
          class="btn-buscar"
          (click)="buscar()"
        >
          Buscar
        </button>

        <!-- Botón de impresión -->
        <button
          mat-raised-button
          type="button"
          class="btn-imprimir"
          (click)="imprimirSeleccionadas()"
        >
          <mat-icon>print</mat-icon>
          Imprimir
        </button>
      </div>

      <!-- Buscar texto -->
      <div class="search-row">
        <mat-form-field appearance="outline" class="search-field">
          <mat-label>Buscar</mat-label>
          <input
            matInput
            formControlName="textoBusqueda"
            placeholder="texto"
            (keyup.enter)="buscar()"
          />
          <button
            *ngIf="filtrosForm.get('textoBusqueda')?.value"
            matSuffix
            mat-icon-button
            type="button"
            aria-label="Limpiar"
            (click)="clearSearchText()"
          >
            <mat-icon>close</mat-icon>
          </button>
        </mat-form-field>
      </div>
    </form>

    <!-- ===== TABLA AG-GRID ===== -->
    <div class="grid-wrapper">
      <ag-grid-angular
        class="ag-theme-alpine custom-grid"
        [rowData]="rowData"
        [columnDefs]="columnDefs"
        [defaultColDef]="defaultColDef"
        [rowSelection]="'multiple'"
        [suppressRowClickSelection]="false"
        [animateRows]="true"
        [pagination]="true"
        [paginationPageSize]="20"
        (gridReady)="onGridReady($event)"
      >
      </ag-grid-angular>
    </div>

    <!-- Texto de paginación (opcional) -->
    <div class="paginacion-texto">
      Páginas mostradas 1 a 10 de 100 entradas
    </div>
  </div>
</div>
