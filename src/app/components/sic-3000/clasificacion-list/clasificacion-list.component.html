<!-- src/app/components/sic-3000/clasificacion/clasificacion-list.component.html -->

<div class="zona-container">
  <div class="zona-header">
    <h2>Clasificación de Formas de Pago</h2>
    <button mat-raised-button class="btn-azul" (click)="abrirCrear()">
      Nuevo
    </button>
  </div>

  <div class="zona-busqueda">
    <label for="search">Buscar:</label>
    <div class="input-wrapper">
      <input
        id="search"
        type="text"
        [(ngModel)]="searchTerm"
        (input)="buscar()"
        placeholder="Buscar por descripción o cuenta"
      />
      <img src="assets/icons/icon-buscar.png" alt="Buscar" />
    </div>
  </div>

  <div *ngIf="error" class="state error">
    {{ error }}
  </div>

  <div class="table-wrap" *ngIf="!loading; else loadingTpl">
    <table class="zona-tabla">
      <thead>
        <tr>
          <th style="width: 80px;">Id</th>
          <th>Descripción</th>
          <th style="width: 150px;">Código Cuenta</th>
          <th style="width: 90px;">Estado</th>
          <th class="col-opcion">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let it of filtered; trackBy: trackById">
          <td>{{ it.idClasificacion }}</td>
          <td>{{ it.descripcion }}</td>
          <td>{{ it.codigoCuenta }}</td>
          <td>
            <span [class.estado-activo]="it.estado" [class.estado-inactivo]="!it.estado">
              {{ it.estado ? 'Activo' : 'Inactivo' }}
            </span>
          </td>
          <td class="acciones">
            <button
              type="button"
              class="icon-btn"
              (click)="abrirEditar(it)"
              title="Editar"
            >
              <img src="assets/icons/icon-modificar-3.png" alt="Editar" />
            </button>
          </td>
        </tr>

        <tr *ngIf="filtered.length === 0">
          <td colspan="5" class="empty">No hay resultados.</td>
        </tr>
      </tbody>
    </table>

    <!-- Paginación -->
    <div class="paginacion" *ngIf="totalPages > 1">
      <button
        class="btn-page"
        (click)="paginaAnterior()"
        [disabled]="page <= 1"
      >
        ‹ Anterior
      </button>

      <span class="page-info">
        Página {{ page }} de {{ totalPages }}
      </span>

      <button
        class="btn-page"
        (click)="paginaSiguiente()"
        [disabled]="page >= totalPages"
      >
        Siguiente ›
      </button>
    </div>
  </div>

  <ng-template #loadingTpl>
    <div class="loading">Cargando...</div>
  </ng-template>
</div>
