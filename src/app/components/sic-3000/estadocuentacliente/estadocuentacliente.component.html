<div class="estado-cuenta-container">
  <h2 class="titulo">Estado de Cuenta de Cliente</h2>

  <div class="selector-cliente">
    <label>Cliente:</label>
    <mat-form-field appearance="fill">
      <mat-select [(value)]="clienteSeleccionado">
        <mat-option *ngFor="let cliente of clientes" [value]="cliente.id">
          {{ cliente.nombre }}
        </mat-option>
      </mat-select>
    </mat-form-field>
    <span class="nombre-cliente">{{ getNombreCliente() }}</span>
  </div>

  <table mat-table [dataSource]="estadoCuenta" class="tabla">

    <!-- No Factura -->
    <ng-container matColumnDef="factura">
      <th mat-header-cell *matHeaderCellDef>No. Factura</th>
      <td mat-cell *matCellDef="let row">{{ row.factura }}</td>
    </ng-container>

    <!-- Fecha -->
    <ng-container matColumnDef="fecha">
      <th mat-header-cell *matHeaderCellDef>Fecha</th>
      <td mat-cell *matCellDef="let row">{{ row.fecha }}</td>
    </ng-container>

    <!-- Debe -->
    <ng-container matColumnDef="debe">
      <th mat-header-cell *matHeaderCellDef>Debe</th>
      <td mat-cell *matCellDef="let row">{{ row.debe | number:'1.2-2' }}</td>
    </ng-container>

    <!-- Haber -->
    <ng-container matColumnDef="haber">
      <th mat-header-cell *matHeaderCellDef>Haber</th>
      <td mat-cell *matCellDef="let row">{{ row.haber | number:'1.2-2' }}</td>
    </ng-container>

    <!-- Saldo -->
    <ng-container matColumnDef="saldo">
      <th mat-header-cell *matHeaderCellDef>Saldo</th>
      <td mat-cell *matCellDef="let row">{{ row.saldo | number:'1.2-2' }}</td>
    </ng-container>

    <!-- Observacion -->
    <ng-container matColumnDef="observacion">
      <th mat-header-cell *matHeaderCellDef>Observación</th>
      <td mat-cell *matCellDef="let row">{{ row.observacion }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columnas"></tr>
    <tr mat-row *matRowDef="let row; columns: columnas;"></tr>
  </table>

  <div class="botones">
    <button mat-button color="primary" (click)="nuevaConsulta()">Nueva Consulta</button>
    <button mat-button color="accent" (click)="imprimir()">Imprimir</button>
    <button mat-button color="warn" (click)="cancelar()">Cancelar</button>
  </div>
</div>
