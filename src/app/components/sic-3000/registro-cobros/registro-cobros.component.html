<div class="container py-4 cuenta-liquidar">

  <!-- Step header (paso 1 activo) -->
  <div class="steps mb-4" *ngIf="step === 1">
    <div class="step active">
      <div class="step-badge">1</div>
      <div class="step-text">Datos del Cliente</div>
    </div>
    <div class="step-divider"></div>
    <div class="step">
      <div class="step-badge">2</div>
      <div class="step-text">Forma de Pago</div>
    </div>
  </div>

  <!-- Step header (paso 2 activo) -->
  <div class="steps mb-4" *ngIf="step === 2">
    <div class="step">
      <div class="step-badge">1</div>
      <div class="step-text">Datos del Cliente</div>
    </div>
    <div class="step-divider"></div>
    <div class="step active">
      <div class="step-badge">2</div>
      <div class="step-text">Forma de Pago</div>
    </div>
  </div>

  <!-- ===== PASO 1: DATOS DEL CLIENTE (según imagen) ===== -->
  <h3 class="titulo" *ngIf="step === 1">Registro de Pagos</h3>

  <form *ngIf="step === 1" [formGroup]="formCliente" novalidate (ngSubmit)="onNext()">
    <!-- Fila 1 -->
    <div class="row g-3 align-items-end">
      <div class="col-12 col-md-3">
        <label class="form-label">No. Pago</label>
        <input class="form-control" formControlName="noPago" placeholder="" />
      </div>

      <div class="col-12 col-md-3">
        <label class="form-label">Fecha Pago</label>
        <input type="date" class="form-control" formControlName="fechaPago" />
      </div>
    </div>

    <!-- Fila 2 (UN SOLO CAMPO para cliente y responsable) -->
    <div class="row g-3 align-items-end mt-1">
      <div class="col-12 col-md-8">
        <label class="form-label">Cliente</label>
        <input class="form-control" formControlName="cliente" placeholder="Código o nombre..." />
      </div>

      <div class="col-12 col-md-4">
        <label class="form-label">Responsable</label>
        <input class="form-control" formControlName="responsable" placeholder="Código o nombre..." />
      </div>
    </div>

    <!-- Fila 3 -->
    <div class="row g-3 align-items-end mt-1">
      <div class="col-12 col-md-3">
        <label class="form-label">Valor a Pagar</label>
        <input class="form-control text-end" formControlName="valorAPagar" placeholder="0.00" />
      </div>
      <div class="col-12 col-md-3">
        <label class="form-label">Monto Deuda</label>
        <input class="form-control text-end" formControlName="montoDeuda" placeholder="0.00" />
      </div>
    </div>

    <hr class="my-3">

    <!-- Tabla: AG Grid Community -->
    <div class="mb-3">
      <div class="form-label subtitulo mb-2">Detalle</div>
      <ag-grid-angular
        class="ag-theme-alpine"
        style="width: 100%; height: 320px;"
        [rowData]="rowData"
        [columnDefs]="columnDefs"
        [defaultColDef]="defaultColDef"
        [animateRows]="true"
        (gridReady)="onGridReady($event)">
      </ag-grid-angular>
    </div>

    <!-- Observación -->
    <div class="row g-3 mt-2">
      <div class="col-12">
        <label class="form-label">Observación</label>
        <input class="form-control" formControlName="observacion" placeholder="" />
      </div>
    </div>

    <div class="d-flex justify-content-center gap-3 mt-4">
      <button type="button" class="btn btn-outline-secondary px-4" (click)="onCancel()">Cancelar</button>
      <button type="submit" class="btn btn-primary px-4">Siguiente →</button>
    </div>
  </form>

  <!-- ===== PASO 2: FORMA DE PAGO ===== -->
  <form *ngIf="step === 2" [formGroup]="formPago" novalidate (ngSubmit)="onAddPago()">
    <h3 class="titulo">Forma de Pago</h3>

    <div class="mb-3 d-flex align-items-center gap-4">
      <label class="form-check form-check-inline radio-clean">
        <input type="radio" class="form-check-input" formControlName="categoriaPago" value="efectivo" />
        <span class="form-check-label">Efectivo o Equivalente</span>
      </label>

      <label class="form-check form-check-inline radio-clean">
        <input type="radio" class="form-check-input" formControlName="categoriaPago" value="tarjeta" />
        <span class="form-check-label">Tarjeta</span>
      </label>
    </div>

    <div class="row g-4">
      <div class="col-12 col-md-4">
        <label class="form-label">Tipo:</label>
        <select class="form-select" formControlName="tipo" [ngClass]="invalid(formPago,'tipo')">
          <option value="" disabled selected>Seleccione…</option>
          <option *ngFor="let t of tipos" [value]="t">{{ t }}</option>
        </select>
        <div class="invalid-feedback">Seleccione el tipo de pago.</div>
      </div>

      <div class="col-12 col-md-4">
        <label class="form-label">Valor:</label>
        <input type="text" class="form-control text-end" formControlName="valor" placeholder="$ 0.00" />
      </div>

      <div class="col-12 col-md-4">
        <label class="form-label">Fecha Emisión Doc:</label>
        <input type="date" class="form-control" formControlName="fechaEmision" />
      </div>

      <div class="col-12 col-md-6">
        <label class="form-label">Banco:</label>
        <select class="form-select" formControlName="banco">
          <option value="" disabled selected>Seleccione…</option>
          <option *ngFor="let b of bancos" [value]="b">{{ b }}</option>
        </select>
      </div>

      <div class="col-12 col-md-6">
        <label class="form-label">No. Documento:</label>
        <input type="text" class="form-control" formControlName="numeroDocumento" />
      </div>

      <div class="col-12 col-md-6">
        <label class="form-label">Lote/Recap:</label>
        <input type="text" class="form-control" formControlName="loteRecap" />
      </div>

      <div class="col-12 col-md-6">
        <label class="form-label">Propietario:</label>
        <input type="text" class="form-control" formControlName="propietario" />
      </div>

      <div class="col-12 col-md-6">
        <label class="form-label">Autorización:</label>
        <input type="text" class="form-control" formControlName="autorizacion" />
      </div>

      <div class="col-12 col-md-6">
        <label class="form-label">Fecha Autorización:</label>
        <input type="date" class="form-control" formControlName="fechaAutorizacion" />
      </div>

      <div class="col-12">
        <label class="form-label">Observación:</label>
        <input type="text" class="form-control" formControlName="observacion" />
      </div>
    </div>

    <div class="d-flex justify-content-center gap-3 mt-5">
      <button type="button" class="btn btn-outline-secondary px-4" (click)="step = 1">← Regresar</button>
      <button type="button" class="btn btn-outline-secondary px-4" (click)="onCancelarPago()">Cancelar</button>
      <button type="submit" class="btn btn-primary px-4">Agregar Forma Pago →</button>
    </div>
  </form>

</div>
