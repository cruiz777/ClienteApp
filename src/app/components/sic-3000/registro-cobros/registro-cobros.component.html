<div class="cuenta-liquidar">

  <!-- Stepper -->
  <div class="steps" *ngIf="step === 1 || step === 2">
    <div class="step" [class.active]="step===1">
      <div class="step-badge">1</div>
      <div class="step-text">Datos del Cliente</div>
    </div>
    <div class="step-divider"></div>
    <div class="step" [class.active]="step===2">
      <div class="step-badge">2</div>
      <div class="step-text">Forma de Pago</div>
    </div>
  </div>

  <!-- ===== PASO 1 ===== -->
  <form *ngIf="step === 1" [formGroup]="formCliente" novalidate (ngSubmit)="onNext()">

    <div class="panel">
      <div class="panel-title">Registro de Pagos</div>

      <div class="grid-2">
        <div class="field">
          <label>No. Pago</label>
          <input class="form-control" formControlName="noPago" />
        </div>

        <div class="field">
          <label>Fecha Pago</label>
          <input type="date" class="form-control" formControlName="fechaPago" />
        </div>
      </div>

      <div>
        <div class="fi-field fi-cliente">
          <label>Cliente:</label>
          <div class="fi-input-wrap">
            <input #clienteInputRef type="text" matInput [formControl]="clienteOrigenControl"
              [matAutocomplete]="autoOrigen" (blur)="clienteOrigenControl.markAsTouched()" placeholder="Buscar Cliente"
              [class.input-error]="clienteOrigenControl.invalid && clienteOrigenControl.touched" />

            <mat-autocomplete #autoOrigen="matAutocomplete" [displayWith]="mostrarNombreCliente"
              (optionSelected)="seleccionarClienteOrigen($event.option.value)">
              <mat-option *ngFor="let cliente of clientesOrigenFiltrados" [value]="cliente">
                <span class="opcion-autocomplete">{{ cliente.nomcli }}</span>
              </mat-option>
            </mat-autocomplete>
          </div>
        </div>

        <div class="field">
          <label>Responsable</label>
          <input class="form-control" formControlName="responsable" placeholder="Código o nombre..." readonly />
        </div>
      </div>

      <div class="grid-2">
        <div class="field">
          <label>Valor a Pagar</label>
          <input
  class="form-control text-end"
  formControlName="valorAPagar"
  placeholder="0.00"
  inputmode="decimal"
  (focus)="onFocusValorAPagar()"           
  (input)="onValorAPagarInput($event)"     
/>

        </div>
        <div class="field">
          <label>Monto Deuda</label>
          <input class="form-control text-end" formControlName="montoDeuda" placeholder="0.00" readonly />
        </div>
      </div>
    </div>

    <!-- Tabla Detalle -->
 <div class="panel">
  <div class="panel-subtitle">Detalle</div>

  <div class="grid-wrap">
    <ag-grid-angular
      class="ag-theme-alpine compact-grid"
      style="width: 100%; height: 320px;"
      [rowData]="rowData"
      [columnDefs]="columnDefs"
      [defaultColDef]="defaultColDef"
      [getRowId]="getRowId"
      [processDataFromClipboard]="processDataFromClipboard"
      [suppressClickEdit]="!canEditFacturas"
      (gridReady)="onGridReady($event)"
      (cellValueChanged)="onCellValueChangedFacturas($event)">
    </ag-grid-angular>

    <!-- ⛔️ sin edición si no se puede -->
    <div class="grid-overlay" *ngIf="!canEditFacturas">
      Ingresa un <b>VALOR A PAGAR</b> mayor a 0 para habilitar el detalle.
    </div>
  </div>
</div>



    <!-- Observación + botones -->
    <div class="panel panel-bottom">
      <div class="field">
        <label>Observación</label>
        <input class="form-control" formControlName="observacion" />
      </div>

      <div class="actions-left">
        <button type="button" class="btn btn-ghost" (click)="onCancel()">Cancelar</button>
        <button type="submit" class="btn btn-primary">Siguiente →</button>
      </div>
    </div>
  </form>

  <!-- ===== PASO 2 ===== -->
  <form *ngIf="step === 2" [formGroup]="formPago" novalidate (ngSubmit)="aceptarPagos()">
    <div class="panel">
      <div class="panel-title">Registro de Pagos</div>

      <div class="grid-2">
        <div class="field">
          <label>Plantilla</label>
          <select class="form-control" formControlName="plantilla" (change)="onPlantillaChange()">
            <option value="transfer">Transferencias / Retenciones</option>
            <option value="cheque">Cheques / Tarjetas</option>
          </select>
        </div>

        <div class="field">
          <label>Valor a Pagar</label>
          <input type="text" class="form-control text-end" formControlName="valor" placeholder="0.00" [value]="usd(getValorAPagarNumber())" readonly />
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-subtitle">Registro de Pagos</div>

      <ag-grid-angular class="ag-theme-alpine compact-grid" style="width: 100%; height: 300px;"
        [rowData]="pagoRowData"
        [columnDefs]="pagoColumnDefs"
        [defaultColDef]="pagoDefaultColDef"
        [rowHeight]="28"
        [headerHeight]="28"
        [singleClickEdit]="true"
        [stopEditingWhenCellsLoseFocus]="true"
        (gridReady)="onPagoGridReady($event)"
        (cellValueChanged)="onPagoCellValueChanged($event)">
      </ag-grid-angular>

      <div class="toolbar">
        <div class="tot">Total: <b>{{ usd(totalPagos) }}</b></div>
        <div class="btns">
          <button type="button" class="btn btn-ghost" (click)="salirPagos()">F6 → Salir Pagos</button>
          <button type="button" class="btn btn-ghost" (click)="cancelarPagos()">F5 → Cancelar</button>
          <button type="submit" class="btn btn-primary">F4 → Aceptar Pagos</button>
        </div>
      </div>
    </div>

    <div class="panel panel-bottom">
      <div class="field">
        <label>Observación</label>
        <input class="form-control" formControlName="observacion" />
      </div>
      <div class="actions-right">
        <button type="button" class="btn btn-ghost" (click)="nuevoPago()">Nuevo Pago</button>
        <button type="button" class="btn btn-ghost" (click)="registrarPago()">Registrar Pago</button>
      </div>
    </div>
  </form>

</div>
