<div class="container py-4 cuenta-liquidar">

  <!-- Step header (paso 1 activo) -->
  <div class="steps mb-4" *ngIf="step === 1">
    <div class="step active">
      <div class="step-badge">1</div>
      <div class="step-text">Datos del Cliente</div>
    </div>
    <div class="step-divider"></div>
    <div class="step">
      <div class="step-badge">2</div>
      <div class="step-text">Forma de Pago</div>
    </div>
  </div>

  <!-- Step header (paso 2 activo) -->
  <div class="steps mb-4" *ngIf="step === 2">
    <div class="step">
      <div class="step-badge">1</div>
      <div class="step-text">Datos del Cliente</div>
    </div>
    <div class="step-divider"></div>
    <div class="step active">
      <div class="step-badge">2</div>
      <div class="step-text">Forma de Pago</div>
    </div>
  </div>

  <!-- ===== PASO 1: DATOS DEL CLIENTE ===== -->
  <h3 class="titulo" *ngIf="step === 1">Registro de Pagos</h3>

  <form *ngIf="step === 1" [formGroup]="formCliente" novalidate (ngSubmit)="onNext()">
    <!-- Fila 1 -->
    <div class="row g-3 align-items-end">
      <div class="col-12 col-md-3">
        <label class="form-label">No. Pago</label>
        <input class="form-control" formControlName="noPago" placeholder="" />
      </div>

      <div class="col-12 col-md-3">
        <label class="form-label">Fecha Pago</label>
        <input type="date" class="form-control" formControlName="fechaPago" />
      </div>
    </div>

    <div class="row g-3 align-items-end mt-1">
      <div class="col-12 col-md-8">
        <label class="form-label">Cliente</label>
        <input class="form-control" formControlName="cliente" placeholder="Código o nombre..." />
      </div>

      <div class="col-12 col-md-4">
        <label class="form-label">Responsable</label>
        <input class="form-control" formControlName="responsable" placeholder="Código o nombre..." />
      </div>
    </div>

    <!-- Fila 3 -->
    <div class="row g-3 align-items-end mt-1">
      <div class="col-12 col-md-3">
        <label class="form-label">Valor a Pagar</label>
        <input class="form-control text-end" formControlName="valorAPagar" placeholder="0.00" />
      </div>
      <div class="col-12 col-md-3">
        <label class="form-label">Monto Deuda</label>
        <input class="form-control text-end" formControlName="montoDeuda" placeholder="0.00" />
      </div>
    </div>

    <hr class="my-3">

    <!-- Tabla: AG Grid Community -->
    <div class="mb-3">
      <div class="form-label subtitulo mb-2">Detalle</div>
      <ag-grid-angular
        class="ag-theme-alpine"
        style="width: 100%; height: 320px;"
        [rowData]="rowData"
        [columnDefs]="columnDefs"
        [defaultColDef]="defaultColDef"
        [animateRows]="true"
        (gridReady)="onGridReady($event)">
      </ag-grid-angular>

    </div>

    <!-- Observación -->
    <div class="row g-3 mt-2">
      <div class="col-12">
        <label class="form-label">Observación</label>
        <input class="form-control" formControlName="observacion" placeholder="" />
      </div>
    </div>

    <div class="d-flex justify-content-center gap-3 mt-4">
      <button type="button" class="btn btn-outline-secondary px-4" (click)="onCancel()">Cancelar</button>
      <button type="submit" class="btn btn-primary px-4">Siguiente →</button>
    </div>
  </form>

 <!-- ===== PASO 2: FORMA DE PAGO ===== -->

<form *ngIf="step === 2" [formGroup]="formPago" novalidate (ngSubmit)="aceptarPagos()">
  <h3 class="titulo">Registro de Pagos</h3>

  <div class="row g-3 mb-2">
    <div class="col-12 col-md-4">
      <label class="form-label">Plantilla</label>
      <select class="form-select" formControlName="plantilla" (change)="onPlantillaChange()">
        <option value="transfer">Transferencias / Retenciones</option>
        <option value="cheque">Cheques / Tarjetas</option>
      </select>
    </div>

    <div class="col-12 col-md-4">
      <label class="form-label">Valor a Pagar</label>
      <input type="text" class="form-control text-end" formControlName="valor" placeholder="0.00" />
    </div>
  </div>

  <div class="mb-2">
    <div class="form-label subtitulo mb-2">Registro de Pagos</div>

    <ag-grid-angular
      class="ag-theme-alpine"
      style="width: 100%; height: 300px;"
      [rowData]="pagoRowData"
      [columnDefs]="pagoColumnDefs"
      [defaultColDef]="pagoDefaultColDef"
      [singleClickEdit]="true"
      [stopEditingWhenCellsLoseFocus]="true"
      (gridReady)="onPagoGridReady($event)"
      (cellValueChanged)="onPagoCellValueChanged($event)">
    </ag-grid-angular>
  </div>

  <div class="d-flex justify-content-between align-items-center my-2">
    <div class="text-muted small">
      <strong>Total:</strong> {{ usd(totalPagos) }}
    </div>
    <div class="d-flex gap-2">
      <button type="button" class="btn btn-outline-secondary" (click)="salirPagos()">F6 → Salir Pagos</button>
      <button type="button" class="btn btn-outline-secondary" (click)="cancelarPagos()">F5 → Cancelar</button>
      <button type="submit" class="btn btn-primary">F4 → Aceptar Pagos</button>
    </div>
  </div>

  <div class="row g-3 mt-2">
    <div class="col-12">
      <label class="form-label">Observación</label>
      <input class="form-control" formControlName="observacion" />
    </div>
  </div>

  <div class="d-flex justify-content-end gap-2 mt-3">
    <button type="button" class="btn btn-outline-secondary" (click)="nuevoPago()">Nuevo Pago</button>
    <button type="button" class="btn btn-outline-secondary" (click)="registrarPago()">Registrar Pago</button>
  </div>

</form>


</div>
