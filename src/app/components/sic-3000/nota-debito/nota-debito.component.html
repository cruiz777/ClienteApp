<div class="nc-container">
  <h3 class="titulo">Nota de Débito</h3>

  <!-- Encabezado -->
  <div class="grid-header">
    <div class="field">
      <label class="form-label">Sucursal:</label>
      <input class="form-control" [(ngModel)]="sucursal" />
    </div>
    <div class="field">
      <label class="form-label">Caja:</label>
      <input class="form-control" [(ngModel)]="caja" />
    </div>
    <div class="field">
      <label class="form-label">No:</label>
      <input class="form-control" [(ngModel)]="numero" />
    </div>
    <div class="field">
      <label class="form-label">Fecha:</label>
      <input class="form-control" type="date" [(ngModel)]="fecha" />
    </div>

    <div class="field">
      <label class="form-label">Cliente:</label>
      <input class="form-control" [(ngModel)]="cliente" />
    </div>
    <div class="field">
      <label class="form-label">Dirección:</label>
      <input class="form-control" [(ngModel)]="direccion" />
    </div>
    <div class="field">
      <label class="form-label">RUC:</label>
      <input class="form-control" [(ngModel)]="ruc" />
    </div>
    <div class="field">
      <label class="form-label">Factura:</label>
      <input class="form-control" [(ngModel)]="factura" />
    </div>

    <div class="field wide">
      <label class="form-label">Observación:</label>
      <input class="form-control" [(ngModel)]="observacion" />
    </div>
  </div>

  <!-- Detalle -->
  <div class="panel">
    <ag-grid-angular
      class="ag-theme-quartz nc-grid"
      style="width: 100%; height: 220px"
      [rowData]="detalleRowData"
      [columnDefs]="detalleColumnDefs"
      [rowSelection]="'single'"
      [animateRows]="true"
      [domLayout]="'autoHeight'">
    </ag-grid-angular>

    <div class="totales-linea">
      <div class="spacer"></div>
      <div class="total-fila">
        <span>Total Factura</span>
        <span></span>
        <span>{{ subTotal | number:'1.2-2' }}</span>
      </div>
    </div>
  </div>

  <!-- Formas de Pago + Resumen -->
  <div class="grid-2col">
    <div class="panel">
      <div class="toolbar">
        <strong class="subtitulo">Formas de Pago</strong>
        <div class="spacer"></div>
        <span class="total-pago">Total Pago</span>
      </div>

      <ag-grid-angular
        class="ag-theme-quartz nc-grid"
        style="width: 100%; height: 200px"
        [rowData]="pagoRowData"
        [columnDefs]="pagoColumnDefs"
        [rowSelection]="'single'"
        [animateRows]="true"
        [domLayout]="'autoHeight'">
      </ag-grid-angular>
    </div>

    <div class="panel resumen">
      <div class="res-item"><span>Sub Total</span><strong>{{ subTotal | number:'1.2-2' }}</strong></div>
      <div class="res-item"><span>Base 0</span><strong>{{ base0 | number:'1.2-2' }}</strong></div>
      <div class="res-item"><span>Base IVA</span><strong>{{ baseIva | number:'1.2-2' }}</strong></div>
      <div class="res-item"><span>IVA</span><strong>{{ iva | number:'1.2-2' }}</strong></div>
      <div class="res-item total-dev"><span><strong>TOTAL DEV.</strong></span><strong>{{ totalDev | number:'1.2-2' }}</strong></div>
    </div>
  </div>

  <!-- Acciones -->
  <div class="acciones">
    <button class="btn" (click)="nuevo()">Nuevo</button>
    <button class="btn btn-primary" (click)="grabar()">Grabar</button>
    <div class="spacer"></div>
    <div class="exportar">
      <button class="btn btn-sm" (click)="exportar('pdf')">Exportar</button>
      <span class="caret">▾</span>
    </div>
  </div>
</div>
