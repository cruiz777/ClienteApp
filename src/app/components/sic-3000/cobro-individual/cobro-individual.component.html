<div class="container py-4 cuenta-liquidar">

  <!-- Step header (paso 1 activo) -->
  <div class="steps mb-4" *ngIf="step === 1">
    <div class="step active">
      <div class="step-badge">1</div>
      <div class="step-text">Datos del Cliente</div>
    </div>
    <div class="step-divider"></div>
    <div class="step">
      <div class="step-badge">2</div>
      <div class="step-text">Forma de Pago</div>
    </div>
  </div>

  <!-- Step header (paso 2 activo) -->
  <div class="steps mb-4" *ngIf="step === 2">
    <div class="step">
      <div class="step-badge">1</div>
      <div class="step-text">Datos del Cliente</div>
    </div>
    <div class="step-divider"></div>
    <div class="step active">
      <div class="step-badge">2</div>
      <div class="step-text">Forma de Pago</div>
    </div>
  </div>

  <!-- ===== PASO 1: DATOS DEL CLIENTE ===== -->
  <h3 class="titulo" *ngIf="step === 1">Cuenta a Liquidar</h3>

  <form *ngIf="step === 1" [formGroup]="formCliente" novalidate (ngSubmit)="onNext()">
    <div class="row g-4">
      <div class="col-12 col-md-6">
        <label for="cliente" class="form-label">Cliente:</label>
        <select id="cliente" class="form-select" formControlName="cliente" [ngClass]="invalid(formCliente,'cliente')">
          <option value="" disabled>Seleccione…</option>
          <option *ngFor="let c of clientes" [value]="c.id">{{ c.nombre }}</option>
        </select>
        <div class="invalid-feedback">Seleccione un cliente.</div>
      </div>

      <div class="col-12 col-md-6">
        <label for="factura" class="form-label">Factura:</label>
        <select id="factura" class="form-select" formControlName="factura" [ngClass]="invalid(formCliente,'factura')">
          <option value="" disabled>Seleccione…</option>
          <option *ngFor="let f of facturas" [value]="f.id">{{ f.numero }}</option>
        </select>
        <div class="invalid-feedback">Seleccione una factura.</div>
      </div>

      <div class="col-12 col-md-6">
        <label for="fecha" class="form-label">Fecha:</label>
        <input id="fecha" type="date" class="form-control" formControlName="fecha" [ngClass]="invalid(formCliente,'fecha')" />
        <div class="invalid-feedback">Ingrese la fecha.</div>
      </div>
    </div>

    <hr class="my-4">

    <h5 class="subtitulo mb-3">Detalle de la cuenta por Cobrar</h5>

    <div class="row g-4">
      <div class="col-12 col-md-6">
        <label for="formaPago" class="form-label">Forma de Pago:</label>
        <select id="formaPago" class="form-select" formControlName="formaPago" [ngClass]="invalid(formCliente,'formaPago')">
          <option value="" disabled>Seleccione…</option>
          <option *ngFor="let fp of formasPago" [value]="fp.id">{{ fp.descripcion }}</option>
        </select>
        <div class="invalid-feedback">Seleccione una forma de pago.</div>
      </div>

      <div class="col-12 col-md-6">
        <label for="fechaDetalle" class="form-label">Fecha:</label>
        <input id="fechaDetalle" type="date" class="form-control" formControlName="fechaDetalle" [ngClass]="invalid(formCliente,'fechaDetalle')" />
        <div class="invalid-feedback">Ingrese la fecha del detalle.</div>
      </div>

      <!-- Campos de texto libres -->
      <div class="col-12 col-md-4">
        <label for="valorCxc" class="form-label">Valor CxC:</label>
        <input id="valorCxc" type="number" step="0.01" class="form-control text-end" formControlName="valorCxc" autocomplete="off" />
      </div>

      <div class="col-12 col-md-4">
        <label for="abono" class="form-label">Abono:</label>
        <input id="abono" type="number" step="0.01" class="form-control text-end" formControlName="abono" autocomplete="off" />
      </div>

      <div class="col-12 col-md-4">
        <label for="saldo" class="form-label">Saldo:</label>
        <input id="saldo" type="number" step="0.01" class="form-control text-end" formControlName="saldo" autocomplete="off" />
      </div>
    </div>

    <div class="d-flex justify-content-center gap-3 mt-5">
      <button type="button" class="btn btn-outline-secondary px-4" (click)="onCancel()">Cancelar</button>
      <button type="submit" class="btn btn-primary px-4">Siguiente →</button>
    </div>
  </form>

  <!-- ===== PASO 2: FORMA DE PAGO ===== -->
  <form *ngIf="step === 2" [formGroup]="formPago" novalidate (ngSubmit)="onAddPago()">
    <h3 class="titulo">Forma de Pago</h3>

    <div class="mb-3 d-flex align-items-center gap-4">
      <label class="form-check form-check-inline radio-clean">
        <input type="radio" class="form-check-input" formControlName="categoriaPago" value="efectivo" />
        <span class="form-check-label">Efectivo o Equivalente</span>
      </label>

      <label class="form-check form-check-inline radio-clean">
        <input type="radio" class="form-check-input" formControlName="categoriaPago" value="tarjeta" />
        <span class="form-check-label">Tarjeta</span>
      </label>
    </div>

    <div class="row g-4">
      <div class="col-12 col-md-4">
        <label for="tipo" class="form-label">Tipo:</label>
        <select id="tipo" class="form-select" formControlName="tipo" [ngClass]="invalid(formPago,'tipo')">
          <option value="" disabled>Seleccione…</option>
          <option *ngFor="let t of tipos" [value]="t">{{ t }}</option>
        </select>
        <div class="invalid-feedback">Seleccione el tipo de pago.</div>
      </div>

      <div class="col-12 col-md-4">
        <label for="valor" class="form-label">Valor:</label>
        <input id="valor" type="number" step="0.01" class="form-control text-end" formControlName="valor" placeholder="$ 0.00" />
      </div>

      <div class="col-12 col-md-4">
        <label for="fechaEmision" class="form-label">Fecha Emisión Doc:</label>
        <input id="fechaEmision" type="date" class="form-control" formControlName="fechaEmision" />
      </div>

      <div class="col-12 col-md-6">
        <label for="banco" class="form-label">Banco:</label>
        <select id="banco" class="form-select" formControlName="banco">
          <option value="" disabled>Seleccione…</option>
          <option *ngFor="let b of bancos" [value]="b">{{ b }}</option>
        </select>
      </div>

      <div class="col-12 col-md-6">
        <label for="numeroDocumento" class="form-label">No. Documento:</label>
        <input id="numeroDocumento" type="text" class="form-control" formControlName="numeroDocumento" />
      </div>

      <div class="col-12 col-md-6">
        <label for="loteRecap" class="form-label">Lote/Recap:</label>
        <input id="loteRecap" type="text" class="form-control" formControlName="loteRecap" />
      </div>

      <div class="col-12 col-md-6">
        <label for="propietario" class="form-label">Propietario:</label>
        <input id="propietario" type="text" class="form-control" formControlName="propietario" />
      </div>

      <div class="col-12 col-md-6">
        <label for="autorizacion" class="form-label">Autorización:</label>
        <input id="autorizacion" type="text" class="form-control" formControlName="autorizacion" />
      </div>

      <div class="col-12 col-md-6">
        <label for="fechaAutorizacion" class="form-label">Fecha Autorización:</label>
        <input id="fechaAutorizacion" type="date" class="form-control" formControlName="fechaAutorizacion" />
      </div>

      <div class="col-12">
        <label for="observacion" class="form-label">Observación:</label>
        <input id="observacion" type="text" class="form-control" formControlName="observacion" />
      </div>
    </div>

    <div class="d-flex justify-content-center gap-3 mt-5">
      <button type="button" class="btn btn-outline-secondary px-4" (click)="step = 1">← Regresar</button>
      <button type="button" class="btn btn-outline-secondary px-4" (click)="onCancelarPago()">Cancelar</button>
      <button type="submit" class="btn btn-primary px-4">Agregar Forma Pago</button>
      <button type="button" class="btn btn-primary px-4" (click)="onLiquidar()">Liquidar</button>
    </div>
  </form>

  <hr class="my-4" *ngIf="step === 2">

  <!-- === GRID DE FORMAS DE PAGO (AG GRID) === -->
  <div *ngIf="step === 2" class="ag-theme-quartz" style="width:100%;" [ngStyle]="{ 'min-height.px': 240 }">
    <ag-grid-angular
      [rowData]="rowData"
      [columnDefs]="columnDefs"
      [defaultColDef]="defaultColDef"
      [domLayout]="'autoHeight'"
      [pinnedBottomRowData]="pinnedBottomRowData"
      [suppressCellFocus]="true"
    ></ag-grid-angular>
  </div>
</div>
