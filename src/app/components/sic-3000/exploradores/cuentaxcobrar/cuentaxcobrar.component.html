<div class="cuenta-liquidar">

  <!-- Stepper -->
  <div class="steps" *ngIf="step === 1 || step === 2">
    <div class="step" [class.active]="step===1">
      <div class="step-text">Explorardor Cuentas por Cobrar</div>
    </div>
    <div class="step-divider"></div>
  </div>

  <!-- ===== PASO 1 ===== -->
  <form *ngIf="step === 1" [formGroup]="formCliente" novalidate (ngSubmit)="onNext()"
    (keydown.enter)="onFormEnter($event)">

    <div class="panel" style="background-color: #ECECEC;">
      <!-- Fila(s) alineadas con CSS Grid -->
      <div class="fi-grid2">
        <!-- Row 1 -->
        <div class="field col-1">
          <label>Cliente:</label>
          <div class="fi-input-wrap" style="width: 700px;">
            <input #clienteInputRef type="text" matInput formControlName="clienteOrigenControl"
              [matAutocomplete]="autoOrigen" (blur)="clienteOrigenControl.markAsTouched()" placeholder="Buscar Cliente o Ruc"
              [class.input-error]="clienteOrigenControl.invalid && clienteOrigenControl.touched" />

            <mat-autocomplete #autoOrigen="matAutocomplete" [displayWith]="mostrarNombreCliente"
              (optionSelected)="seleccionarClienteOrigen($event.option.value)">
              <mat-option *ngFor="let cliente of clientesOrigenFiltrados" [value]="cliente">
                <span class="opcion-autocomplete">
                  {{ cliente.nomcli }}
                </span>
              </mat-option>
            </mat-autocomplete>
          </div>
        </div>

        <!-- Row 2 -->
        <div class="field col-1">
          <label>RUC</label>
          <input class="form-control" formControlName="ruc" placeholder="—" readonly style="width: 150px;" />
        </div>

        <div class="field col-2" style="width: 100px;">
          <label>Monto Deuda</label>
          <input class="form-control text-start no-underline" formControlName="montoDeuda" placeholder="0.00"
            readonly />
        </div>
      </div>
    </div>

    <!-- Tabla Detalle -->
    <div class="panel">
      <div class="panel-subtitle">Detalle</div>

      <div class="grid-wrap">
        <ag-grid-angular class="ag-theme-alpine compact-grid" style="width: 100%; height: 240px;" [rowData]="rowData"
          [columnDefs]="columnDefs" [defaultColDef]="defaultColDef" [getRowId]="getRowId"
          [processDataFromClipboard]="processDataFromClipboard" [suppressClickEdit]="false"
          (gridReady)="onGridReady($event)" (cellValueChanged)="onCellValueChangedFacturas($event)"
          [enableBrowserTooltips]="true" [tooltipShowDelay]="300" [tooltipHideDelay]="100">
        </ag-grid-angular>
      </div>
    </div>

    <!-- Observación + botones -->
    <!-- Observación + botones -->
    <div class="buttons-row buttons-bottom">
  <!-- Botón Exportar con menú -->
  <button
    mat-button
    class="pill-btn pill-btn-outline"
    [matMenuTriggerFor]="menuExportar">
    Exportar
  </button>

  <mat-menu #menuExportar="matMenu">
    <button mat-menu-item (click)="exportarPdf()">PDF</button>
    <button mat-menu-item (click)="exportarExcel()">Excel</button>
  </mat-menu>

  <!-- Botón Cancelar -->
  <button
    mat-button
    type="button"
    class="pill-btn pill-btn-solid"
    (click)="cancelar()">
    Cancelar
  </button>
</div>


  </form>

  <!-- ===== PASO 2 (cuando lo uses) ===== -->
  <!-- Aquí irá el contenido de step === 2 más adelante -->

</div>
