<div class="page-container">

  <!-- TABS estilo traspasos -->
  <div class="tabs">
    <button
      type="button"
      [class.active]="selectedTab === 'cierre'"
      (click)="selectedTab = 'cierre'">
      Cierre de anticipos
    </button>

    <button
      type="button"
      [class.active]="selectedTab === 'liquidados'"
      (click)="selectedTab = 'liquidados'">
      Anticipos liquidados
    </button>
  </div>

  <!-- CONTENIDO con marco blanco estilo traspasos -->
  <div class="contenido-tablas">

    <!-- ================== CIERRE DE ANTICIPOS ================== -->
    <div *ngIf="selectedTab === 'cierre'">

      <h2 class="title">Cierre de Anticipos</h2>

      <!-- Filtros -->
      <form [formGroup]="filtroCierreForm" class="filters-row">
        <div class="filter-group">
          <label>Fecha inicial:</label>
          <input type="date" formControlName="fechaInicio" />
        </div>

        <div class="filter-group">
          <label>Fecha hasta:</label>
          <input type="date" formControlName="fechaHasta" />
        </div>

        <div class="filter-group">
          <label>Tipo de anticipo:</label>
          <select formControlName="tipoAnticipo">
            <option value="">(Todos)</option>
            <option value="Cirugía">Cirugía</option>
            <option value="Consulta">Consulta</option>
            <!-- aquí agregas tus tipos reales -->
          </select>
        </div>

        <div class="filter-group large">
          <label>Cliente:</label>
          <input type="text" formControlName="cliente" placeholder="Buscar cliente" />
        </div>
      </form>

      <!-- Botones -->
      <div class="buttons-row">
        <button type="button" class="btn primary" (click)="onNuevoCierre()">Nuevo</button>
        <button type="button" class="btn secondary" (click)="onBuscarCierre()">Buscar</button>
      </div>

      <!-- Tabla AG-Grid -->
      <div class="grid-wrapper ag-theme-alpine">
        <ag-grid-angular
          class="ag-grid"
          [rowData]="rowDataCierre"
          [columnDefs]="columnDefsCierre"
          [defaultColDef]="defaultColDef"
          [rowHeight]="32"
          [headerHeight]="32"
          (gridReady)="onGridReadyCierre($event)"
          (cellClicked)="onCellClickedCierre($event)">
        </ag-grid-angular>
      </div>
    </div>

    <!-- ================== ANTICIPOS LIQUIDADOS ================== -->
    <div *ngIf="selectedTab === 'liquidados'">

      <h2 class="title">Anticipos liquidados</h2>

      <!-- Filtros -->
      <form [formGroup]="filtroLiquidadosForm" class="filters-row">
        <div class="filter-group">
          <label>Fecha inicial:</label>
          <input type="date" formControlName="fechaInicio" />
        </div>

        <div class="filter-group">
          <label>Fecha hasta:</label>
          <input type="date" formControlName="fechaHasta" />
        </div>

        <div class="filter-group large">
          <label>Cliente:</label>
          <input type="text" formControlName="cliente" placeholder="Buscar cliente" />
        </div>
      </form>

      <!-- Botones -->
      <div class="buttons-row">
        <button type="button" class="btn primary" (click)="onNuevoLiq()">Nuevo</button>
        <button type="button" class="btn secondary" (click)="onBuscarLiq()">Buscar</button>
      </div>

      <!-- Tabla AG-Grid -->
      <div class="grid-wrapper ag-theme-alpine">
        <ag-grid-angular
          class="ag-grid"
          [rowData]="rowDataLiquidados"
          [columnDefs]="columnDefsLiquidados"
          [defaultColDef]="defaultColDef"
          [rowHeight]="32"
          [headerHeight]="32"
          (gridReady)="onGridReadyLiquidados($event)"
          (cellClicked)="onCellClickedLiquidados($event)">
        </ag-grid-angular>
      </div>
    </div>

  </div>
</div>
