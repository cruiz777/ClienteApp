<!-- src/app/components/sic-3000/descuento-form/descuento-form.component.html -->

<h2 mat-dialog-title>{{ titulo }}</h2>

<div mat-dialog-content class="df-container">
  <form [formGroup]="form" class="df-grid">

    <!-- Descripción (ancho completo) -->
    <div class="df-field df-full">
      <label class="df-label">
        Descripción<span class="df-required">*</span>
      </label>

      <mat-form-field appearance="outline" class="df-mat-field">
        <input matInput formControlName="descripcion" />
        <mat-error *ngIf="form.get('descripcion')?.hasError('required')">
          La descripción es obligatoria
        </mat-error>
      </mat-form-field>
    </div>

    <!-- Valor (%) -->
    <div class="df-field">
      <label class="df-label">
        Valor<span class="df-required">*</span>
      </label>

      <mat-form-field appearance="outline" class="df-mat-field">
        <input matInput type="number" formControlName="valor" />
        <span matSuffix>%</span>

        <mat-error *ngIf="form.get('valor')?.hasError('required')">
          El valor es obligatorio
        </mat-error>
        <mat-error *ngIf="form.get('valor')?.hasError('min') || form.get('valor')?.hasError('max')">
          Debe estar entre 0 y 100
        </mat-error>
      </mat-form-field>
    </div>

  </form>
</div>

<div mat-dialog-actions align="end" class="df-actions">
  <button mat-button (click)="cancelar()" [disabled]="guardando">Cancelar</button>
  <button mat-raised-button class="btn-azul" (click)="guardar()" [disabled]="guardando">
    {{ guardando ? 'Guardando...' : 'Guardar' }}
  </button>
</div>
