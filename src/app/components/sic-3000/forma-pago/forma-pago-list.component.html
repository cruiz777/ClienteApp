<!-- src/app/components/sic-3000/forma-pago/forma-pago-list.component.html -->

<div class="zona-container">
  <!-- Título + botón Nuevo -->
  <div class="zona-header">
    <h2>Formas de Pago</h2>
    <button mat-raised-button class="btn-azul" (click)="abrirCrear()">Nuevo</button>
  </div>

  <!-- Buscador -->
  <div class="zona-busqueda">
    <label for="search">Buscar:</label>
    <div class="input-wrapper">
      <input
        id="search"
        type="text"
        [(ngModel)]="searchTerm"
        (input)="buscar()"
        placeholder="Buscar forma de pago"
      />
      <img src="assets/icons/icon-buscar.png" alt="Buscar" />
    </div>
  </div>

  <!-- Mensaje de error -->
  <div *ngIf="error" class="state error">
    {{ error }}
  </div>

  <!-- Tabla -->
  <div class="table-wrap" *ngIf="!loading; else loadingTpl">
    <table class="zona-tabla">
      <thead>
        <tr>
          <th style="width: 140px;">Id Forma Pago</th>
          <th>Descripción</th>
          <th style="width: 180px;">Código Cuenta</th>
          <th class="col-opcion">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let it of filtered; trackBy: trackById">
          <td>{{ it.idFormaPago }}</td>
          <td>{{ it.descripcionPago }}</td>
          <td>{{ it.codigo_cuenta }}</td>

          <td class="acciones">
            <button
              type="button"
              class="icon-btn"
              (click)="abrirEditar(it)"
              title="Editar"
            >
              <img src="assets/icons/icon-modificar-3.png" alt="Editar" />
            </button>
          </td>
        </tr>

        <tr *ngIf="filtered.length === 0">
          <td colspan="4" class="empty">No hay resultados.</td>
        </tr>
      </tbody>
    </table>

    <div class="paginacion-info" *ngIf="totalItems">
      Mostrando {{ filtered.length }} de {{ totalItems }} registros
    </div>
  </div>

  <ng-template #loadingTpl>
    <div class="loading">Cargando...</div>
  </ng-template>
</div>
