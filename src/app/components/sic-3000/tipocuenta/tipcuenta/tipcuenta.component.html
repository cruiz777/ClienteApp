<div class="wrap">
  <div class="header">
    <h2>Tipos de Cuenta</h2>
    <button type="button" class="btn btn-refresh" (click)="cargar()" [disabled]="loading">
      Refrescar
    </button>
  </div>

  <div *ngIf="loading" class="state info">Cargando…</div>
  <div *ngIf="error" class="state error">{{ error }}</div>

  <table class="table" *ngIf="!loading">
    <thead>
      <tr>
        <th>IdTipoCuenta</th>
        <th>Tipcue</th>
        <th>Destip</th>
        <th>Tranban</th>
        <th class="col-accion">Editar</th>
        <th class="col-accion">Borrar</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let t of lista; trackBy: trackById">
        <td>{{ t.IdTipoCuenta }}</td>
        <td>{{ t.Tipcue }}</td>
        <td>{{ t.Destip }}</td>
        <td>{{ t.Tranban }}</td>
        <td>
          <button type="button" class="btn btn-edit" (click)="onEdit(t)" [disabled]="loading">
            Editar
          </button>
        </td>
        <td>
          <button type="button" class="btn btn-delete" (click)="onDelete(t)" [disabled]="loading">
            Borrar
          </button>
        </td>
      </tr>

      <tr *ngIf="!lista || lista.length === 0">
        <td colspan="6" class="empty">No hay registros para mostrar.</td>
      </tr>
    </tbody>
  </table>
</div>
