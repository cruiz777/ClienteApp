<div class="page">
  <header class="page-header">
    <h1>Mantenimiento de Productos</h1>

    <!-- Descripción solo etiqueta -->
    <div class="descripcion-static">
      <span class="lbl-strong">Descripción:</span>
      <span class="desc-titulo">Descripción del producto</span>
    </div>
  </header>

  <mat-tab-group
    class="tabs"
    [(selectedIndex)]="selectedTab"
    [disableRipple]="true"
    animationDuration="0ms">

    <!-- ========== Template reutilizable de botones ========== -->
  <ng-template #accionesTabs>
  <div class="pc-actions">
    <button type="button" class="btn-soft" (click)="onNuevo()">Nuevo</button>
    <button type="button" class="btn-soft" (click)="onGrabar()" [disabled]="currentFormInvalid">Grabar</button>
    <button type="button" class="btn-soft" (click)="onImprimir()">Imprimir</button>
    <button type="button" class="btn-soft" (click)="onAdjuntar()">Adjuntar</button>
  </div>
  </ng-template>

    <!-- ================= TAB 1: Datos Generales ================= -->
    <mat-tab label="Datos Generales">
      <form class="tab-body" [formGroup]="form" novalidate>
        <div class="tab-body">
          <div class="row">
            <div class="col-12">
              <h3 class="t5-title">Datos del Producto</h3>
            </div>
          </div>

          <div class="row g-3">
            <!-- Columna izquierda -->
            <div class="col-12 col-lg-8">
              <div class="row g-3 align-items-end">
                <div class="col-12 col-md-4">
                  <label class="label-sm d-block">Código Interno:</label>
                  <input class="input-line w-100" formControlName="codigoInterno">
                </div>

                <div class="col-12 col-md-4">
                  <label class="label-sm d-block">Código de Barras:</label>
                  <input class="input-line w-100" formControlName="codigoBarras">
                </div>

                <div class="col-12 col-md-4 d-flex align-items-center gap-2">
                  <span class="label-sm text-secondary">Generar</span>
                  <input type="checkbox" class="form-check-input" formControlName="generarCodigo">
                </div>

                <div class="col-12 col-md-6">
                  <label class="label-sm d-block">Descripción:</label>
                  <input class="input-line w-100" formControlName="descripcion1">
                </div>

                <div class="col-12 col-md-6">
                  <label class="label-sm d-block">Descripción en el punto de venta:</label>
                  <input class="input-line w-100" formControlName="descripcionPOS">
                </div>

                <div class="col-12 col-md-4">
                  <label class="label-sm d-block">Unidad de Venta:</label>
                  <div class="select-wrap">
                    <select class="select-line w-100" formControlName="unidadVenta">
                      <option [ngValue]="null" disabled selected>—</option>
                      <option *ngFor="let u of unidadesVenta; trackBy: trackByValue" [ngValue]="u">{{u}}</option>
                    </select>
                  </div>
                </div>

                <div class="col-12 col-md-4">
                  <label class="label-sm d-block">Cantidad:</label>
                  <input type="number" class="input-line w-100" formControlName="cantidad">
                </div>

                <div class="col-12 col-md-4">
                  <label class="label-sm d-block">Tipo Producto:</label>
                  <div class="select-wrap">
                    <select class="select-line w-100" formControlName="tipoProducto">
                      <option [ngValue]="null" disabled selected>—</option>
                      <option *ngFor="let t of tiposProducto; trackBy: trackByValue" [ngValue]="t">{{t}}</option>
                    </select>
                  </div>
                </div>

                <div class="col-12 col-md-4">
                  <label class="label-sm d-block">Existencia Global:</label>
                  <input class="input-line w-100" formControlName="existenciaGlobal">
                </div>

                <div class="col-12 col-md-4">
                  <label class="label-sm d-block">Cantidad Conversación:</label>
                  <input class="input-line w-100" formControlName="canCov">
                </div>

                <div class="col-12 col-md-4">
                  <label class="label-sm d-block">Presentación:</label>
                  <div class="select-wrap">
                    <select class="select-line w-100" formControlName="presentacion">
                      <option [ngValue]="null" disabled selected>—</option>
                      <option *ngFor="let p of presentaciones; trackBy: trackByValue" [ngValue]="p">{{p}}</option>
                    </select>
                  </div>
                </div>

                <div class="col-12 col-md-4">
                  <label class="label-sm d-block">Abreviación:</label>
                  <input class="input-line w-100" formControlName="abreviacion">
                </div>

                <div class="col-12 col-md-4">
                  <label class="label-sm d-block">Referencia:</label>
                  <input class="input-line w-100" formControlName="referencia">
                </div>

                <div class="col-12 col-md-4">
                  <label class="label-sm d-block">Fecha de Creación:</label>
                  <input type="date" class="input-line w-100" formControlName="fechaCreacion">
                </div>
                <div class="col-12 col-md-4">
                  <label class="label-sm d-block">Fecha de Modificación:</label>
                  <input type="date" class="input-line w-100" formControlName="fechaModificacion">
                </div>
              </div>
            </div>

            <!-- Columna derecha (checks + foto) -->
            <div class="col-12 col-lg-4">
              <div class="ps-lg-3 border-start-lg">
                <div class="row">
                  <div class="col-12">
                    <span class="fw-semibold small d-block mb-2 text-secondary">Opciones:</span>
                  </div>

                  <div class="col-12 col-md-6">
                    <div class="form-check mb-2"><input class="form-check-input" type="checkbox" formControlName="pagaIva" id="pagaIva"><label class="form-check-label" for="pagaIva">Paga IVA</label></div>
                    <div class="form-check mb-2"><input class="form-check-input" type="checkbox" formControlName="productoEnVenta" id="enVenta"><label class="form-check-label" for="enVenta">Producto en Venta</label></div>
                    <div class="form-check mb-2"><input class="form-check-input" type="checkbox" formControlName="cargarInventarios" id="inv"><label class="form-check-label" for="inv">Cargar a inventarios</label></div>
                    <div class="form-check mb-2"><input class="form-check-input" type="checkbox" formControlName="productoConPeso" id="peso"><label class="form-check-label" for="peso">Producto con Peso</label></div>
                    <div class="form-check mb-2"><input class="form-check-input" type="checkbox" formControlName="consumoInterno" id="interno"><label class="form-check-label" for="interno">Consumo Interno</label></div>
                  </div>

                  <div class="col-12 col-md-6">
                    <div class="form-check mb-2"><input class="form-check-input" type="checkbox" formControlName="manejaDecimales" id="dec"><label class="form-check-label" for="dec">Cant. con Decimales</label></div>
                    <div class="form-check mb-2"><input class="form-check-input" type="checkbox" formControlName="psicotropico" id="psi"><label class="form-check-label" for="psi">Psicotrópico</label></div>
                    <div class="form-check mb-2"><input class="form-check-input" type="checkbox" formControlName="estupefaciente" id="estu"><label class="form-check-label" for="estu">Estupefaciente</label></div>
                    <div class="form-check mb-2"><input class="form-check-input" type="checkbox" formControlName="activo" id="activo"><label class="form-check-label" for="activo">Activo</label></div>
                    <div class="form-check mb-2"><input class="form-check-input" type="checkbox" formControlName="altoRiesgo" id="alto"><label class="form-check-label" for="alto">Alto Riesgo</label></div>
                  </div>

                  <div class="col-12 mt-2">
                    <label class="label-sm d-block">URL foto Producto:</label>
                    <input class="input-line w-100" formControlName="urlFoto">
                    <div class="mt-2 d-flex">
                      <img *ngIf="form.value.urlFoto; else cuadroVacio"
                           [src]="form.value.urlFoto"
                           alt="foto" class="rounded-2 border object-fit-cover"
                           style="width:92px;height:92px;"/>
                      <ng-template #cuadroVacio>
                        <div class="rounded-2 border d-grid place-items-center text-secondary-emphasis"
                             style="width:92px;height:92px;font-size:12px;">Foto</div>
                      </ng-template>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div><!--/row-->

          <!-- Acciones -->
          <ng-container [ngTemplateOutlet]="accionesTabs"></ng-container>
        </div>
      </form>
    </mat-tab>

    <!-- ================= TAB 2: Datos Adicionales ================= -->
    <mat-tab label="Datos Adicionales">
      <div class="tab-body">
        <div class="row g-4">
          <!-- Columna izquierda -->
          <div class="col-lg-6">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="lbl">Color:</label>
                <input type="text" class="input-line" placeholder="| texto">
              </div>
              <div class="col-md-6">
                <label class="lbl">Sabor:</label>
                <input type="text" class="input-line" placeholder="| texto">
              </div>

              <div class="col-12">
                <label class="lbl">Tamaño / Talla:</label>
                <input type="text" class="input-line" placeholder="| texto">
              </div>

              <div class="col-12">
                <label class="lbl">Medidas:</label>
                <div class="row g-3">
                  <div class="col-4"><input type="text" class="input-line" placeholder="| texto"></div>
                  <div class="col-4"><input type="text" class="input-line" placeholder="| texto"></div>
                  <div class="col-4"><input type="text" class="input-line" placeholder="| texto"></div>
                </div>
              </div>

              <div class="col-12 mt-2"><div class="lbl-strong">Ubicación</div></div>
              <div class="col-md-4"><label class="lbl">Pasillo:</label><input type="text" class="input-line" placeholder="| texto"></div>
              <div class="col-md-4"><label class="lbl">Columna:</label><input type="text" class="input-line" placeholder="| texto"></div>
              <div class="col-md-4"><label class="lbl">Nivel:</label><input type="text" class="input-line" placeholder="| texto"></div>

              <div class="col-12">
                <label class="lbl">Tamaño / Talla:</label>
                <input type="text" class="input-line" placeholder="| texto">
              </div>

              <div class="col-12">
                <label class="lbl">Observación:</label>
                <div class="pc-panel" style="height: 150px;">
                  <textarea class="w-100 h-100" style="border:0; outline:0; background:transparent; resize:none;"></textarea>
                </div>
              </div>
            </div>
          </div>

          <!-- Columna derecha -->
          <div class="col-lg-6">
            <div class="mb-3">
              <div class="lbl-strong mb-1">Genérico</div>
              <div class="pc-panel" style="padding:0;">
                <table class="table table-sm mb-0" style="width:100%;">
                  <thead><tr><th style="width:140px;">Código</th><th>Descripción</th></tr></thead>
                  <tbody><tr><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td>&nbsp;</td><td>&nbsp;</td></tr></tbody>
                </table>
              </div>
            </div>

            <div class="mb-3">
              <label class="lbl">Reg. Sanitario:</label>
              <input type="text" class="input-line" placeholder="| texto">
            </div>

            <hr class="my-3">

            <div class="lbl-strong mb-2">Cuentas Contables</div>
            <div class="row g-3">
              <div class="col-md-6"><label class="lbl">Ventas:</label><input type="text" class="input-line"></div>
              <div class="col-md-6"><label class="lbl">Inventarios:</label><input type="text" class="input-line"></div>
              <div class="col-md-6"><label class="lbl">Costos:</label><input type="text" class="input-line"></div>
              <div class="col-md-6"><label class="lbl">Devolución:</label><input type="text" class="input-line"></div>
              <div class="col-md-6 d-flex align-items-center"><label class="lbl mb-0 me-2">Producto Gasto</label><input type="checkbox"></div>
              <div class="col-md-6"><label class="lbl">Gastos:</label><input type="text" class="input-line"></div>
            </div>
          </div>
        </div>

        <!-- Acciones -->
        <ng-container [ngTemplateOutlet]="accionesTabs"></ng-container>
      </div>
    </mat-tab>

  <!-- ================= TAB 3: Precios / Costos ================= -->
    <!-- ================= TAB 3: Precios / Costos ================= -->
<mat-tab label="Precios / Costos">
  <div class="tab-body" [formGroup]="preciosForm">
    <div class="row g-4">

      <!-- ===== Columna Izquierda: PRECIOS ===== -->
      <div class="col-12 col-lg-6">
        <div class="pc-panel">
          <h3 class="pc-title">Precios</h3>

          <!-- Fila 1: Precio Oficial | Precio RED-MSP -->
          <div class="pc-row duo">
            <div class="grp">
              <label class="lbl">Precio Oficial:</label>
              <div class="xs">
                <input
                  type="text" inputmode="decimal" maxlength="20"
                  class="input-line tint-blue"
                  formControlName="precioOficial"
                  (input)="onNumericInput('precioOficial')"
                  (blur)="formatDecimal('precioOficial',3)">
              </div>
            </div>
            <div class="grp">
              <label class="lbl">Precio RED-MSP:</label>
              <div class="xs">
                <input
                  type="text" inputmode="decimal" maxlength="20"
                  class="input-line tint-orange"
                  formControlName="precioRedMsp"
                  (input)="onNumericInput('precioRedMsp')"
                  (blur)="formatDecimal('precioRedMsp',3)">
              </div>
            </div>
          </div>

          <!-- Fila 2: PVP Actual - IVA (editable) -->
          <div class="pc-row">
            <label class="lbl">PVP Actual - IVA:</label>
            <div class="sm">
              <input
                type="text" inputmode="decimal" maxlength="20"
                class="input-line"
                formControlName="pvpActualIva"
                (input)="onNumericInput('pvpActualIva')"
                (blur)="formatDecimal('pvpActualIva',3)">
            </div>
          </div>

          <hr class="pc-sep">

          <!-- Fila 3: PVP Anterior + IVA | Fecha Anterior Modificar -->
          <div class="pc-row duo">
            <div class="grp">
              <label class="lbl">PVP Anterior + IVA:</label>
              <div class="xs">
                <input
                  type="text" inputmode="decimal" maxlength="20"
                  class="input-line tint-blue"
                  [readonly]="true"
                  formControlName="pvpAnteriorMasIva">
              </div>
            </div>
            <div class="grp">
              <label class="lbl">Fech.Ant.Mod:</label>
              <div class="xs">
                <input type="date" class="input-line w-100"
                       formControlName="fechaAnteriorModificarPrecio">
              </div>
            </div>
          </div>

          <!-- Fila 4: PVP Actual + IVA | Fecha Modificar -->
          <div class="pc-row duo">
            <div class="grp">
              <label class="lbl">PVP Actual + IVA:</label>
              <div class="xs">
                <input
                  type="text" inputmode="decimal" maxlength="20"
                  class="input-line tint-green"
                  [readonly]="true"
                  formControlName="pvpActualMasIva">
              </div>
            </div>
            <div class="grp">
              <label class="lbl">Fecha Modificación:</label>
              <div class="xs">
                <input type="date" class="input-line w-100"
                       formControlName="fechaModificarPrecio">
              </div>
            </div>
          </div>

          <hr class="pc-sep">

          <!-- Fila 5: Margen Utilidad % (solo lectura) -->
          <div class="pc-row">
            <label class="lbl">Margen Utilidad %:</label>
            <div class="sm">
              <input
                type="text" inputmode="decimal" maxlength="20"
                class="input-line w-100"
                [readonly]="true"
                formControlName="margenUtilidad">
            </div>
          </div>
        </div>
      </div>

      <!-- ===== Columna Derecha: COSTOS ===== -->
      <div class="col-12 col-lg-6">
        <div class="pc-panel">
          <h3 class="pc-title">Costos</h3>

          <!-- Fila 1: Costo Suministro | Costo Producto -->
          <div class="pc-row duo">
            <div class="grp">
              <label class="lbl">Costo Suministro:</label>
              <div class="xs">
                <input
                  type="text" inputmode="decimal" maxlength="20"
                  class="input-line"
                  formControlName="costoSuministro"
                  (input)="onNumericInput('costoSuministro')"
                  (blur)="formatDecimal('costoSuministro',3)">
              </div>
            </div>
            <div class="grp">
              <label class="lbl">Costo Producto:</label>
              <div class="xs">
                <input
                  type="text" inputmode="decimal" maxlength="20"
                  class="input-line"
                  formControlName="costoProducto"
                  (input)="onNumericInput('costoProducto')"
                  (blur)="formatDecimal('costoProducto',3)">
              </div>
            </div>
          </div>

          <!-- Fila 2: Costo Promedio (editable) -->
          <div class="pc-row">
            <label class="lbl">Costo Promedio:</label>
            <div class="sm">
              <input
                type="text" inputmode="decimal" maxlength="20"
                class="input-line"
                formControlName="costoPromedio"
                (input)="onNumericInput('costoPromedio')"
                (blur)="formatDecimal('costoPromedio',3)">
            </div>
          </div>

          <hr class="pc-sep">

          <!-- Fila 3: Precio Compra Anterior | Fecha Anterior Modificar -->
          <div class="pc-row duo">
            <div class="grp">
              <label class="lbl">Precio Compra Anterior:</label>
              <div class="xs">
                <input
                  type="text" inputmode="decimal" maxlength="20"
                  class="input-line"
                  formControlName="precioCompraAnterior"
                  (input)="onNumericInput('precioCompraAnterior')"
                  (blur)="formatDecimal('precioCompraAnterior',3)">
              </div>
            </div>
            <div class="grp">
              <label class="lbl">Fech.Ant.Mod:</label>
              <div class="xs">
                <input type="date" class="input-line w-100"
                       formControlName="fechaAnteriorModificarCompra">
              </div>
            </div>
          </div>

          <!-- Fila 4: Precio Compra Actual | Fecha Modificar -->
          <div class="pc-row duo">
            <div class="grp">
              <label class="lbl">Precio Compra Actual:</label>
              <div class="xs">
                <input
                  type="text" inputmode="decimal" maxlength="20"
                  class="input-line"
                  formControlName="precioCompraActual"
                  (input)="onNumericInput('precioCompraActual')"
                  (blur)="formatDecimal('precioCompraActual',3)">
              </div>
            </div>
            <div class="grp">
              <label class="lbl">Fecha Modificación:</label>
              <div class="xs">
                <input type="date" class="input-line w-100"
                       formControlName="fechaModificarCompra">
              </div>
            </div>
          </div>

          <hr class="pc-sep">

          <!-- Fila 5: Recepción % (editable) -->
          <div class="pc-row">
            <label class="lbl">Recepción %:</label>
            <div class="xs">
              <input
                type="text" inputmode="decimal" maxlength="20"
                class="input-line w-100"
                formControlName="recepcionPorcentaje"
                (input)="onNumericInput('recepcionPorcentaje')"
                (blur)="formatDecimal('recepcionPorcentaje',3)">
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Acciones -->
    <ng-container [ngTemplateOutlet]="accionesTabs"></ng-container>
  </div>
</mat-tab>

    <!-- ================= TAB 4: Estructura y Stock ================= -->
    <mat-tab label="Estructura y Stock">
      <ng-template matTabContent>
        @defer (on idle) {
          <div class="placeholder-tab">Contenido de “Estructura y Stock”</div>
          <ng-container [ngTemplateOutlet]="accionesTabs"></ng-container>
        } @placeholder {
          <div class="placeholder-tab">Cargando…</div>
        }
      </ng-template>
    </mat-tab>

  </mat-tab-group>
</div>
