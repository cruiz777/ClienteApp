<div class="password-dialog">
  <!-- HEADER -->
  <div class="dialog-header">
    <mat-icon class="header-icon">lock</mat-icon>
    <h2>{{ data.title || 'Confirmar identidad' }}</h2>
  </div>

  <!-- MENSAJE -->
  <div class="dialog-message" *ngIf="data.message">
    <p>{{ data.message }}</p>
  </div>

  <!-- FORM -->
  <form [formGroup]="form" class="dialog-form">

    <!-- CONTRASEÑA -->
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Contraseña</mat-label>
      <input
        matInput
        [type]="mostrarPassword ? 'text' : 'password'"
        formControlName="password"
        placeholder="Ingrese su contraseña"
        autocomplete="current-password"
      />
      <button mat-icon-button matSuffix type="button" (click)="togglePassword()">
        <mat-icon>{{ mostrarPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
      </button>
      <mat-error>{{ passwordError }}</mat-error>
    </mat-form-field>

    <!-- MOTIVO (opcional según config) -->
    <mat-form-field
      appearance="outline"
      class="full-width"
      *ngIf="data.motivoRequerido"
    >
      <mat-label>{{ data.motivoLabel || 'Motivo' }}</mat-label>
      <textarea
        matInput
        formControlName="motivo"
        rows="3"
        placeholder="Ingrese el motivo..."
      ></textarea>
      <mat-error>{{ motivoError }}</mat-error>
    </mat-form-field>

  </form>

  <!-- ACCIONES -->
  <div class="dialog-actions">
    <button mat-stroked-button (click)="onCancel()">
      {{ data.cancelText || 'Cancelar' }}
    </button>
    <button
      mat-raised-button
      color="warn"
      (click)="onConfirm()"
      [disabled]="form.invalid"
    >
      <mat-icon>check_circle</mat-icon>
      {{ data.confirmText || 'Confirmar' }}
    </button>
  </div>
</div>
