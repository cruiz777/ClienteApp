<h2 mat-dialog-title>Prefijo</h2>
<mat-dialog-content>
  <div *ngFor="let item of data.prefijos"
       (click)="seleccionar(item)"
       [class.seleccionado]="item.valor === seleccionado?.valor"
       class="prefijo-item">
    <strong>{{ item.valor }}</strong> — {{ item.descripcion }}
  </div>
</mat-dialog-content>

<mat-dialog-actions align="center">
  <button mat-button (click)="cancelar()">Cancelar</button>
  <button mat-raised-button color="primary" (click)="imprimirPDF()">Ok</button>
</mat-dialog-actions>

<!-- 🔒 Contenido oculto para imprimir -->
<div id="contenidoPDF" style="display: none;">
  <h3>Prefijo Seleccionado</h3>
  <p><strong>{{ seleccionado?.valor }}</strong> — {{ seleccionado?.descripcion }}</p>
</div>
