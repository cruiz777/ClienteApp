<div class="form-container" [class.edit-mode]="isEditMode" >
  <h2>{{ isEditMode ? 'Editar Bancos' : 'Nuevo Banco' }}</h2>

  <form [formGroup]="form" (ngSubmit)="guardar()">
    <div class="form-group">
      <label for="Descripcion">Descripción<span class="required">*</span></label>
      <input id="Descripcion" type="text" formControlName="Descripcion" placeholder="Ej: BANCO INTERNACIONAL" maxlength="250" style="text-transform: uppercase" 
      />
      <div class="error" *ngIf="form.get('Descripcion')?.invalid && form.get('Descripcion')?.touched">
        Campo obligatorio.
      </div>
    </div>

   <div class="form-group">
      <label for="CodigoEspecial">Codigo Especial <span class="required">*</span></label>
      <input id="CodigoEspecial" type="text" formControlName="CodigoEspecial" placeholder="Ej: TGBU890.."  maxlength="10" />
      <div class="error" *ngIf="form.get('CodigoEspecial')?.invalid && form.get('CodigoEspecial')?.touched">
        Campo obligatorio.
      </div>
    </div>
 
    <div class="form-actions">
       <button type="submit" class="btn-azul" [disabled]="form.invalid" [ngClass]="isEditMode ? 'btn-rojo' : 'btn-azul'">
          {{ isEditMode ? 'Actualizar' : 'Guardar' }}
      </button>
      <button type="button" class="cancel-button" (click)="cancelar()">Cancelar</button>
    </div>
  </form>
</div>
