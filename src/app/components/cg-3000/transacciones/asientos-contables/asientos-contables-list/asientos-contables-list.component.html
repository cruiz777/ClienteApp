/<!---->

<div class="zona-container">
  <div class="zona-header">
    <h2>Listado Asientos Contables</h2>
    <button type="button" class="btn-azul" (click)="abrirCrear()" >Nuevo Asiento</button>
  </div>

  <div class="filtros-asientos">
    <label for="search">Buscar:</label>
    <div class="input-wrapper">
      <input
        id="search"
        type="text"
        class="search-input"
        [(ngModel)]="searchTerm"
        placeholder="Buscar (empresa, beneficiario, tipo, numdoc...)"
      />
      <img src="assets/icons/icon-buscar.png" alt="Buscar" />
    </div>

        <div class="filtro-item">
        <label for="fechaDesde">Fecha Inicio</label>
        <input
          id="fechaDesde"
          type="date"
          [(ngModel)]="fechaDesde"
          class="fecha-control"
          placeholder="dd/mm/aaaa"
        />
      </div>

      <div class="filtro-item">
        <label for="fechaHasta">Fecha Final</label>
        <input
          id="fechaHasta"
          type="date"
          [(ngModel)]="fechaHasta"
          class="fecha-control"
          placeholder="dd/mm/aaaa"
        />
      </div>

      <button class="btn-buscar btn-verde"  (click)="aplicarFiltros()" placeholder="Buscar asientos" >
        Buscar
      </button>
  </div>

  <div class="table-wrap" *ngIf="!loading; else loadingTpl">
    <ag-grid-angular
      class="ag-theme-alpine grid custom-grid"
      [gridOptions]="gridOptions"
      [rowData]="rowData"
      [columnDefs]="columnDefs"
      [defaultColDef]="defaultColDef"
      rowSelection="single"
      [pagination]="true"
      [paginationPageSize]="20"
      [quickFilterText]="searchTerm"
      (gridReady)="onGridReady($event)"
      (cellClicked)="onCellClicked($event)">
    </ag-grid-angular>
  </div>

  <div *ngIf="error" class="error">{{ error }}</div>

  <ng-template #loadingTpl>
    <div class="loading">Cargando...</div>
  </ng-template>
</div>
