
  <div class="toolbar sticky-header">

      <div class="title">{{ titulo() }}</div>

      <div class="actions">
        <button class="btn primary"  (click)="guardar()" [disabled]="isReadOnly()">
          <ng-container *ngIf="modo() === 'nuevo'; else actualizarLbl">Guardar</ng-container>
          <ng-template #actualizarLbl>Actualizar</ng-template>
        </button>
        <button class="btn" (click)="cancelar()">Cancelar</button>
      </div>
    
</div>

<div class="content-scroll">
    <form [formGroup]="form" class="header-form">
      <div class="grid">
        <div class="form-group">
          <label for="idTipoAsiento">Control Tipo Asiento <span class="required" [ngClass]="{ 'edit-mode-label': modo() === 'editar' }" >*</span></label>
          <select
            id="IdTipoAsiento"
            class="control"
            [disabled]="modo() === 'editar'"
            [ngClass]="{ 'edit-mode-select': modo() === 'editar' }"
            formControlName="idTipoAsiento"
            [attr.title]="'Seleccione el tipo documento'"
          >
            <option [ngValue]="null" disabled>Seleccione...</option>
            <option *ngFor="let ta of (tiposAsiento$ | async)" [ngValue]="ta.IdTipoAsiento">
              {{ ta.TipAsiento }} — {{ ta.Descripcion }}
            </option>
          </select>
          <div class="error" *ngIf="form.get('idTipoAsiento')?.invalid && form.get('idTipoAsiento')?.touched">
            Campo obligatorio.
          </div>
        </div>
        <div class="form-group">
          <label>Número</label>
          <input class="control" type="number" formControlName="numdoc" />
          <div class="error" *ngIf="form.get('numdoc')?.invalid && form.get('numdoc')?.touched">
              Campo obligatorio.
          </div>
        </div>

        <div class="form-group">
          <label>Fecha</label>
          <input
            class="control"
            type="datetime-local"
            [value]="form.value.fechatransaccion | date:'yyyy-MM-ddTHH:mm'"
            (input)="form.patchValue({ fechatransaccion: $any($event.target).value })"
          />
        </div>
        
        <div class="form-group">
          <label>Concepto / Observación</label>
          <input class="control" type="text" formControlName="observacion" />
          <div class="error" *ngIf="form.get('observacion')?.invalid && form.get('observacion')?.touched">
              Campo obligatorio.
          </div>
        </div>

        <div class="form-group">
          <label>Zona *</label>
          <input class="control" type="number" formControlName="idZona" />
          <div class="error" *ngIf="form.get('idZona')?.invalid && form.get('idZona')?.touched">
              Campo obligatorio.
          </div>
        </div>
        <div class="form-group">
          <label>Beneficiario</label>
          <input class="control" type="text" formControlName="beneficiario" />
        </div>

        <!--
        <div class="field">
          <label>Tipo Asiento *</label>
          <input type="number" formControlName="idTipoAsiento" />
        </div>
        <div class="field">
          <label>Tip. Doc.</label>
          <input type="text" formControlName="tipdoc" />
        </div>
        <div class="field">
          <label>Año</label>
          <input type="text" formControlName="anio" />
        </div>

        <div class="field">
          <label>Solicitado</label>
          <input type="text" formControlName="solicitado" />
        </div>

        <div class="field">
          <label>Depto</label>
          <input type="text" formControlName="depto" />
        </div>

        <div class="field">
          <label>Autorizado</label>
          <input type="text" formControlName="autorizado" />
        </div>

        <div class="field">
          <label>Cierre</label>
          <input type="text" formControlName="cierre" />
        </div>

        <div class="field">
          <label>Fecha Cierre</label>
          <input
            type="datetime-local"
            [value]="form.value.fechacierre | date:'yyyy-MM-ddTHH:mm'"
            (input)="form.patchValue({ fechacierre: $any($event.target).value })"
          />
        </div>
        -->
        <div class="form-group">
          <label>Estado</label>
          <select class="control" formControlName="estado">
            <option [ngValue]="true">Activo</option>
            <option [ngValue]="false">Inactivo</option>
          </select>
        </div>
      </div>
    </form>
</div>
<div class="subtoolbar">
  <button class="btn" (click)="agregarLinea()" [disabled]="isReadOnly()" title="Añadir línea">
      <img src="assets/icons/aniadir.png" alt="" class="btn-add__icon">
  </button>
</div>

<ag-grid-angular
  class="ag-theme-alpine grid custom-grid"
  style="width: 100%; height: 380px"
  [gridOptions]="gridOptions"
  [rowData]="rowData()"
  [columnDefs]="columnDefs"
  [defaultColDef]="defaultColDef"
  [rowSelection]="'single'"
  [animateRows]="true"
  (gridReady)="onGridReady($event)"
  (cellClicked)="onCellClicked($event)"
  (cellValueChanged)="onCellValueChanged($event)">
</ag-grid-angular>

<div class="totales">
  <div class="tot">
    <span class="total-label">Total Debe:</span>
    <strong>{{ totDebe() | number:'1.2-2' }}</strong>
  </div>
  <div class="tot">
    <span class="total-label">Total Haber:</span>
    <strong>{{ totHaber() | number:'1.2-2' }}</strong>
  </div>
  <div class="tot diff" [class.ok]="diferencia() === 0" [class.bad]="diferencia() !== 0">
    <span class="total-label">Diferencia:</span>
    <strong>{{ diferencia() | number:'1.2-2' }}</strong>
  </div>
</div>
