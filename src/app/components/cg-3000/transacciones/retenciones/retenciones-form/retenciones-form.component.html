<div class="toolbar sticky-header">
  <div class="title">INGRESO DE RETENCIONES</div>

  <div class="actions">
    <button class="btn-verde" (click)="grabar()" [disabled]="loading">GRABAR</button>
    <button class="btn-verde" (click)="imprimir()" [disabled]="loading">IMPRIMIR</button>
    <button class="btn-verde" (click)="envioSRI()" [disabled]="loading">ENVIO SRI</button>
    <button class="btn-cancelar" (click)="cancelar()" [disabled]="loading">Cancelar</button>
  </div>
</div>

<div class="content-scroll">
  <form [formGroup]="headerForm" class="header-form header-compact">

    <div class="grid row-4">
      <div class="form-group" style="display: none;">
        <label>Empresa</label>
        <input class="control" formControlName="idempresa" readonly />
      </div>

      <div class="form-group" style="display: none;">
        <label>Cabecera Maestro</label>
        <input class="control" formControlName="idcabmaestro" readonly />
      </div>

      <div class="form-group">
        <label>Fecha Emisión</label>
        <input class="control" type="date" formControlName="fecha" [readonly]="readOnly" />
      </div>

      <div class="form-group">
        <label>R.U.C. / Cédula</label>
        <input class="control" formControlName="rucci" />
      </div>

      <div class="form-group">
        <label>Contribuyente</label>
        <input class="control" formControlName="contribuyente" />
      </div>

      <div class="form-group">
        <label>Dirección</label>
        <input class="control" formControlName="direccion" />
      </div>

      <div class="form-group">
        <label>Teléfono</label>
        <input class="control" formControlName="telefono" />
      </div>

      <div class="form-group" *ngIf="!readOnly">
        <label>Fecha Transacción</label>
        <input class="control" type="date" [value]="fechaTranView" readonly />
      </div>

      <div class="form-group span-2-left">
        <label>Autorización SRI</label>
        <input class="control" formControlName="autretencion" maxlength="49" />
      </div>

      <div class="form-group" style="display: none;">
        <label>Concepto</label>
        <input class="control" formControlName="concepto" />
      </div>

      <div class="form-group" style="display: none;">
        <label>NumDoc</label>
        <input class="control" formControlName="numdoc" />
      </div>

      <div class="form-group" style="display: none;">
        <label>Año</label>
        <input class="control" formControlName="anio" />
      </div>

      <div class="form-group" style="display: none;" >
        <label>Hora</label>
        <input class="control" formControlName="hora" />
      </div>

      <div class="form-group" style="display: none;">
        <label>TipoComp</label>
        <input class="control" formControlName="tipocomp" />
      </div>

      <div class="form-group" style="display: none;">
        <label>DesComp</label>
        <input class="control" formControlName="descomp" />
      </div>
    </div>

    
  </form>

  <div class="alerta-fecha" *ngIf="fechaTransWarnVisible">
      {{ fechaTransWarnMsg }}
  </div>

  <ag-grid-angular
    class="ag-theme-alpine custom-grid"
    style="width: 100%; height: 250px;"
    [rowData]="rowData"
    [columnDefs]="columnDefs"
    [defaultColDef]="defaultColDef"
    [gridOptions]="gridOptions"
    (gridReady)="onGridReady($event)"
    (rowClicked)="onRowClicked($event)"
    (cellValueChanged)="onCellValueChanged($event)"
    (cellClicked)="onCellClicked($event)">
  </ag-grid-angular>

<div class="totales-bar">

  <button
    type="button"
    class="btn-anular"
    (click)="anularRet()"
    [disabled]="loading || !canAnularRet()">
    ANULAR RETENCION
  </button>

  <div class="usr-grabador" *ngIf="readOnly && usuarioGrabadorNombre">
    USUARIO : {{ usuarioGrabadorNombre }}
  </div>


  <div class="totales-right">
    <div class="tot">
      <span class="total-label">Total Base:</span>
      <strong>{{ totBase | number:'1.2-2' }}</strong>
    </div>

    <div class="tot">
      <span class="total-label">Total Retenido:</span>
      <strong>{{ totValorRet | number:'1.2-2' }}</strong>
    </div>
  </div>
</div>

</div>
