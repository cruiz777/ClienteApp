<div class="page-wrapper-balance">

  <!-- Título -->
  <div class="page-title-row">
    <h1 class="page-title-balance">Balance de Comprobación</h1>
  </div>

  <!-- Panel de filtros -->
  <div class="filters-panel">

    <!-- Fila 1: Fechas + Acciones -->
    <div class="filters-top">
      <div class="filters-primary">
        <div class="filters-title">
          <div class="filters-title-main">Filtros</div>
        </div>
        <div class="primary-grid">
          <div class="fg">
            <label class="fg-label" for="fechaDesde">Fecha inicio</label>
            <input id="fechaDesde" type="date" [(ngModel)]="filtros.fechaDesde" class="fg-control" />
          </div>
          <div class="fg">
            <label class="fg-label" for="fechaHasta">Fecha final</label>
            <input id="fechaHasta" type="date" [(ngModel)]="filtros.fechaHasta" class="fg-control" />
          </div>
          <div class="mode-chipset">
            <button type="button" class="mode-chip" [class.active]="modoFiltro1 === 'cuenta'"
              (click)="toggleModoCuenta()">Por cuentas</button>
            <button type="button" class="mode-chip" [class.active]="modoFiltro2 === 'local' || modoFiltro3 === 'zona'"
              (click)="toggleModoLocal()">Por local</button>
          </div>
        </div>
      </div>

      <div class="filters-actions">
        <button type="button" class="btn-icon" (click)="consultar()" title="Buscar">
          <img src="assets/icons/buscar-down1.png" alt="Buscar" />
        </button>
        <button type="button" class="btn-icon" title="Exportar a Excel" (click)="exportExcel()">
          <img src="assets/icons/xls.png" alt="Excel" />
        </button>
        <button type="button" class="btn-icon" title="Exportar a PDF" (click)="exportPdf()">
          <img src="assets/icons/pdf-down.png" alt="PDF" />
        </button>
        <div class="status-pill" *ngIf="loading">Cargando…</div>
      </div>
    </div>

    <!-- Fila 2: Modo cuentas -->
    <div class="filters-bottom">
      <div class="secondary-grid">

        <!-- CUENTA A -->
        <div class="fg" *ngIf="modoFiltro1 === 'cuenta'">
          <label class="fg-label" for="cuentaA">Cuenta inicial</label>
          <div class="input-search-wrap">
            <input
              id="cuentaA"
              type="text"
              class="fg-control"
              [(ngModel)]="filtros.cuentaA"
              (input)="onBuscarCuenta('A', $event)"
              (blur)="onCuentaBlur('A'); cerrarDropdowns()"
              maxlength="50"
              placeholder="Código o nombre de cuenta..."
              autocomplete="off"
            />
            <span class="input-clear-icon" *ngIf="filtros.cuentaA" (mousedown)="seleccionarCuenta('A', {codigoPresentacion:'', nombreCuenta:''})">✕</span>

            <!-- Dropdown sugerencias A -->
            <ul class="search-dropdown" *ngIf="mostrarDropA">
              <li class="search-dropdown-item"
                *ngFor="let c of sugerenciasA"
                (mousedown)="seleccionarCuenta('A', c)">
                <span class="search-item-codigo">{{ c.codigoPresentacion }}</span>
                <span class="search-item-nombre">{{ c.nombreCuenta }}</span>
              </li>
              <li class="search-dropdown-empty" *ngIf="sugerenciasA.length === 0">
                Sin resultados
              </li>
            </ul>
          </div>
        </div>

        <!-- CUENTA B -->
        <div class="fg" *ngIf="modoFiltro1 === 'cuenta'">
          <label class="fg-label" for="cuentaB">Cuenta final</label>
          <div class="input-search-wrap">
            <input
              id="cuentaB"
              type="text"
              class="fg-control"
              [(ngModel)]="filtros.cuentaB"
              (input)="onBuscarCuenta('B', $event)"
              (blur)="onCuentaBlur('B'); cerrarDropdowns()"
              maxlength="50"
              placeholder="Código o nombre de cuenta..."
              autocomplete="off"
            />
            <span class="input-clear-icon" *ngIf="filtros.cuentaB" (mousedown)="seleccionarCuenta('B', {codigoPresentacion:'', nombreCuenta:''})">✕</span>

            <!-- Dropdown sugerencias B -->
            <ul class="search-dropdown" *ngIf="mostrarDropB">
              <li class="search-dropdown-item"
                *ngFor="let c of sugerenciasB"
                (mousedown)="seleccionarCuenta('B', c)">
                <span class="search-item-codigo">{{ c.codigoPresentacion }}</span>
                <span class="search-item-nombre">{{ c.nombreCuenta }}</span>
              </li>
              <li class="search-dropdown-empty" *ngIf="sugerenciasB.length === 0">
                Sin resultados
              </li>
            </ul>
          </div>
        </div>

      </div>
    </div>

    <!-- Fila 3: Local y Zona -->
    <div class="filters-bottom">
      <div class="secondary-grid">

        <div class="fg" *ngIf="modoFiltro2 === 'local'">
          <label class="fg-label">Local</label>
          <select class="fg-control" [(ngModel)]="filtros.idLocal" [ngModelOptions]="{ standalone: true }">
            <option [ngValue]="null">Seleccione</option>
            <option *ngFor="let local of localesResponse; trackBy: trackById" [ngValue]="local.id">
              {{ local.nombre }}
            </option>
          </select>
        </div>

        <div class="fg" *ngIf="modoFiltro3 === 'zona'">
          <label class="fg-label">Zona</label>
          <select class="fg-control" [(ngModel)]="filtros.idZona" [ngModelOptions]="{ standalone: true }">
            <option [ngValue]="null">Seleccione</option>
            <option *ngFor="let zona of zonaResponse; trackBy: trackByIdZona" [ngValue]="zona.idZona">
              {{ zona.nombre }}
            </option>
          </select>
        </div>

      </div>
    </div>

  </div>

  <!-- Tabla jerárquica -->
  <div class="table-wrap">
    <div class="grid-wrapper">
      <ag-grid-angular *ngIf="rowData.length" class="ag-theme-alpine" style="width: 100%; height: 100%;"
        [rowData]="rowData" [columnDefs]="columnDefs" [gridOptions]="gridOptions" (gridReady)="onGridReady($event)"
        (filterChanged)="onFilterChanged()" (sortChanged)="onSortChanged()" rowSelection="single">
      </ag-grid-angular>


      <div class="empty-state" *ngIf="!rowData.length && !loading">
        <div class="empty-title">Sin resultados</div>
        <div class="empty-sub">Ajusta los filtros y vuelve a consultar.</div>
      </div>
    </div>
  </div>

</div>
