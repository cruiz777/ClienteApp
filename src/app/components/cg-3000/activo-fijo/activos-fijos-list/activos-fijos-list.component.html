<div class="afl-container mat-elevation-z3">
  <div class="afl-header">
    <div class="afl-title">
      <mat-icon>inventory_2</mat-icon>
      <h2>Activos Fijos</h2>
      <span class="afl-total">Total: {{ total }}</span>
    </div>

    <div class="afl-actions">
      <mat-form-field appearance="outline" class="afl-search">
        <mat-label>Búsqueda</mat-label>
        <input matInput [(ngModel)]="q" (keyup.enter)="buscar()" placeholder="Código, descripción, custodio..." />
      </mat-form-field>

      <button mat-stroked-button (click)="buscar()">
        <mat-icon>search</mat-icon> Buscar
      </button>
<button mat-stroked-button type="button" (click)="exportarExcel()">
  <mat-icon>grid_on</mat-icon>
  Exportar Excel
</button>

      <button mat-raised-button color="primary" (click)="nuevo()">
        <mat-icon>add</mat-icon> Nuevo
      </button>
    </div>
  </div>

  <div class="afl-grid ag-theme-alpine">
    <ag-grid-angular
      style="width: 100%; height: 520px;"
      [rowData]="rowData"
      [columnDefs]="colDefs"
      [gridOptions]="gridOptions"
      (gridReady)="onGridReady($event)"
    ></ag-grid-angular>
  </div>
</div>
